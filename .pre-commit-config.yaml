# Wires `prek` (https://github.com/j178/prek), already an installed dev
# dependency (pyproject.toml's [dependency-groups] dev list), into an actual
# git pre-commit hook (issue #725). Before this file existed, `prek install`
# had nothing to wire up and .git/hooks/pre-commit stayed a default .sample
# file -- ruff/mypy defects were only caught by CI, after push.
#
# Every hook below shells out via `uv run --frozen` to the exact ruff/mypy
# versions and [tool.ruff]/[tool.mypy] config already pinned in
# pyproject.toml/uv.lock, rather than declaring a second copy of
# select/ignore/strict settings here -- see issue #725's own "Constraints".
#
# Setup: `uv run prek install -t pre-commit -t pre-push` (documented in
# CONTRIBUTING.md; also wired into flake.nix's devShell so `nix develop`
# installs it automatically).

# Issue #890 installs a pre-push shim as well as a pre-commit one. Without
# this, the ruff/mypy hooks below -- which declare no `stages` -- would start
# running on every push too, since an unset `stages` means "every installed
# stage". Their scope is unchanged from before #890: pre-commit only. The one
# hook that wants the pre-push stage names it explicitly.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format --check
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy (type check)
        # mypy resolves cross-file imports within each of the directory
        # groups .github/workflows/test.yml's own mypy job already checks
        # separately (two files share the literal basename
        # gitapex_check_acm_present.py in unrelated directories -- combining every
        # group into one invocation errors "Duplicate module named"), so
        # this hook type-checks each of those same groups via
        # .github/scripts/gitapex_run_precommit_mypy.py rather than only the
        # staged files. Residual risk named by issue #725 itself: this is
        # not scoped to changed files only, so it is not as fast as ruff
        # above on a large repo -- accepted for now, named as a follow-up
        # rather than left silently unscoped.
        entry: uv run --frozen python3 .github/scripts/gitapex_run_precommit_mypy.py
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      # Issue #890: betterleaks was SHA256-pinned in flake.nix with nothing
      # consuming it, so this repository had an approved, pinned
      # secret-detection capability and no secret detection actually running.
      # Both hooks shell out to the flake-pinned binary through
      # .github/scripts/gitapex_run_betterleaks.py rather than declaring
      # betterleaks' own published pre-commit repo with a `rev`, which would be
      # a second version source alongside flake.nix -- the same
      # two-different-versions split issue #678 exists to prevent, and the same
      # reason the hooks above route ruff and mypy through `uv run --frozen`.
      #
      # `pass_filenames: false` on both: betterleaks resolves its own scan
      # target from the git index (staged) or the commit graph (history), so a
      # filename list would be ignored at best and would narrow the scan at
      # worst. Both scopes are suppressed by .betterleaks.toml's allowlist,
      # which the eval fixtures under evals/ require -- see that file for why
      # the legacy [allowlist] block is used rather than an Expr filter.
      - id: betterleaks-staged
        name: betterleaks (staged secrets)
        entry: uv run --frozen python3 .github/scripts/gitapex_run_betterleaks.py --mode staged
        language: system
        pass_filenames: false
        require_serial: true

      # Full history rather than only the range being pushed, at a measured
      # 1.34s over 30.24MB. This is the backstop for a commit that never saw
      # the staged hook -- `git commit --no-verify`, an amend, or a history
      # rewrite -- so scoping it to the push range would leave exactly the gap
      # it exists to cover.
      - id: betterleaks-history
        name: betterleaks (full history secrets)
        stages: [pre-push]
        entry: uv run --frozen python3 .github/scripts/gitapex_run_betterleaks.py --mode history
        language: system
        pass_filenames: false
        require_serial: true
