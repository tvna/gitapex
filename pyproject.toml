[project]
name = "gitapex-scripts"
version = "0"
description = "Internal tooling and tests for gitapex's CI scripts."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "prek>=0.4.11",
]

[tool.uv]
# Non-package project: uv manages the environment and dev tools only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "skills/battle-testing-a-skill/scripts", "skills/evaluating-skill-quality/scripts", "skills/executing-a-branch-plan/scripts", "hooks"]
pythonpath = [".github/scripts", "skills/battle-testing-a-skill/scripts", "skills/scorer-gated-skill-edits/scripts", "skills/evaluating-skill-quality/scripts", "skills/auditing-agent-product-scope/scripts", "evals/scripts"]
addopts = "--cov=.github/scripts --cov=skills/battle-testing-a-skill/scripts --cov=skills/scorer-gated-skill-edits/scripts --cov=skills/evaluating-skill-quality/scripts --cov=skills/auditing-agent-product-scope/scripts --cov=evals/scripts --cov-report=term-missing"

[tool.coverage.run]
source = [".github/scripts", "skills/battle-testing-a-skill/scripts", "skills/scorer-gated-skill-edits/scripts", "skills/evaluating-skill-quality/scripts", "skills/auditing-agent-product-scope/scripts", "evals/scripts"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
