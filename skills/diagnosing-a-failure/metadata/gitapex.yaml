      reason: "First draft; one isolated evaluating-skill-quality dispatch (WELL-FORMED-NOT-MATURE, both gaps fixed) and one battle-testing-a-skill dispatch (findings fixed, one deferred) have run -- graduating to stable is a subsequent repository-owner decision, not automatic on a clean review pass"
