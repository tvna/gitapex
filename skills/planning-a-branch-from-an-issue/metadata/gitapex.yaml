apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: planning-a-branch-from-an-issue
spec:
  portability: Portable
  capabilityAssumption: Broad
  lifecycle:
    renamedFrom: issue-to-branch
  skillDependencies:
    requires: []
    relatedTo:
      - drafting-issues
      - diagnosing-a-failure
  executionRequirements:
    tools:
      read:
        - files
      write: []
      shell: []
  references:
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/818"
      summary: "Declared spec.executionRequirements.tools (W3 second slice, https://github.com/tvna/gitapex/issues/307): gitapex_check_acm_present.py reads a drafted body via --body/stdin; no writes, no subprocess/shell calls."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1155"
      summary: "Step 4's bare-defect-report path now routes a successfully-reproduced issue through the new diagnosing-a-failure skill before Step 5 begins; added to relatedTo."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1462"
      summary: "Step 5's re-verification now checks a consolidation/shared-module-shaped ACM row's file list against the calling repository's own redistribution boundary, mirroring evaluating-deterministic-gate-quality's dimension 12 (https://github.com/tvna/gitapex/issues/1456) at planning time instead of review time."
    - kind: audit
      anchor: "method:battle-testing-a-skill"
      summary: "An isolated dispatch on the issue-1462 diff returned FAIL with 2 findings: the trigger clause ('merge, import, or otherwise couple two or more files') was broad enough to match an ordinary row where one file merely calls another; and the check assumed every calling repository has a distribution-boundary concept at all."
      outcome:
        verdict: FAIL
        found: 2
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1462"
      summary: "Fixed both findings: narrowed the trigger to rows proposing to combine logic from two or more files into one shared file/module, explicitly excluding a row where one file merely calls or references another; added an explicit trivial-satisfaction clause for a repository with no distribution-boundary concept. Re-run of gitapex_check_skill_shape.py confirmed 51/51 unchanged."
    - kind: audit
      anchor: "method:evaluating-skill-quality"
      summary: "A second isolated re-audit, run after dimension 12's own directional-placement fix (https://github.com/tvna/gitapex/issues/1456) landed in the same PR, found Step 5's criterion had not been updated to match: it still required all combined files on the 'same side' of the boundary and flagged any boundary crossing, while the sibling dimension 12 it claims to mirror now permits a shared module placed on the deployed side. The parity claim was stale, not the trigger scoping this issue already fixed."
      outcome:
        verdict: WELL-FORMED-NOT-MATURE
    - kind: audit
      anchor: "method:battle-testing-a-skill"
      summary: "Same re-audit round: confirmed a concrete failure scenario -- an ACM row proposing a new shared module on the deployed side, importing from a never-deployed file, is valid under dimension 12's directional test but would still be wrongly flagged by Step 5's literal same-side wording."
      outcome:
        verdict: FAIL
        found: 1
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1462"
      summary: "Reworded Step 5's criterion to match dimension 12's directional test exactly: only flag when the row's own planned shared-file location would land on the never-deployed side, not merely when a boundary exists between the carriers. Re-run of gitapex_check_skill_shape.py confirmed 51/51."
