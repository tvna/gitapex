apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: scorer-gated-skill-edits
spec:
  portability: Mixed
  capabilityAssumption: Broad
  references:
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/30"
      summary: "scripts/gitapex_score_contract.py's docstring refers to a held-out gate, introduced here"
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/621"
      summary: "Added a Stop-boundary bullet: never report an isolated-dispatch selection score as this skill's Gate-step evidence when the scorer is itself a Skill-tool invocation, unless the isolated copy's plugin/marketplace registration was independently confirmed (points at evaluating-skill-quality's own Isolation-verification registry as the single source of truth, no recipe duplicated here). No procedure or gate mechanics changed; capabilityAssumption stays Broad."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/818"
      summary: "Declared spec.executionRequirements.tools (W3 second slice, https://github.com/tvna/gitapex/issues/307): gitapex_score_contract.py reads --assertions/--output/--scores file paths or stdin when omitted; no writes, no subprocess/shell calls."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/858"
      summary: "Reconciled output_contains/output_not_contains case semantics between waza's built-in expected.* grading (case-insensitive, pinned) and gitapex_score_contract.py's own case-sensitive contract (unchanged). Added a SKILL.md bullet stating the convention. Fixed gitapex_lint_fixture_assertions.py's check_case to prefer any exact-case anchor over an earlier differently-cased one, removing 18 false positives it had produced across the corpus."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/932"
      summary: "This skill becomes the repository's waza-dependent skill: shell gains waza and Procedure step 1 confirms the binary and records the version it reports, stopping rather than proceeding with an unattributable run. Chosen over a separate waza-runner skill because this skill already owns the scorer (scripts/gitapex_score_contract.py), the Precondition gate, and the Gate result; before this, every skill mentioning waza did so in prose only and none invoked it."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/932"
      summary: "Procedure step 7 gives the run record a stated contract, enumerating the fields a completed gate run must capture. The root cause catalogued in https://github.com/tvna/gitapex/issues/926 was that no procedure anywhere said what a run must record, so a schema alone would have pinned shape while repeating the omission. Both schemas ship in this skill's own references/ so a vendored copy carries the whole contract."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/932"
      summary: "executionRequirements.tools.write gains files, because Procedure step 7 now writes one. The prior empty list was true of a skill that only read and scored; leaving it unchanged while adding a write step would have left the sidecar asserting something its own Procedure contradicts."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/pull/944"
      summary: "A third outer-layer round found the gate object's own value ranges too loose: split was free text, so a train- or test-split verdict could be recorded as this gate's, and the mean pattern admitted values above 1.0 (1.25, 1.5). split is now const selection and both means are bounded to [0,1]. The same round's request to pin six decimals was declined -- that is this skill's bundled scorer's published precision, not every allowed scorer's."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/pull/944"
      summary: "The outer review layer's confirming pass caught the run record requiring the candidate's scores but not the gate outcome: a valid record could hold score files and free text with no verdict, no baseline, and no named split, so a later reader could not tell a kept edit from a rejected one. The Output section had always required those facts of the ephemeral report; the durable artifact had not. Added a required gate object, with both context costs enforced by an if/then when pruning-only."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/pull/944"
      summary: "The outer independent-review layer caught the score-file schema still describing itself as the attachment scores[].file points at, after the rename below moved that pointer list to score_files. The two shipped schemas therefore named incompatible paths for the same attachment -- a key-drift defect introduced by the fix for a key-drift defect, and one the inner layer's own re-read of its patch missed. Corrected to score_files[].file."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/pull/944"
      summary: "The pre-merge independent-review round caught the run record's pointer list being named scores, the same key the per-model score file already uses for a differently-shaped list -- the exact key-name drift this contract exists to stop, reintroduced by the contract itself. Renamed to score_files in both the Procedure and the schema."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/932"
      summary: "The first draft invoked the declared tool only for --version, leaving the Gate step describing scoring without naming what executes the trials -- close to the false-declaration risk that issue's own acceptance map flagged. Gate now names the run invocation and requires both sides of a comparison to come from the same runner version, model, and fixture set. Found by this branch's own quality-audit round."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/932"
      summary: "The first draft left the frontmatter description unchanged while making the runner a hard precondition, so the discovery surface promised a skill that needs only a scorer and a split. The description now names the runner requirement and the run record, matching scanning-ci-workflows, whose description names the two CLIs it wraps. Found by this branch's own quality-audit round, not by a reviewer."
    - kind: corroboration
      anchor: "https://github.com/microsoft/waza"
      summary: "The version interface Procedure step 1 depends on was verified against the pinned binary itself rather than from memory: waza --version prints a version string, and waza --help lists -v, --version as the version flag. Checked at the version flake.nix pins today."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/932"
      summary: "Portability stays Portable. An external, publicly available CLI is not origin-repository state, matching scanning-ci-workflows, whose Mixed level comes from two cited repo-owned documents rather than from its declared tools. Two constraints keep it true: step 7 names the target repository's own eval-results location generically instead of this repository's literal layout, and the version pin stays in flake.nix rather than in SKILL.md."
    - kind: deferral
      anchor: "https://github.com/tvna/gitapex/issues/926"
      summary: "Migrating the six committed run manifests onto this contract, and building the results drift gate, stay with that issue. This change supplies the owner and the schemas it was waiting on and deliberately does not retro-validate existing records; the run-record schema therefore permits additional keys rather than failing a record written before the contract existed."
    - kind: deferral
      anchor: "https://github.com/tvna/gitapex/issues/932"
      summary: ".gitapex/waza-eval.schema.json and .gitapex/waza-task.schema.json are not moved. They are upstream bytes vendored verbatim at a pinned release tag, guarded by recorded sha256 digests and a CI-only opt-in byte comparison; relocating third-party bytes into the deployed skill surface would break that provenance story. Same line https://github.com/tvna/gitapex/issues/834 drew for .gitapex/ssot.schema.json."
    - kind: caveat
      anchor: "https://github.com/tvna/gitapex/issues/932"
      summary: "The four fixtures added for the two new branches are declared coverage, not scored coverage: that issue ruled a suite re-run out of scope, so this skill's own improve-or-reject gate was not applied to this edit. Step 1 also becomes an unconditional first action for the eleven pre-existing fixtures, whose prompts predate it. Both limits are recorded in this skill's own evals/ eval-status.md rather than resolved here."
    - kind: audit
      anchor: "method:evaluating-skill-quality"
      summary: "Nine-dimension quality review of this SKILL.md and its references/ after the waza and run-record edits. Run in the authoring session's own thread rather than as an isolated subagent dispatch -- the session's harness directives ruled out self-initiated dispatch -- matching scanning-ci-workflows' own disclosed limitation rather than papering over it. Two findings, both fixed in-branch and recorded as correction entries above."
      outcome:
        verdict: WELL-FORMED-NOT-MATURE
        found: 2
        fixed: 2
    - kind: caveat
      anchor: "method:evaluating-skill-quality"
      summary: "Why that verdict stops at not-mature: dimension 2 (conciseness) does not clear. The body grew by roughly a third, most of it the run-record field enumeration, which is deliberate for a Broad capability assumption but is still a named gap rather than a clean pass. Dimensions 8 and 9 are named-unmeasured, which the rubric permits for those two specifically and which is not what holds the verdict back."
    - kind: audit
      anchor: "method:battle-testing-a-skill"
      summary: "Adversarial pass over the new runner-confirmation and run-recording surface. Same in-context (not isolated) limitation as the quality audit above, disclosed identically, and with the same consequence for cold enumeration. Three findings, all fixed before the PR was marked ready: a secondhand runner version was accepted as recordable, the new write step was unbounded, and transcript text was interpolated into a structured record with no escaping rule."
      outcome:
        verdict: FAIL
        found: 3
        fixed: 3
    - kind: correction
      anchor: "method:battle-testing-a-skill"
      summary: "Trust-boundary finding: step 1 required a version but did not say where it must come from, so a requester stating one satisfied it. The step now requires the version be obtained firsthand in the environment the trials run in, and the non-trigger control fixture was rewritten to state a version and ask for the check to be skipped, so it probes that boundary rather than rewarding the shortcut."
    - kind: correction
      anchor: "method:battle-testing-a-skill"
      summary: "Tool-scope and structured-output findings: the new write step named no bound, and free-text fields carried transcript content into a structured record with no escaping rule. Step 7 now records every value as data with transcript text escaped and instruction-shaped text quoted as material, and the Stop boundary names the record and its score files as the only things this skill writes."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1133"
      summary: "Supersedes the issue/932 entry above ('shell gains waza...', append-only): points this skill at evals/scripts/gitapex_run_eval_suite.py instead of waza. shell becomes [uv] (needs `uv run python3`, not bare python3). Step 1's confirmation becomes a `--help` dry-run plus a firsthand `git log -1 --format=%H`, replacing `--version`. Step 4's `waza run <eval spec>` becomes the runner's own flags plus a JSON-to-flat-score extraction step for gitapex_score_contract.py's unchanged `--compare-to`."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1133"
      summary: "Supersedes the issue/932 decision entry above ('Portability stays Portable...', append-only, not deleted): spec.portability changes Portable -> Mixed. evals/scripts/gitapex_run_eval_suite.py lives outside skills/scorer-gated-skill-edits/, at a repository-wide evals/scripts/ path, so the Portable definition no longer holds once step 1 names it default. Both run-record schemas stay in this skill's own references/; only the default-runner instruction is repository-scoped, hence Mixed."
    - kind: caveat
      anchor: "https://github.com/tvna/gitapex/issues/1133"
      summary: "The three fixtures naming waza literally were reworded to the new runner-confirmation shape so their assertions still match the updated SKILL.md. Not re-scored live: this repository still cannot issue an Anthropic API key for budget reasons, the same disclosed constraint the original four fixtures shipped under. Verified live instead: `--help` exits 0, `git log -1 --format=%H` resolves a commit, the extraction one-liner runs correctly, and every changed file validates against its own schema."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1648"
      summary: "Redivides the drafting-a-skill/scorer-gated-skill-edits boundary along a how-to-rewrite-vs-evaluate axis (design doc, 2026-08-31). Step 3 names drafting-a-skill as patch author, through its Step 6 only, Step 7 deferred. New required Step 9 dispatches drafting-a-skill's Step 7 once pre-ship, distinct from step 8's recommended pass. Two Stop boundaries reworded: step 9 as where review happens, drafting-a-skill as sole editor."
      outcome:
        baseCommit: "2ff00c34c897074a619d390c208d66e9c52cf7d3"
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1648"
      summary: "state-management axis 7 (writer-class-B, concurrent edits to one existing target from two peer dispatches sharing a checkout) closed for real this round: the Precondition gate's Relocate sub-step adds the missing explicit `cd` into the self-established worktree, then re-runs the Check comparison as its own completion criterion. An independent re-review confirmed this is a genuine, checkable construction, not restated assertion."
      outcome:
        baseCommit: "83eb216ebfda43d930a4a6a164545411fd9201e1"
    - kind: caveat
      anchor: "https://github.com/tvna/gitapex/issues/1648"
      summary: "the same round's Cleanup sub-step named `git worktree prune` as the way to clear a stale self-established worktree; per git's own docs, prune only clears admin metadata for a working tree already removed by other means, it does not remove one still on disk. Corrected to `git worktree remove <path>` (+ `git branch -d`), prune's real scope stated."
      outcome:
        baseCommit: "83eb216ebfda43d930a4a6a164545411fd9201e1"
  skillDependencies:
    requires:
      - drafting-a-skill
    relatedTo:
      - battle-testing-a-skill
      - evaluating-skill-quality
  executionRequirements:
    tools:
      read:
        - files
      write:
        - files
      shell:
        - uv
