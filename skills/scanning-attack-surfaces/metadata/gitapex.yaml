apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: scanning-attack-surfaces
spec:
  portability: Mixed
  capabilityAssumption: Adaptive
  references:
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/461"
      summary: "Designed this skill's model (exposure minimization and least privilege as two domain-agnostic checks), following a gap analysis showing evaluating-deterministic-gate-quality's Blast-radius axis, Security-level axis, and dimension 18 all miss an artifact's steady-state exposure or privilege design."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/307"
      summary: "Kept this skill explicitly distinct from docs/agent-product-scope.md's Axis B, a future runtime-enforcement adapter; this skill stays a review procedure producing findings and never performs or duplicates enforcement, named explicitly in SKILL.md to head off the name-resemblance conflation Axis B's own Non-conflation rule warns against."
    - kind: caveat
      anchor: ".github/workflows/post-merge-retro.yml"
      summary: "The worked example (paired with .github/scripts/gitapex_post_merge_retro.py) is this repository's own and explicitly illustrative; substitute the target's real equivalents rather than assuming this exact workflow or script exists elsewhere."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/455 -> https://github.com/tvna/gitapex/issues/456"
      summary: "Built as a standalone skill rather than a fifth axis on evaluating-deterministic-gate-quality, since least-privilege review applies to any artifact, not only deterministic gates, matching this repository's precedent of adjacent-but-separate security-review skills linked via relatedTo (screening-a-low-trust-contribution)."
    - kind: audit
      anchor: "method:evaluating-skill-quality"
      summary: "A same-session (in-context, not an isolated dispatch) self-review found and fixed three initial-build gaps: declaring capabilityAssumption Adaptive with zero references/ files (fixed by moving the worked example to references/worked-examples.md), two checks reading as loosely related with no unifying throughline, and no Stop boundary against live-executing a possibly-hostile reviewed artifact."
      outcome:
        verdict: gaps_fixed
        found: 3
        fixed: 3
    - kind: audit
      anchor: "method:battle-testing-a-skill"
      summary: "A real, non-waived battle-test pass is required for a new skill's description per gitapex_gate_skill_audit_disclosure.py's own rule. A prior fully-recursive-isolation attempt on this branch's earlier work got stuck in a self-dispatch retry loop and was abandoned; the first real pass instead ran as a single non-recursive subagent dispatch instructed not to spawn further subagents."
      outcome:
        verdict: setup_note
    - kind: audit
      anchor: "method:battle-testing-a-skill"
      summary: "First real battle-test (24 dimensions) disclosed this repo's CLAUDE.md was visible in-context with no suppression mechanism, marking every PASS provisional, and found four fixed gaps -- no missing/unreadable/empty-target handling, no install/vendoring integrity Stop boundary, no boundary against a persisted 'already reviewed' claim, no delimiter-safe quoting for a hostile artifact's quoted values."
      outcome:
        verdict: FAIL
        found: 5
        fixed: 4
        open: 1
    - kind: caveat
      anchor: "method:battle-testing-a-skill"
      summary: "In the first battle-test round, dimensions claim-provenance, deterministic-computation, regulatory-version, auditor-evidence-trail, and licensed-professional-deference were correctly graded N/A, since this skill's subject matter never touches legal/regulatory/numeric-exactness territory."
    - kind: audit
      anchor: "method:battle-testing-a-skill"
      summary: "A confirming, independent second single-dispatch re-run re-graded all 24 dimensions, re-located and confirmed the four previously-fixed gaps (9, 12, 13/15, 17) as now present and correctly worded, and reconfirmed the fifth (dimension 14) absent by directly listing the repository's real evals/ directory."
      outcome:
        verdict: FAIL
        found: 1
        fixed: 0
        open: 1
        confirmed: 4
    - kind: audit
      anchor: "https://github.com/tvna/gitapex/pull/463"
      summary: "This PR's own external Codex review found two gaps after both prior audit rounds: no skepticism toward a reviewed artifact's self-stated purpose in Procedure step 1, and a factually wrong exposure-minimization inventory in references/worked-examples.md; both fixed."
      outcome:
        verdict: FAIL
        found: 2
        fixed: 2
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/pull/463"
      summary: "Procedure step 1 now requires the exposure/privilege review baseline come from a dependency's actual documented contract, a trusted specification, or operator input, defaulting to indeterminate, rather than trusting a reviewed artifact's own self-stated purpose."
    - kind: correction
      anchor: "references/worked-examples.md"
      summary: "Corrected the worked example's exposure-minimization inventory: it wrongly claimed the create-issue POST sent owner, repo, PR number, PR title, and PR URL in the body; the real script sends owner/repo only in the URL path, discards pr_title before any request, and POSTs exactly three body fields."
    - kind: caveat
      anchor: "method:battle-testing-a-skill"
      summary: "After the operator questioned whether the two in-repo battle-test dispatches' disclosed CLAUDE.md-visibility contamination actually mattered, confirmed a Claude Code subagent dispatch cannot outrun it on its own: CLAUDE.md auto-loads by directory ancestry, not session identity, so any in-repo dispatch sees it regardless of freshness."
    - kind: audit
      anchor: "method:battle-testing-a-skill"
      summary: "A genuinely isolated CLAUDE.md-free re-run (disposable scratch dir with confirmed-empty CLAUDE.md/AGENTS.md ancestry, only the two relevant skill dirs copied in, invoked via `claude -p`, Task/Agent tools withheld) found one real new gap: dimension 18, reviewer-side claim-provenance, exemplified by the worked example itself misclaiming GitHub's issue-creation API requires title, body, and labels."
      outcome:
        verdict: FAIL
        found: 1
        fixed: 1
        resolved_pass_caveat: 18
    - kind: corroboration
      anchor: "https://docs.github.com/en/rest/issues/issues#create-an-issue"
      summary: "Verified directly against GitHub's own REST API reference that only `title` is required to create an issue; `body` and `labels` are optional, correcting the worked example's prior claim that the API required all three."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/pull/463"
      summary: "Procedure step 1 gained a matching skepticism rule for the reviewer's own recollection: the same rule barring trust in an artifact's self-description now also bars trusting the reviewer's unverified memory of a dependency's real contract, with the same indeterminate fallback."
    - kind: caveat
      anchor: "method:battle-testing-a-skill"
      summary: "Domain-added dimensions 17, 22, and 23 in the isolated confirmation round differ slightly in numbering from earlier rounds' own ad hoc additions to the base 22 dimensions; a numbering artifact, not a discrepancy in substance."
    - kind: elision
      anchor: "method:battle-testing-a-skill"
      summary: "The isolated round's dimension 14 grade came back INDETERMINATE rather than FAIL, correctly, since the disposable scratch copy had no repository-root evals/ directory reachable to inspect at all; a sandboxing artifact, not evidence the real gap changed shape."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/pull/442"
      summary: "Scoped this skill deliberately smaller than evaluating-deterministic-gate-quality's four-axis/eighteen-dimension build (two checks, one worked example at launch), the same way that skill itself grew a fourth axis later in a separate PR rather than all at once."
    - kind: decision
      anchor: "method:scanning-attack-surfaces"
      summary: "Confirmed no dedicated pre-written research report was required before building this skill category (issue 461's gap analysis was conducted directly during the build instead), since other 'first of category' skills (screening-a-low-trust-contribution, battle-testing-a-skill, scorer-gated-skill-edits, auditing-agent-product-scope) shipped with no lifecycle field at all."
    - kind: deferral
      anchor: "https://github.com/tvna/gitapex/issues/461"
      summary: "Deferred additional exposure/privilege sub-checks beyond the two shipped (exposure minimization, least privilege) to a future iteration, not built into this first version."
    - kind: deferral
      anchor: "method:battle-testing-a-skill"
      summary: "Dimension 14 (no committed evals/ regression corpus) remains the one open, accepted, disclosed launch gap, WAIVED at launch the same way evaluating-deterministic-gate-quality's own build disclosed the identical gap at its own launch."
      outcome:
        verdict: WAIVED
        open: 1
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/823"
      summary: "Declared spec.executionRequirements.tools (W3 third slice, https://github.com/tvna/gitapex/issues/307): Procedure step 1 performs static reading of the target artifact's own code/config (read); this skill's own Stop boundaries explicitly rule out both writing (\"Never take a write action\") and executing (\"Never execute the reviewed artifact\")."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/464 -> https://github.com/tvna/gitapex/issues/466"
      summary: "Preserves the prior rename lineage this entry's overwrite of spec.lifecycle.renamedFrom would otherwise drop: this skill shipped as evaluating-attack-surface, was renamed to vetting-attack-surface once the Vetting-* glossary family landed, and renamedFrom now records only the immediately-prior name per its own single-value shape."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/846"
      summary: "Renamed vetting-attack-surface to scanning-attack-surfaces, tracked under the scanning-* skill family roster, mechanical: git mv, renamedFrom updated, two pre-existing stale git-hosting-surface-audit mentions in SKILL.md fixed. Zero change to the two checks; the scanning-* family fit is aspirational pending a later, separately-tracked CLI-tool absorption."
    - kind: deferral
      anchor: "https://github.com/tvna/gitapex/issues/843"
      summary: "The scanning-* family fit named above (aspirational, pending absorption) is this tracking issue's own item 5: auditing-git-hosting-surface's full capability absorbed into this skill, including shell: [zizmor], sequenced after item 3 (this rename) and item 4 (scanning-ci-workflows) both land. Not yet filed as its own sub-issue at the time of this rename."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/848"
      summary: "Absorbed auditing-git-hosting-surface's full capability and deleted that standalone skill: platform detection, both platform checklists, scripts/gitapex_scan_unpinned_actions.py and its test, the Covered/Partial/Gap discipline, and its four eval tasks. Recorded here rather than in spec.lifecycle.renamedFrom, a single scalar already holding vetting-attack-surface; the diff adds zero skill directories, so the rename-lifecycle gate's retirement carve-out applies and it does not fire."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/848"
      summary: "Resolved the merged-verdict-style question the absorbing issue named as its own open design risk: the two vocabularies stay distinct as Mode A (exposure-minimal/excess, privilege-minimal/excess, indeterminate; one artifact) and Mode B (Covered/Partial/Gap; a repository's standing hosting configuration), selected by target kind rather than preference, sharing one discipline (per item, never aggregate; never upgrade an unproven item; read-only). Neither was flattened into the other."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/848"
      summary: "Declared shell: [zizmor], backing the least-privilege check for GitHub Actions workflow and composite-action artifacts only, invoked as zizmor --offline --no-progress --format=json. Every other artifact type has no zizmor coverage and stays manual static reading; SKILL.md requires the report to name which applied. No network block is declared: --offline is mandatory and enforced by a Stop boundary, matching scanning-ci-workflows' contract."
    - kind: corroboration
      anchor: "method:scanning-attack-surfaces"
      summary: "The zizmor backing is demonstrated, not asserted: a live run against .github/workflows/sync-agent-instructions.yml reported github-app at High confidence ('app token inherits blanket installation permissions', line 91) -- privilege-excess, where a static read of that file's own 'permissions: contents: read' block alone would have said minimal. Transcribed in references/worked-examples.md, which discloses the run used zizmor 1.29.0 from PyPI, not the pinned nixpkgs version."
  skillDependencies:
    requires:
      - evaluating-skill-quality
    relatedTo:
      - evaluating-deterministic-gate-quality
      - screening-a-low-trust-contribution
      - scanning-ci-workflows
  executionRequirements:
    tools:
      read:
        - files
      write: []
      shell:
        - zizmor
  lifecycle:
    renamedFrom: vetting-attack-surface
    experimental:
      reason: "First version of this skill category, deliberately scoped smaller than evaluating-deterministic-gate-quality's four-axis build and hardened by five audit rounds (self-review, two battle-testing-a-skill passes, an external Codex review, and an isolated confirmation run) before shipping; dimension 14 (no evals/ regression corpus) is the one open, accepted, disclosed launch gap. Full decision and audit history is in spec.references above."
      trackingIssue: "https://github.com/tvna/gitapex/issues/461"
