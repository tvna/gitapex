apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: collaborative-modeling
spec:
  portability: Portable
  capabilityAssumption: Broad
  skillDependencies:
    requires: []
    relatedTo:
      - drafting-an-acm-issue
  executionRequirements:
    tools:
      read:
        - files
      write:
        - files
      shell:
        - bash
  references:
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1163"
      summary: "New native skill supersedes the vendored obra/superpowers brainstorming mechanism, incorporating Domain-Driven Design elicitation/convergence techniques per this repository's own 2026-08-22 design record."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/823"
      summary: "Declared spec.executionRequirements.tools (W3 third slice, https://github.com/tvna/gitapex/issues/307): reads project context (files); writes the design doc and visual-companion screen files (files); shells out to scripts/start-server.sh and stop-server.sh (bash)."
    - kind: caveat
      anchor: "https://github.com/tvna/gitapex/issues/1163"
      summary: "skillDependencies.relatedTo names only drafting-an-acm-issue, this skill's own terminal-step fallback target. clairvoyance and architecture-tradeoff are vendored under .claude/skills/ (a different apm package, tvna/clairvoyance) and drafting-issues does not exist yet -- neither resolves as a skills/*/ sibling."
