apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: vetting-attack-surface
spec:
  portability: Mixed
  capabilityAssumption: Adaptive
  references:
    - "decision | https://github.com/tvna/gitapex/issues/461 | Designed this skill's model (exposure minimization and least privilege as two domain-agnostic checks), following a gap analysis showing evaluating-deterministic-gate-quality's Blast-radius axis, Security-level axis, and dimension 18 all miss an artifact's steady-state exposure or privilege design."
    - "decision | https://github.com/tvna/gitapex/issues/307 | Kept this skill explicitly distinct from docs/agent-product-scope.md's Axis B, a future runtime-enforcement adapter; this skill stays a review procedure producing findings and never performs or duplicates enforcement, named explicitly in SKILL.md to head off the name-resemblance conflation Axis B's own Non-conflation rule warns against."
    - "caveat | .github/workflows/post-merge-retro.yml | The worked example (paired with .github/scripts/post_merge_retro.py) is this repository's own and explicitly illustrative; substitute the target's real equivalents rather than assuming this exact workflow or script exists elsewhere."
    - "decision | https://github.com/tvna/gitapex/issues/455 -> https://github.com/tvna/gitapex/issues/456 | Built as a standalone skill rather than a fifth axis on evaluating-deterministic-gate-quality, since least-privilege review applies to any artifact, not only deterministic gates, matching this repository's precedent of adjacent-but-separate security-review skills linked via relatedTo (screening-a-low-trust-contribution)."
    - "audit | method:evaluating-skill-quality | A same-session (in-context, not an isolated dispatch) self-review found and fixed three initial-build gaps: declaring capabilityAssumption Adaptive with zero references/ files (fixed by moving the worked example to references/worked-examples.md), two checks reading as loosely related with no unifying throughline, and no Stop boundary against live-executing a possibly-hostile reviewed artifact. | verdict=gaps_fixed found=3 fixed=3"
    - "audit | method:battle-testing-a-skill | A real, non-waived battle-test pass is required for a new skill's description per gate_skill_audit_disclosure.py's own rule. A prior fully-recursive-isolation attempt on this branch's earlier work got stuck in a self-dispatch retry loop and was abandoned; the first real pass instead ran as a single non-recursive subagent dispatch instructed not to spawn further subagents. | verdict=setup_note"
    - "audit | method:battle-testing-a-skill | First real battle-test (24 dimensions) disclosed this repo's CLAUDE.md was visible in-context with no suppression mechanism, marking every PASS provisional, and found four fixed gaps -- no missing/unreadable/empty-target handling, no install/vendoring integrity Stop boundary, no boundary against a persisted 'already reviewed' claim, no delimiter-safe quoting for a hostile artifact's quoted values. | verdict=FAIL found=5 fixed=4 open=1"
    - "caveat | method:battle-testing-a-skill | In the first battle-test round, dimensions claim-provenance, deterministic-computation, regulatory-version, auditor-evidence-trail, and licensed-professional-deference were correctly graded N/A, since this skill's subject matter never touches legal/regulatory/numeric-exactness territory."
    - "audit | method:battle-testing-a-skill | A confirming, independent second single-dispatch re-run re-graded all 24 dimensions, re-located and confirmed the four previously-fixed gaps (9, 12, 13/15, 17) as now present and correctly worded, and reconfirmed the fifth (dimension 14) absent by directly listing the repository's real evals/ directory. | verdict=FAIL found=1 fixed=0 open=1 confirmed=4"
    - "audit | https://github.com/tvna/gitapex/pull/463 | This PR's own external Codex review found two gaps after both prior audit rounds: no skepticism toward a reviewed artifact's self-stated purpose in Procedure step 1, and a factually wrong exposure-minimization inventory in references/worked-examples.md; both fixed. | verdict=FAIL found=2 fixed=2"
    - "decision | https://github.com/tvna/gitapex/pull/463 | Procedure step 1 now requires the exposure/privilege review baseline come from a dependency's actual documented contract, a trusted specification, or operator input, defaulting to indeterminate, rather than trusting a reviewed artifact's own self-stated purpose."
    - "correction | references/worked-examples.md | Corrected the worked example's exposure-minimization inventory: it wrongly claimed the create-issue POST sent owner, repo, PR number, PR title, and PR URL in the body; the real script sends owner/repo only in the URL path, discards pr_title before any request, and POSTs exactly three body fields."
    - "caveat | method:battle-testing-a-skill | After the operator questioned whether the two in-repo battle-test dispatches' disclosed CLAUDE.md-visibility contamination actually mattered, confirmed a Claude Code subagent dispatch cannot outrun it on its own: CLAUDE.md auto-loads by directory ancestry, not session identity, so any in-repo dispatch sees it regardless of freshness."
    - "audit | method:battle-testing-a-skill | A genuinely isolated CLAUDE.md-free re-run (disposable scratch dir with confirmed-empty CLAUDE.md/AGENTS.md ancestry, only the two relevant skill dirs copied in, invoked via `claude -p`, Task/Agent tools withheld) found one real new gap: dimension 18, reviewer-side claim-provenance, exemplified by the worked example itself misclaiming GitHub's issue-creation API requires title, body, and labels. | verdict=FAIL found=1 fixed=1 resolved_pass_caveat=18"
    - "corroboration | https://docs.github.com/en/rest/issues/issues#create-an-issue | Verified directly against GitHub's own REST API reference that only `title` is required to create an issue; `body` and `labels` are optional, correcting the worked example's prior claim that the API required all three."
    - "decision | https://github.com/tvna/gitapex/pull/463 | Procedure step 1 gained a matching skepticism rule for the reviewer's own recollection: the same rule barring trust in an artifact's self-description now also bars trusting the reviewer's unverified memory of a dependency's real contract, with the same indeterminate fallback."
    - "caveat | method:battle-testing-a-skill | Domain-added dimensions 17, 22, and 23 in the isolated confirmation round differ slightly in numbering from earlier rounds' own ad hoc additions to the base 22 dimensions; a numbering artifact, not a discrepancy in substance."
    - "elision | method:battle-testing-a-skill | The isolated round's dimension 14 grade came back INDETERMINATE rather than FAIL, correctly, since the disposable scratch copy had no repository-root evals/ directory reachable to inspect at all; a sandboxing artifact, not evidence the real gap changed shape."
    - "decision | https://github.com/tvna/gitapex/pull/442 | Scoped this skill deliberately smaller than evaluating-deterministic-gate-quality's four-axis/eighteen-dimension build (two checks, one worked example at launch), the same way that skill itself grew a fourth axis later in a separate PR rather than all at once."
    - "decision | method:vetting-attack-surface | Confirmed no dedicated pre-written research report was required before building this skill category (issue 461's gap analysis was conducted directly during the build instead), since other 'first of category' skills (screening-a-low-trust-contribution, battle-testing-a-skill, scorer-gated-skill-edits, auditing-agent-product-scope) shipped with no lifecycle field at all."
    - "deferral | https://github.com/tvna/gitapex/issues/461 | Deferred additional exposure/privilege sub-checks beyond the two shipped (exposure minimization, least privilege) to a future iteration, not built into this first version."
    - "deferral | method:battle-testing-a-skill | Dimension 14 (no committed evals/ regression corpus) remains the one open, accepted, disclosed launch gap, WAIVED at launch the same way evaluating-deterministic-gate-quality's own build disclosed the identical gap at its own launch. | verdict=WAIVED open=1"
  skillDependencies:
    requires:
      - evaluating-skill-quality
    relatedTo:
      - evaluating-deterministic-gate-quality
      - screening-a-low-trust-contribution
      - auditing-git-hosting-surface
  lifecycle:
    renamedFrom: evaluating-attack-surface
    experimental:
      reason: "First version of this skill category, deliberately scoped smaller than evaluating-deterministic-gate-quality's four-axis build and hardened by five audit rounds (self-review, two battle-testing-a-skill passes, an external Codex review, and an isolated confirmation run) before shipping; dimension 14 (no evals/ regression corpus) is the one open, accepted, disclosed launch gap. Full decision and audit history is in spec.references above."
      trackingIssue: "https://github.com/tvna/gitapex/issues/461"
