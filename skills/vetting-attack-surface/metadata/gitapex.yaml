apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: vetting-attack-surface
spec:
  portability: Mixed
  capabilityAssumption: Adaptive
  references:
    - "This skill's model (exposure minimization and least privilege as two domain-agnostic checks) was designed in https://github.com/tvna/gitapex/issues/461, following a gap analysis that evaluating-deterministic-gate-quality's existing axes and dimension 18 do not cover an artifact's steady-state exposure or privilege design. Full detail: references/gitapex-history.md#exposure-and-least-privilege-model-origin"
    - "Explicitly distinct from docs/agent-product-scope.md's Axis B (https://github.com/tvna/gitapex/issues/307), which is a future runtime-enforcement adapter; this skill is a review procedure producing findings, never enforcement. Full detail: references/gitapex-history.md#relationship-to-axis-b"
    - "The worked example (.github/workflows/post-merge-retro.yml and .github/scripts/post_merge_retro.py) is this repository's own, explicitly illustrative -- substitute the target's actual equivalents rather than assuming this exact workflow or script exists elsewhere."
    - "Built as a standalone skill rather than a fifth axis on evaluating-deterministic-gate-quality, decided with the operator during https://github.com/tvna/gitapex/issues/455 and https://github.com/tvna/gitapex/issues/456's own work, since least-privilege review applies to any artifact, not only deterministic gates. Full detail: references/gitapex-history.md#standalone-skill-decision"
    - "A same-session evaluating-skill-quality self-review (in-context, not isolated) found and fixed three gaps in the initial build: a references/ split not yet justified, the two checks reading as loosely related, and no Stop boundary against live-executing a hostile artifact. Full detail: references/gitapex-history.md#evaluating-skill-quality-self-review"
    - "A real, non-waived battle-testing-a-skill pass (single non-recursive subagent dispatch) disclosed CLAUDE.md visibility with no suppression mechanism and returned overall verdict FAIL, with five concrete gaps found (four fixed, one accepted launch gap). Full detail: references/gitapex-history.md#first-battle-testing-a-skill-round"
    - "A confirming battle-testing-a-skill re-run independently re-graded all 24 dimensions, confirming the four previously-fixed gaps and reconfirming the fifth (missing evals/ regression corpus) absent by directly listing the repository's evals/ directory. Full detail: references/gitapex-history.md#confirming-battle-testing-a-skill-re-run"
    - "PR https://github.com/tvna/gitapex/pull/463's own external Codex review found two real gaps: no skepticism toward a reviewed artifact's self-stated purpose, and a factually wrong exposure-minimization inventory in references/worked-examples.md; both fixed. Full detail: references/gitapex-history.md#external-codex-review"
    - "After the operator questioned whether in-repo CLAUDE.md-visibility contamination mattered, a genuinely isolated CLAUDE.md-free re-run found one real new FAIL (dimension 18, reviewer-side claim-provenance), fixed it, and resolved the isolation caveat on the prior PASSes. Full detail: references/gitapex-history.md#isolated-confirmation-round"
  skillDependencies:
    requires:
      - evaluating-skill-quality
    relatedTo:
      - evaluating-deterministic-gate-quality
      - screening-a-low-trust-contribution
      - auditing-git-hosting-surface
  lifecycle:
    renamedFrom: evaluating-attack-surface
    experimental:
      reason: "First version of this skill category, built from a gap analysis conducted during this build (https://github.com/tvna/gitapex/issues/461), scoped deliberately smaller than evaluating-deterministic-gate-quality's four-axis build and hardened by five audit rounds before shipping; dimension 14 (no evals/ regression corpus) remains the one open, accepted, disclosed launch gap. Full detail: references/gitapex-history.md#experimental-lifecycle-rationale"
      trackingIssue: "https://github.com/tvna/gitapex/issues/461"
