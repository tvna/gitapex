apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: battle-testing-a-skill
spec:
  portability: Mixed
  capabilityAssumption: Adaptive
  references:
    - "These are external projects cited only as corroboration; the skill does not depend on them and does not bundle them."
    - "The clairvoyance project (public, MIT-licensed: https://github.com/tvna/clairvoyance) runs its own adversarial battle harness over its skills; its five scenario categories recur across this skill's dimensions, and its portability write-up describes the exact gap this skill fixes: a foreign harness with no rubric injected cannot say why a skill is weak. Full detail: references/gitapex-history.md#clairvoyance-corroboration-and-portability-write-up"
    - "microsoft/waza ships a `waza adversarial` command for offline adversarial / fault-injection packs -- a separate implementation of a related idea."
    - "Neither is authoritative for how a model actually reasons about adversarial skill-testing; the source of record for the skill is the observed cross-model behavior recorded in `skills/battle-testing-a-skill/references/provenance-and-caveats.md`."
    - "For readers working in this repository (gitapex), dimensions 11-17 of that catalog were added by a comparative review tracked in https://github.com/tvna/gitapex/issues/74, checking coverage against obra/superpowers and microsoft/waza (the same two side-references above). See the references file's \"Comparative review\" section for what that review verified directly versus what remains unmeasured or secondary-sourced."
    - "SKILL.md's \"Connection to the held-out gate\" section names `scorer-gated-skill-edits` as this repo's example consumer of a battle-test verdict, kept portable (no issue citation there). For readers working in this repository: the design lineage and PR landing are recorded in full. Full detail: references/gitapex-history.md#held-out-gate-design-lineage-issue-25-pr-29"
    - "For readers working in this repository (gitapex): the CLAUDE.md-contamination incident recorded in provenance-and-caveats.md's 'Variance re-measurement' section is https://github.com/tvna/gitapex/issues/242 (retrospective, Repairs item 3); the Procedure step 1 exclusion requirement it produced landed via https://github.com/tvna/gitapex/issues/250."
    - "For readers working in this repository (gitapex): tracking issue 261 (self-audit of battle-testing-a-skill and evaluating-skill-quality) resolved most of its findings directly in this file, across several dimensions and Stop-boundary bullets. Full detail: references/gitapex-history.md#self-audit-tracking-issue-261-resolved-findings"
    - "For readers working in this repository (gitapex): tracking issue 261 deferred two findings from this file -- a dedicated regression corpus (handed to issue 364) and a CLAUDE.md-exclusion enforcement-hook question, decided rather than deferred. Full detail: references/gitapex-history.md#self-audit-tracking-issue-261-deferred-findings-issue-364"
    - "For readers working in this repository (gitapex): issue 475 fixed a drift between this skill's Procedure step 1 CLAUDE.md-exclusion check and evaluating-skill-quality's Isolation verification registry, deferring to that registry instead of a weaker inline check; a same-PR Codex review (PR 478) further tightened the fix's own phrasing. Full detail: references/gitapex-history.md#claudemd-exclusion-isolation-drift-fix-issue-475-and-codex-review-pr-478"
  skillDependencies:
    requires:
      - evaluating-skill-quality
    relatedTo:
      - scorer-gated-skill-edits
      - untrusted-input-triage
