apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: battle-testing-a-skill
spec:
  portability: Mixed
  capabilityAssumption: Adaptive
  references:
    - "These are external projects cited only as corroboration; the skill does not depend on them and does not bundle them."
    - "The clairvoyance project (public, MIT-licensed: <https://github.com/tvna/clairvoyance>) runs an adversarial \"battle\" harness over its own skills, described in `battle/README.md` as \"a local, advisory harness that stress-tests the skills against hostile inputs -- separate from `waza`.\" Its five scenario categories (`scenarios/injection/`, `scenarios/guardrails/`, `scenarios/routing/`, `scenarios/depth-gate/`, `scenarios/encoding/`) recur across the extracted core here, which corroborates but does not originate this skill -- the mapping between the two category sets was previously carried as a table inside `adversarial-dimensions.md` and was removed from the distributed skill; this citation is its replacement, kept here as maintainer-facing corroboration rather than as skill content. The same project's portability write-up describes the exact failure this skill exists to fix: a foreign harness asked to evaluate a skill has no rubric injected and cannot say why a skill is weak."
    - "microsoft/waza ships a `waza adversarial` command for offline adversarial / fault-injection packs -- a separate implementation of a related idea."
    - "Neither is authoritative for how a model actually reasons about adversarial skill-testing; the source of record for the skill is the observed cross-model behavior recorded in `skills/battle-testing-a-skill/references/provenance-and-caveats.md`."
    - "For readers working in this repository (gitapex), dimensions 11-17 of that catalog were added by a comparative review tracked in gitapex#74, checking coverage against obra/superpowers and microsoft/waza (the same two side-references above). See the references file's \"Comparative review\" section for what that review verified directly versus what remains unmeasured or secondary-sourced."
    - "SKILL.md's \"Connection to the held-out gate\" section names `scorer-gated-skill-edits` as this repo's example of a skill consuming a battle-test verdict as a scorer, without an issue citation (kept portable). For readers working in this repository: that connection traces to gitapex#25 (closed design issue, \"design a held-out-gated skill-training loop, scoped to verifiable tasks\"), whose component 2 this skill implements; `scorer-gated-skill-edits` itself is the component-1 implementation, landed via PR #29."
    - "For readers working in this repository (gitapex): the CLAUDE.md-contamination incident recorded in provenance-and-caveats.md's 'Variance re-measurement' section is gitapex#242 (retrospective, Repairs item 3); the Procedure step 1 exclusion requirement it produced landed via gitapex#250."
    - "gitapex#261 (self-audit tracking issue: battle-testing-a-skill and evaluating-skill-quality applied to themselves) resolved most of its findings directly in this file: dimensions 1/2, 9, and 17 gained explicit Procedure step 2 clauses; dimension 12 and the dimensions 13/15/16 self-application gained Stop-boundary bullets; dimension 11 gained the non-authoritative-verdict paragraph in 'Connection to the held-out gate' plus a reinforcing Stop-boundary bullet; the dimension-2 CLAUDE.md-exclusion duplication between Procedure step 1 and Stop boundaries was folded into a single cross-reference."
    - "gitapex#261 deferred two findings from this file with a stated reason rather than resolving them there: dimension 14 (a dedicated regression corpus for this file's own guardrail prose, distinct from evals/battle-testing-a-skill/'s existing corpus that tests this skill's grading behavior against arbitrary fed-in targets) was handed to gitapex#364; the CLAUDE.md-exclusion enforcement-hook question was decided, not deferred -- no hook was added, because a PreToolUse hook can inspect tool-call arguments but not the harness's auto-injected CLAUDE.md context, so it cannot verify the exclusion actually held from the tool-call surface alone. This boundary stays prose-only in gitapex today, backed by the observable check Procedure step 1 already requires, until a harness exposes a hookable signal for injected-context contents."
  skillDependencies:
    requires: []
    relatedTo:
      - scorer-gated-skill-edits
      - untrusted-input-triage
