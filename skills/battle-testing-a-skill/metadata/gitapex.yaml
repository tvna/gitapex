apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: battle-testing-a-skill
spec:
  portability: Mixed
  capabilityAssumption: Adaptive
  references:
    - kind: caveat
      anchor: "method:battle-testing-a-skill"
      summary: "The clairvoyance and microsoft/waza projects cited below are external corroboration only; this skill neither depends on nor bundles either project."
    - kind: corroboration
      anchor: "https://github.com/tvna/clairvoyance"
      summary: "The clairvoyance project (public, MIT-licensed) runs its own adversarial battle harness over its skills; its five scenario categories (injection, guardrails, routing, depth-gate, encoding) recur across this skill's dimensions, and its portability write-up describes the exact gap this skill fixes: a foreign harness with no rubric injected cannot say why a skill is weak."
    - kind: corroboration
      anchor: "https://github.com/microsoft/waza"
      summary: "microsoft/waza ships a `waza adversarial` command for offline adversarial / fault-injection packs -- a separate implementation of a related idea."
    - kind: caveat
      anchor: "skills/battle-testing-a-skill/references/provenance-and-caveats.md"
      summary: "Neither clairvoyance nor microsoft/waza is authoritative for how a model reasons about adversarial skill-testing; the source of record is the observed cross-model behavior recorded in this file."
    - kind: audit
      anchor: "https://github.com/tvna/gitapex/issues/74"
      summary: "Dimensions 11-17 of the adversarial-dimensions catalog were added by a comparative review checking coverage against obra/superpowers and microsoft/waza; see provenance-and-caveats.md's Comparative review section for what was verified directly versus unmeasured or secondary-sourced."
    - kind: elision
      anchor: "skills/battle-testing-a-skill/SKILL.md"
      summary: "SKILL.md's \"Connection to the held-out gate\" section names scorer-gated-skill-edits as this repo's example consumer of a battle-test verdict, without an issue citation there, deliberately, to keep that section Portable."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/25 -> https://github.com/tvna/gitapex/pull/29"
      summary: "That held-out-gate connection traces to issue 25 (design a held-out-gated skill-training loop, scoped to verifiable tasks), whose component 2 this skill implements; scorer-gated-skill-edits is the component-1 implementation, landed via this pull request."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/242"
      summary: "The CLAUDE.md-contamination incident recorded in provenance-and-caveats.md's \"Variance re-measurement\" section is this repository's issue 242 (retrospective, Repairs item 3)."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/250"
      summary: "The Procedure step 1 CLAUDE.md-exclusion requirement produced by the issue-242 contamination incident landed via this issue."
    - kind: audit
      anchor: "https://github.com/tvna/gitapex/issues/261"
      summary: "Self-audit tracking issue 261 (battle-testing-a-skill and evaluating-skill-quality applied to themselves) resolved findings in this file: dimensions 1/2, 9, and 17 gained explicit Procedure step 2 clauses, and the dimension-2 CLAUDE.md-exclusion duplication between Procedure step 1 and Stop boundaries was folded into one cross-reference."
      outcome:
        verdict: resolved
        scope: dims-1-2-9-17
    - kind: audit
      anchor: "https://github.com/tvna/gitapex/issues/261"
      summary: "The same self-audit (tracking issue 261) also gave dimension 12 and dimensions 13/15/16's self-application new Stop-boundary bullets, and dimension 11 a non-authoritative-verdict paragraph in \"Connection to the held-out gate\" plus a reinforcing Stop-boundary bullet."
      outcome:
        verdict: resolved
        scope: dims-11-12-13-15-16
    - kind: deferral
      anchor: "https://github.com/tvna/gitapex/issues/261 -> https://github.com/tvna/gitapex/issues/364"
      summary: "Self-audit tracking issue 261 deferred its dimension-14 finding -- a dedicated regression corpus for this file's own guardrail prose, distinct from the eval corpus that tests this skill's grading behavior -- to this follow-up issue."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/261"
      summary: "Self-audit tracking issue 261 decided, rather than deferred, its CLAUDE.md-exclusion enforcement-hook question: no hook was added, since a PreToolUse hook can inspect tool-call arguments but not the harness's auto-injected CLAUDE.md context, so this boundary stays prose-only, backed by Procedure step 1's observable check, until a harness exposes a hookable signal."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/475"
      summary: "Procedure step 1's CLAUDE.md-exclusion check had drifted from evaluating-skill-quality's Isolation verification registry, still calling a filesystem-ancestry-only check sufficient though the registry documents that as insufficient (missed a real leak on one platform, caught only via the agent's own self-report). Fixed by deferring step 1 to that registry instead."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/475"
      summary: "skillDependencies.requires gained evaluating-skill-quality to reflect this functional dependency, matching evaluating-deterministic-gate-quality's and vetting-attack-surface's identical existing declaration for the same reason."
    - kind: audit
      anchor: "https://github.com/tvna/gitapex/issues/475"
      summary: "A live reconfirmation trial this session on the current platform (claude 2.1.220, cloud_default) found `claude -p` from this repository's root quoted real CLAUDE.md text, while the identical prompt from a confirmed CLAUDE.md/AGENTS.md-free directory reported none loaded -- reconfirming the Isolation registry's verified alternative still holds at this version."
      outcome:
        verdict: confirmed
    - kind: audit
      anchor: "https://github.com/tvna/gitapex/issues/475"
      summary: "evaluating-deterministic-gate-quality and vetting-attack-surface were also checked (grep across skills/ for the Subagent-dispatch/CLAUDE.md/AGENTS.md pattern) and already correctly defer to the same Isolation registry with no independent inline claim."
      outcome:
        verdict: pass
        action: none
    - kind: audit
      anchor: "https://github.com/tvna/gitapex/issues/475"
      summary: "battle-testing-a-skill's own audit round was waived for this fix per gitapex_gate_skill_audit_disclosure.py's rule (frontmatter description unchanged): the new step 1 text reuses already-audited wording from evaluating-skill-quality/SKILL.md's shipped Subagent dispatch section rather than introducing novel judgment-bearing content, the same waiver class evaluating-deterministic-gate-quality's issue 455 entry precedents."
      outcome:
        verdict: waived
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/pull/478"
      summary: "A same-PR Codex review flagged that the issue-475 fix's first version named a specific sibling file and heading (evaluating-skill-quality's Isolation verification section) in fragile bare backtick prose that no deterministic check would catch drifting; fixed by backing off to the same lower-specificity phrasing (\"evaluating-skill-quality's own Subagent dispatch section\") the sibling skills already use."
      outcome:
        verdict: fixed
    - kind: deferral
      anchor: "https://github.com/tvna/gitapex/pull/478"
      summary: "Whether a general deterministic drift-gate for this whole class of cross-skill prose citation (already affecting three skills) should be built now or as a follow-up issue was left to the operator's own call rather than decided unilaterally."
    - kind: elision
      anchor: "skills/battle-testing-a-skill/SKILL.md"
      summary: "Issue 605's redundant-restatement trim condensed Procedure step 1's Blind Spot Pass citation to a pointer, dropping the source from SKILL.md's body: Thariq Shihipar, \"A Field Guide to Fable: Finding Your Unknowns\", https://claude.com/blog/a-field-guide-to-claude-fable-finding-your-unknowns (already recorded in full in references/provenance-and-caveats.md). Recorded here too since a sidecar entry carries no runtime instruction weight, unlike the body prose the trim was reducing."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/783"
      summary: "A main-thread precondition step (path exists/readable stat check, no content read) was inserted before the former step 1, short-circuiting a missing/empty/unreadable target to INDETERMINATE before any dispatch launches. Later steps shifted down by one (old step 1 is now 2, old step 2 is now 3, kept as a defense-in-depth fallback). provenance-and-caveats.md's live step-number pointers were updated to match; this file's own earlier entries were left as originally written."
  skillDependencies:
    requires:
      - evaluating-skill-quality
    relatedTo:
      - scorer-gated-skill-edits
      - untrusted-input-triage
