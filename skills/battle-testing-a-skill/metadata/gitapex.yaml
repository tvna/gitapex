apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: battle-testing-a-skill
spec:
  portability: Mixed
  capabilityAssumption: Adaptive
  references:
    - "caveat | method:battle-testing-a-skill | The clairvoyance and microsoft/waza projects cited below are external corroboration only; this skill neither depends on nor bundles either project."
    - "corroboration | https://github.com/tvna/clairvoyance | The clairvoyance project (public, MIT-licensed) runs its own adversarial battle harness over its skills; its five scenario categories (injection, guardrails, routing, depth-gate, encoding) recur across this skill's dimensions, and its portability write-up describes the exact gap this skill fixes: a foreign harness with no rubric injected cannot say why a skill is weak."
    - "corroboration | https://github.com/microsoft/waza | microsoft/waza ships a `waza adversarial` command for offline adversarial / fault-injection packs -- a separate implementation of a related idea."
    - "caveat | skills/battle-testing-a-skill/references/provenance-and-caveats.md | Neither clairvoyance nor microsoft/waza is authoritative for how a model reasons about adversarial skill-testing; the source of record is the observed cross-model behavior recorded in this file."
    - "audit | https://github.com/tvna/gitapex/issues/74 | Dimensions 11-17 of the adversarial-dimensions catalog were added by a comparative review checking coverage against obra/superpowers and microsoft/waza; see provenance-and-caveats.md's Comparative review section for what was verified directly versus unmeasured or secondary-sourced."
    - "elision | skills/battle-testing-a-skill/SKILL.md | SKILL.md's \"Connection to the held-out gate\" section names scorer-gated-skill-edits as this repo's example consumer of a battle-test verdict, without an issue citation there, deliberately, to keep that section Portable."
    - "decision | https://github.com/tvna/gitapex/issues/25 -> https://github.com/tvna/gitapex/pull/29 | That held-out-gate connection traces to issue 25 (design a held-out-gated skill-training loop, scoped to verifiable tasks), whose component 2 this skill implements; scorer-gated-skill-edits is the component-1 implementation, landed via this pull request."
    - "correction | https://github.com/tvna/gitapex/issues/242 | The CLAUDE.md-contamination incident recorded in provenance-and-caveats.md's \"Variance re-measurement\" section is this repository's issue 242 (retrospective, Repairs item 3)."
    - "decision | https://github.com/tvna/gitapex/issues/250 | The Procedure step 1 CLAUDE.md-exclusion requirement produced by the issue-242 contamination incident landed via this issue."
    - "audit | https://github.com/tvna/gitapex/issues/261 | Self-audit tracking issue 261 (battle-testing-a-skill and evaluating-skill-quality applied to themselves) resolved findings in this file: dimensions 1/2, 9, and 17 gained explicit Procedure step 2 clauses, and the dimension-2 CLAUDE.md-exclusion duplication between Procedure step 1 and Stop boundaries was folded into one cross-reference. | verdict=resolved scope=dims-1-2-9-17"
    - "audit | https://github.com/tvna/gitapex/issues/261 | The same self-audit (tracking issue 261) also gave dimension 12 and dimensions 13/15/16's self-application new Stop-boundary bullets, and dimension 11 a non-authoritative-verdict paragraph in \"Connection to the held-out gate\" plus a reinforcing Stop-boundary bullet. | verdict=resolved scope=dims-11-12-13-15-16"
    - "deferral | https://github.com/tvna/gitapex/issues/261 -> https://github.com/tvna/gitapex/issues/364 | Self-audit tracking issue 261 deferred its dimension-14 finding -- a dedicated regression corpus for this file's own guardrail prose, distinct from the eval corpus that tests this skill's grading behavior -- to this follow-up issue."
    - "decision | https://github.com/tvna/gitapex/issues/261 | Self-audit tracking issue 261 decided, rather than deferred, its CLAUDE.md-exclusion enforcement-hook question: no hook was added, since a PreToolUse hook can inspect tool-call arguments but not the harness's auto-injected CLAUDE.md context, so this boundary stays prose-only, backed by Procedure step 1's observable check, until a harness exposes a hookable signal."
    - "decision | https://github.com/tvna/gitapex/issues/475 | Procedure step 1's CLAUDE.md-exclusion check had drifted from evaluating-skill-quality's Isolation verification registry, still calling a filesystem-ancestry-only check sufficient though the registry documents that as insufficient (missed a real leak on one platform, caught only via the agent's own self-report). Fixed by deferring step 1 to that registry instead."
    - "decision | https://github.com/tvna/gitapex/issues/475 | skillDependencies.requires gained evaluating-skill-quality to reflect this functional dependency, matching evaluating-deterministic-gate-quality's and vetting-attack-surface's identical existing declaration for the same reason."
    - "audit | https://github.com/tvna/gitapex/issues/475 | A live reconfirmation trial this session on the current platform (claude 2.1.220, cloud_default) found `claude -p` from this repository's root quoted real CLAUDE.md text, while the identical prompt from a confirmed CLAUDE.md/AGENTS.md-free directory reported none loaded -- reconfirming the Isolation registry's verified alternative still holds at this version. | verdict=confirmed"
    - "audit | https://github.com/tvna/gitapex/issues/475 | evaluating-deterministic-gate-quality and vetting-attack-surface were also checked (grep across skills/ for the Subagent-dispatch/CLAUDE.md/AGENTS.md pattern) and already correctly defer to the same Isolation registry with no independent inline claim. | verdict=pass action=none"
    - "audit | https://github.com/tvna/gitapex/issues/475 | battle-testing-a-skill's own audit round was waived for this fix per gate_skill_audit_disclosure.py's rule (frontmatter description unchanged): the new step 1 text reuses already-audited wording from evaluating-skill-quality/SKILL.md's shipped Subagent dispatch section rather than introducing novel judgment-bearing content, the same waiver class evaluating-deterministic-gate-quality's issue 455 entry precedents. | verdict=waived"
    - "correction | https://github.com/tvna/gitapex/pull/478 | A same-PR Codex review flagged that the issue-475 fix's first version named a specific sibling file and heading (evaluating-skill-quality's Isolation verification section) in fragile bare backtick prose that no deterministic check would catch drifting; fixed by backing off to the same lower-specificity phrasing (\"evaluating-skill-quality's own Subagent dispatch section\") the sibling skills already use. | verdict=fixed"
    - "deferral | https://github.com/tvna/gitapex/pull/478 | Whether a general deterministic drift-gate for this whole class of cross-skill prose citation (already affecting three skills) should be built now or as a follow-up issue was left to the operator's own call rather than decided unilaterally."
  skillDependencies:
    requires:
      - evaluating-skill-quality
    relatedTo:
      - scorer-gated-skill-edits
      - untrusted-input-triage
