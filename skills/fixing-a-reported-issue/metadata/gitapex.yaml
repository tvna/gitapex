apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: fixing-a-reported-issue
spec:
  portability: Portable
  capabilityAssumption: Broad
  lifecycle:
    renamedFrom: issue-to-fix
  skillDependencies:
    requires: []
    relatedTo:
      - drafting-a-pr-to-merge
      - planning-a-branch-from-an-issue
  executionRequirements:
    tools:
      read:
        - files
      write:
        - files
      shell:
        - tests
  references:
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/823"
      summary: "Declared spec.executionRequirements.tools (W3 third slice, https://github.com/tvna/gitapex/issues/307): Step 1 reproduces against the real code path (read/run), Step 3 writes a failing test (write), Step 4 fixes minimally (write), Step 5 runs the existing suite (shell), beyond this skill's GitHub-MCP calls for Steps 2/6 (not modeled by this tools category)."
