    experimental:
      reason: "First version of a new skill category, built from gitapex#435's research report and hardened across three rounds of fresh, independent battle-testing-a-skill and evaluating-skill-quality audits (verdicts disclosed in the shipping PR body): round 1 fixed install-provenance, memory-poisoning/multi-turn, encoding/obfuscation, and structured-output-injection Stop-boundary gaps plus a missing Subagent-dispatch section; round 2 fixed a coverage-attestation input-trust gap and a bare-issue-citation defect round 1's own fix had not actually resolved; round 3 converged evaluating-skill-quality to WELL-FORMED-AND-MATURE (surfacing and then closing one further gap, dimension 18's secret/credential-redaction check) and battle-testing-a-skill to INDETERMINATE-only-due-to-harness-isolation-limits, with zero new content defects found. Deferred, named explicitly: a full independently-verified agent-tool/dependent-middleware compatibility matrix (Compatibility awareness axis is concept-only for now, unlike evaluating-skill-quality's own verified 6-vendor matrix); a bundled deterministic shape-checker script specific to this skill's own domain (dimensions.md's shape checks are applied manually today); a committed evals/ adversarial regression corpus (battle-testing-a-skill dimension 14, disclosed as a deliberate waiver, not a silent gap); independent re-derivation of each dimension's domain-generalization tag against real Domain-1/3/4 artifacts beyond the reasoning applied during this build; and a harness-level isolation-verification gap every audit round's own dispatch disclosed against itself -- none could be confirmed free of this repository's own CLAUDE.md, the same open problem evaluating-skill-quality's own Subagent dispatch section already names for itself."
