apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: evaluating-deterministic-gate-quality
spec:
  portability: Mixed
  capabilityAssumption: Adaptive
  references:
    - "This skill's own model (the four-domain scope, the guiding principle, the two-lane split, the three axes, and the mechanism-fit test) was finalized in gitapex#435's own research pass, committed as docs/superpowers/reports/2026-07-27-hook-evaluation-quality-research.md and adversarially verified across multiple independent rounds before this skill was built from it. This is provenance for maintainers of this specific repository, not something SKILL.md or references/dimensions.md or references/mechanism-fit.md depend on to function."
    - "references/gitapex-worked-examples.md carries this repository's own worked examples and its live smoke-test output, both gathered during the gitapex#435 build; substitute the target repository's own equivalents when applying this skill elsewhere."
    - "Backing-issue numbers elided from references/gitapex-worked-examples.md's own body prose, per this skill's own no-bare-citation rule (no exemption for Mixed/Repository-scoped content, nor for a citation wrapped in inline code, per evaluating-skill-quality's references/rubric.md Portability level section): the ACM-disclosure worked example's docstring quote elides gitapex#357 (the investigation) and gitapex#413 (the paired PreToolUse hook); the smoke test's own Step 1 elides the same two plus gitapex#414 (the Domain-3 CI backstop, gate_acm_issue_disclosure.py); the retrospective-identity worked example's docstring quote elides gitapex#297 (refs gitapex#187, gitapex#242, gitapex#246); the sibling-repository-provenance worked example's docstring quote elides gitapex#144 (the OWASP Agentic Top 10 mapping port); the smoke test's own disposition note elides gitapex#436 (the follow-up issue filed for the fail-open bug the smoke test found in hooks/check-issue-acm-disclosure.sh)."
    - "The fourth axis, Security-level / Zero-Trust maturity classification (references/security-level.md), was added in gitapex#442, a direct follow-up feat issue on this already-shipped skill (not a child of gitapex#435, not a two-phase design-then-implement issue). Its portable core cites only Anthropic's Zero Trust for AI Agents eBook. Its gitapex-specific worked example in references/gitapex-worked-examples.md reuses, rather than re-derives, two already-settled repository artifacts as this repository's own established tier/ceiling documentation: docs/superpowers/specs/2026-07-18-init-capability-tiers-design.md (gitapex#147, child of gitapex#82) and docs/security-control-inventory.md -- both cited by file path only in shipped SKILL.md/references content, per this skill's own no-bare-citation rule."
    - "The new worked example (Security-level / Zero-Trust maturity classification axis) introduces no new elided issue numbers of its own: it reuses the ACM-disclosure smoke test's already-live-verified dimension 1 (PASS) and dimension 15 (FAIL, fail-open on malformed stdin JSON) findings and the already-elided gitapex#436 citation above, recast through the tier lens rather than re-tested."
    - "Two fresh, isolated audit rounds hardened the fourth axis after it was first added (gitapex#442): a standard evaluating-skill-quality + battle-testing-a-skill pass, then a Fable-model blind-spot analysis followed by eight adversarial trials against mock hostile repositories, synthesized by an independent re-verification dispatch. Ten findings total, all now fixed in SKILL.md's Stop boundaries and Procedure step 5 and in references/security-level.md and references/dimensions.md; full detail in references/gitapex-worked-examples.md's own 'Audit history: Security-level axis hardening round' section."
    - "references/gitapex-worked-examples.md's 'Audit history' section elides one issue number, per this skill's own no-bare-citation rule: the round-1 evaluating-skill-quality dispatch's third finding (the execution-safety Stop boundary is prose-only in this repository's own environment, with no hedge acknowledging that, unlike evaluating-skill-quality's own analogous boundary) was out of scope for gitapex#442 itself and was filed as its own follow-up issue, gitapex#449."
    - "gitapex#455 restructured this skill's Mechanism-fit test after comparing it against evaluating-skill-quality's own Mechanism fit section: (1) added a new 'Gate vs. no gate' lead question to references/mechanism-fit.md, before the six domain-placement criteria (renamed to a 'Domain placement' subsection), generalizing the judgment-call filter that previously existed only inline in SKILL.md Procedure step 5; (2) moved SKILL.md's Mechanism-fit test section from 9th position (after all four axis subsections) to 4th (right after Guiding principle, before Evaluation model structure); (3) recovered the line budget for both by moving the three still-fully-inlined axes (Compatibility awareness, Reproducibility/Domain-coverage, Blast-radius) into a new references/cross-cutting-axes.md, matching the pointer pattern the fourth axis (Security-level, added in gitapex#442) already used. SKILL.md went from 499 to 481 lines. A first follow-up commit fixed an internal inconsistency the author's own review caught: the short-circuit wording told the reader to skip Procedure step 6 and Subagent dispatch entirely on a no-gate verdict, while also saying to report that verdict via step 6 -- fixed to skip only steps 3-5, and step 6 gained an explicit 'no-gate-warranted' verdict category. A second follow-up, prompted by the operator pointing out that step 2 alone could not achieve its stated goal: a skill's SKILL.md body loads wholesale on trigger regardless of internal section order, so reordering Mechanism-fit test earlier saved nothing by itself -- only content genuinely absent from the body (read from references/ on demand) does. Moved Three-way division of responsibility, Procedure step 5's coverage-attestation elaboration, and the review-quality-only subset of grading-specific Stop boundaries (7 of 20 total boundaries: shape-check-only approval, coverage-attestation input trust x3, wrong-domain-score interaction, Security-level tier-classification honesty x3) into a new references/grading-procedure.md, leaving short stubs in SKILL.md so every existing cross-reference to those section names kept resolving. Deliberately did NOT move the execution-safety and live-testing-support Stop boundaries (2 of 20) despite the context cost: the operator raised, correctly, that deferring a safety-critical boundary to an on-demand reference risks the model never reading it before executing a possibly-hostile target gate -- those two guard an actual dangerous action, not a verdict's quality, so they stay in SKILL.md's own always-loaded body. Five downstream citations in gitapex-worked-examples.md and dimensions.md that pointed at content later moved (then some reverted back) were updated to match each final location. A same-session evaluating-skill-quality self-review (not a fresh isolated dispatch -- the harness-level isolation limitation every prior round of this skill already discloses against itself applies here too, more acutely since no isolated dispatch was attempted successfully at all this round after one attempt via a general-purpose subagent got stuck in a nested self-dispatch retry loop and was abandoned) found and fixed two further defects the restructuring itself introduced: a Stop-boundary cross-reference link left pointing at grading-procedure.md after the boundary it described had been moved back into SKILL.md, and a three-way duplication (Stop boundaries lead-in, Lifecycle note, Notes) of the same wholesale-loading rationale, trimmed to state it fully once (Notes) with the Lifecycle note reduced to a pointer, matching that note's own established terseness for earlier rounds. SKILL.md ended at 440 lines (from 484 after the first follow-up, 499 before this issue). No lifecycle-state change. battle-testing-a-skill disclosed WAIVED for this PR (frontmatter description unchanged, so permitted): a pure structural reorganization of already-battle-tested content, with the one genuinely new judgment call (the safety-critical-vs-review-quality Stop-boundary split) already pressure-tested once by the operator's own direct challenge mid-session and corrected in response, rather than left untested. A same-day follow-up, prompted by the operator asking to reduce non-behavioral change-history from the skill and references/ (not this sidecar, already the designated home for it): trimmed references/gitapex-worked-examples.md's 'Audit history: Security-level axis hardening round' section from a full round-by-round finding narrative (~160 lines: two rounds, ten findings, per-finding severity and fix detail, a blocked-exfiltration-trial disposition, isolation-limitation caveats) down to a ~10-line summary pointing here for further detail -- that narrative duplicated this sidecar's own account (the spec.references entry above and this reason field) with zero bearing on applying the skill to a target gate, exactly the duplication this skill's own dimension 12 warns against. SKILL.md's Lifecycle note lost its own round-count litany ('the initial three-round audit, the fourth axis's own two follow-up rounds, and a later two-part Mechanism-fit-test restructuring') for the same reason -- it now points here without re-deriving the history. SKILL.md: 440 -> 437 lines; gitapex-worked-examples.md: 468 -> 328 lines."
    - "gitapex#474 added dimension 19 (Runtime-cost optimization, distinct from dimension 6's budget-set-and-proportionate check) to references/dimensions.md's probabilistic-maturity lane, appended after dimension 18 so no existing 'dimension N' cross-reference needed renumbering, and updated the lane's own '(7-18)' count to '(7-19)'. A matching worked example was added to references/gitapex-worked-examples.md, reusing (not re-deriving) the existing ACM-disclosure smoke-test target (hooks/check-issue-acm-disclosure.sh + hooks/check_acm_present_or_waiver.py), with a live bash `time` measurement (5 runs, 0.038-0.066s wall, against the target's registered 10s hooks.json timeout) as evidence rather than an assumed number. Two fresh dispatches reviewed the addition: evaluating-skill-quality returned WELL-FORMED, NOT-MATURE, independently re-running the live measurement and confirming both the new dimension's text and the worked example's evidence sound -- the gap it found was governance completeness (this sidecar and the PR's own audit disclosure not yet updated at review time), not a content defect. battle-testing-a-skill returned FAIL with three findings, all fixed in the same follow-up commit: (1) dimension 19 as first drafted let a gate's own 'already optimized' comment or docstring stand as evidence without requiring the reviewer to independently verify it -- fixed by adding a clause mirroring dimension 10's empirical-verification discipline (ground the finding in a direct code-path read or a live measurement, never the claim alone); (2) the worked example's first timing transcript was a hand-summarized format, not a literal reproducible command transcript, and did not disclose a ~40% first-run cold-start variance visible in the raw data -- fixed by replacing it with bash's own literal `time` builtin output across 5 runs plus an explicit note naming the variance; (3) this sidecar had no entry for the addition at all -- fixed by this bullet and the reason-field sentence below. Both dispatches disclosed, again, the same unresolved CLAUDE.md subagent-isolation limitation every prior audit round of this skill has disclosed against itself; rather than re-disclosing it as a bare per-round caveat once more, it is now tracked as its own root-cause issue, gitapex#475."
  skillDependencies:
    requires:
      - evaluating-skill-quality
    relatedTo:
      - screening-a-low-trust-contribution
  lifecycle:
    experimental:
      reason: "First version of a new skill category, built from gitapex#435's research report and hardened across three rounds of fresh, independent battle-testing-a-skill and evaluating-skill-quality audits (verdicts disclosed in the shipping PR body): round 1 fixed install-provenance, memory-poisoning/multi-turn, encoding/obfuscation, and structured-output-injection Stop-boundary gaps plus a missing Subagent-dispatch section; round 2 fixed a coverage-attestation input-trust gap and a bare-issue-citation defect round 1's own fix had not actually resolved; round 3 converged evaluating-skill-quality to WELL-FORMED-AND-MATURE (surfacing and then closing one further gap, dimension 18's secret/credential-redaction check) and battle-testing-a-skill to INDETERMINATE-only-due-to-harness-isolation-limits, with zero new content defects found. Deferred, named explicitly: a full independently-verified agent-tool/dependent-middleware compatibility matrix (Compatibility awareness axis is concept-only for now, unlike evaluating-skill-quality's own verified 6-vendor matrix); a bundled deterministic shape-checker script specific to this skill's own domain (dimensions.md's shape checks are applied manually today); a committed evals/ adversarial regression corpus (battle-testing-a-skill dimension 14, disclosed as a deliberate waiver, not a silent gap); independent re-derivation of each dimension's domain-generalization tag against real Domain-1/3/4 artifacts beyond the reasoning applied during this build; and a harness-level isolation-verification gap every audit round's own dispatch disclosed against itself -- none could be confirmed free of this repository's own CLAUDE.md, the same open problem evaluating-skill-quality's own Subagent dispatch section already names for itself. Follow-up (gitapex#442): added a fourth cross-cutting axis, Security-level / Zero-Trust maturity classification, reusing gitapex#147's tier design and docs/security-control-inventory.md as this repository's own established ceiling rather than re-deriving a second taxonomy. Two fresh, isolated audit rounds ran against it and found real gaps, not a clean pass -- ten findings total (three from a standard battle-testing-a-skill + evaluating-skill-quality pass, seven confirmed from a follow-up Fable-model blind-spot analysis and eight adversarial trials against mock hostile repositories), spanning the new axis's ceiling-doc trust and this skill's pre-existing Stop boundaries (execution safety before running a hostile gate, the 'already reviewed' and live-verification-waiver boundaries, and the anti-injection scan's scope). All ten are now fixed; full verdicts and per-finding detail recorded in references/gitapex-worked-examples.md's 'Audit history: Security-level axis hardening round' section, not only summarized here. This corrects an earlier version of this same reason field that asserted the rounds had 'verified... clean, an argued scaling-down, not a lowered bar' before either round had actually completed -- itself one of the findings the rounds surfaced. Deferred, named explicitly: the axis's 'target has no established ceiling documentation' reuse branch is stated in references/security-level.md but not yet smoke-tested against a target that actually lacks one; round 2's blind-spot and synthesis dispatches (though not its per-trial dispatches) carry the same unresolved CLAUDE.md-isolation limitation every prior round of this skill already discloses against itself. Follow-up (gitapex#455): restructured Mechanism-fit test to add a 'Gate vs. no gate' question ahead of the existing six domain-placement criteria, and moved that section from 9th to 4th position in SKILL.md. A second pass on the same issue, prompted by the operator, corrected the premise that reordering alone reduces context cost -- SKILL.md's body loads wholesale on trigger regardless of section order -- and moved the sections/Stop-boundaries relevant only to grading an already-confirmed gate into a new references/grading-procedure.md, deliberately keeping the two Stop boundaries that guard actually executing a target gate in SKILL.md's own always-loaded body rather than deferring them for context savings. Full detail in the spec.references entry above. Follow-up (gitapex#474): added dimension 19 (Runtime-cost optimization) and its worked example; a fresh evaluating-skill-quality dispatch found the content itself sound (WELL-FORMED, NOT-MATURE, gated only on this sidecar being out of date) while a fresh battle-testing-a-skill dispatch returned FAIL with three real findings (an unverified-optimization-claim gap, a non-reproducible timing transcript, and this sidecar's own missing entry), all fixed in the same follow-up commit. No lifecycle-state change. Full detail in the spec.references entry above rather than restated here, per this skill's own dimension 12 duplication discipline. The recurring unresolved CLAUDE.md subagent-isolation caveat both dispatches disclosed again is now tracked as its own issue, gitapex#475, rather than left as a bare per-round disclosure only."
      trackingIssue: "#435"
