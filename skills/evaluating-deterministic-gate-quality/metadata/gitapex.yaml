apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: evaluating-deterministic-gate-quality
spec:
  portability: Mixed
  capabilityAssumption: Adaptive
  references:
    - "This skill's own model (the four-domain scope, the guiding principle, the two-lane split, the three axes, and the mechanism-fit test) was finalized in https://github.com/tvna/gitapex/issues/435's own research pass, committed as docs/superpowers/reports/2026-07-27-hook-evaluation-quality-research.md and adversarially verified across multiple independent rounds before this skill was built from it."
    - "references/gitapex-worked-examples.md carries this repository's own worked examples and its live smoke-test output, both gathered during the https://github.com/tvna/gitapex/issues/435 build; substitute the target repository's own equivalents when applying this skill elsewhere."
    - "references/gitapex-worked-examples.md's own body prose elides several backing issue numbers, per this skill's own no-bare-citation rule (no exemption for Mixed/Repository-scoped content or for a citation wrapped in inline code). Full detail: references/gitapex-history.md#backing-issue-numbers-elided-from-worked-examples"
    - "The fourth axis, Security-level / Zero-Trust maturity classification, was added in https://github.com/tvna/gitapex/issues/442, reusing this repository's existing tier/ceiling documentation rather than a new taxonomy. Full detail: references/gitapex-history.md#fourth-axis-added-security-level-zero-trust-maturity-classification-issue-442"
    - "The new worked example (Security-level / Zero-Trust maturity classification axis) introduces no new elided issue numbers of its own: it reuses the ACM-disclosure smoke test's already-live-verified dimension 1 (PASS) and dimension 15 (FAIL, fail-open on malformed stdin JSON) findings and the already-elided https://github.com/tvna/gitapex/issues/436 citation above, recast through the tier lens rather than re-tested."
    - "Two fresh, isolated audit rounds hardened the fourth axis after https://github.com/tvna/gitapex/issues/442 first added it, finding ten issues now fixed in SKILL.md and references/security-level.md and references/dimensions.md. Full detail: references/gitapex-history.md#security-level-axis-hardening-round-two-audit-passes"
    - "One of the ten hardening-round findings (round-1 evaluating-skill-quality dispatch's third finding, an unhedged execution-safety Stop boundary) was out of scope for https://github.com/tvna/gitapex/issues/442 and filed as its own follow-up, https://github.com/tvna/gitapex/issues/449. Full detail: references/gitapex-history.md#audit-history-follow-up-issue-on-execution-safety-stop-boundary-issue-449"
    - "https://github.com/tvna/gitapex/issues/455 restructured this skill's Mechanism-fit test (added a 'Gate vs. no gate' lead question, moved the section earlier, and split content into references/grading-procedure.md and references/cross-cutting-axes.md), then two same-day follow-ups fixed self-introduced defects and trimmed duplicated change-history. Full detail: references/gitapex-history.md#mechanism-fit-test-restructuring-issue-455"
    - "https://github.com/tvna/gitapex/issues/474 added dimension 19 (Runtime-cost optimization) and its worked example; two dispatches plus the repository's Codex reviewer found and fixed an unverified-optimization-claim gap, a non-reproducible timing transcript, and a factual cost-claim error, tracked further in https://github.com/tvna/gitapex/issues/475. Full detail: references/gitapex-history.md#dimension-19-runtime-cost-optimization-issue-474"
  skillDependencies:
    requires:
      - evaluating-skill-quality
    relatedTo:
