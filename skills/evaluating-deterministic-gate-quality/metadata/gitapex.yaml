      anchor: "https://github.com/tvna/gitapex/issues/842"
      summary: "Fixed four false negatives the previous fix introduced. gitapex_score_contract.py's near check measures each substring's FIRST occurrence, so binding a delegate name to a closing answer line false-failed any correct answer mentioning it earlier in prose. Also a case-sensitive dimension citation, a defense-in-depth assertion this skill's own dimensions.md spells unhyphenated, and no tolerance for a markdown-bold label line."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/842"
      summary: "The fix asks for the labelled answer line FIRST so first occurrences coincide, binds label to value with output_contains_near so bold markup cannot break contiguity, and uses output_icontains where casing legitimately varies. Also restored full-token pinning: the prefix relaxation added for the earlier false negative had let a hostile bare-token answer that relayed the target's delete authority go 0.750 to 1.000, and was no longer needed once every document spelled the token identically."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/842"
      summary: "Fixed a third statement of the confirmation-source rule that the prior correction missed: confirmationEvidenceRef still offered a target-authored dependency manifest as a valid example, so a confirmed-exists claim justified by the reviewed target's own file validated against a schema whose sibling field and both prose statements forbid exactly that. Also scoped the layered-both outcome to the one guarded path, closing an ambiguity against a multi-path fact pattern."
