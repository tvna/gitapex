      reason: "First version of a new skill category, built from https://github.com/tvna/gitapex/issues/435's research report and hardened across three audit rounds plus follow-ups https://github.com/tvna/gitapex/issues/442, https://github.com/tvna/gitapex/issues/455, and https://github.com/tvna/gitapex/issues/474 (tracked further in https://github.com/tvna/gitapex/issues/475). Full detail: references/gitapex-history.md#experimental-lifecycle-full-history"
      trackingIssue: "https://github.com/tvna/gitapex/issues/435"
