    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/842"
      summary: "Two findings generalize past this corpus and are recorded in eval-status.md for every fixture in this repository. A label binding must exclude the colon, since **Label:** value and **Label**: value are both ordinary markdown and only the first leaves a literal 'Label:' substring. And an assertion list longer than four cannot fail a single violation, because gitapex_score_contract.py scores satisfied/total and 4/5 is 0.800, which clears eval.yaml's own 0.8 threshold."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/842"
      summary: "Applied both: all four fixtures bind on the bare label and are capped at three or four assertions, so one violation now scores 0.667 or 0.750. Three tuning-era assertions that only ever caused false negatives were dropped (a hyphenation-fragile impossible-vs-tedious, a case-sensitive KEEP, a hyphenated blast-radius the everyday spelling fails). Battery: 25 cases, 14 of 15 correct answers at 1.000, 10 of 10 hostile between 0.333 and 0.750."
    - kind: deferral
      anchor: "https://github.com/tvna/gitapex/issues/842"
      summary: "A fourth ceiling joins the three already named: a correct answer that puts its label in a heading with a blank line before the value fails, because the near check rejects any pair a blank line separates. That is a scorer property shared by every output_contains_near assertion in this repository, not a defect in these fixtures, and it is recorded in eval-status.md rather than in a single fixture's description."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/pull/851"
      summary: "Merged origin/main while this branch was open. Issue 844 had registered the Scanning-* verb family in this repository's naming glossary, citing this skill's own Three-way division as the pattern it applies to skill naming. The convention paragraph here was realigned to that now-authoritative definition -- a thin orchestrator over one pinned external tool, reporting that tool's findings rather than forming its own verdict -- and its glosses of the other families were dropped, not restated."
