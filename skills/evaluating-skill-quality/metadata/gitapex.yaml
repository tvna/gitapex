apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: evaluating-skill-quality
spec:
  portability: Portable
  capabilityAssumption: Broad
  references:
    - "For readers working in this repository (gitapex), the worked example in `skills/evaluating-skill-quality/references/worked-example-self-review.md` notes that this skill's own deterministic shape lane was delegated to `scripts/check_skill_shape.py`; that delegation was made in https://github.com/tvna/gitapex/issues/32."
    - "The warning-only compatibility baseline was verified on 2026-07-25 against the Agent Skills specification and primary documentation for Claude Code, Codex, Gemini CLI, Devin, OpenClaw, and HermesAgent. The portable evidence summary lives in `references/runtime-compatibility.md`; implementation provenance is tracked in https://github.com/tvna/gitapex/issues/332."
    - "GitHub Copilot and Kiro rows were added to the runtime-compatibility baseline on 2026-07-27 from official docs; a Windsurf row followed once docs.devin.ai was allow-listed. Amazon Q Developer proper was investigated and resolved as a non-addition (superseded by Kiro CLI), closing https://github.com/tvna/gitapex/issues/444. Full detail: references/gitapex-history.md#issue-444-copilot-kiro-and-windsurf-rows-amazon-q-developer-non-addition"
    - "Kimi CLI and Cursor rows were added to the runtime-compatibility baseline on 2026-07-27 from official vendor docs. MiniMax was investigated but not added, since its SKILL.md is consumed by other runtimes rather than parsed by a MiniMax-owned runtime (https://github.com/tvna/gitapex/issues/443). Full detail: references/gitapex-history.md#issue-443-kimi-cli-and-cursor-rows-added-minimax-investigated-no-row-added"
    - "docs/agent-product-scope.md now formally distinguishes this skill's Axis C evidence baseline from GitApex's Axis A/B targets (https://github.com/tvna/gitapex/issues/445). An earlier draft cross-referenced that doc directly from references/runtime-compatibility.md but was reverted, since a Portable skill's references/*.md must not carry a link escaping its own directory. Full detail: references/gitapex-history.md#issue-445-axis-c-scope-note-and-reverted-cross-reference-draft"
    - "https://github.com/tvna/gitapex/issues/261 (self-audit tracking issue) resolved most of its findings: several dimensions gained references/adversarial-self-audit.md and SKILL.md pointers, dimension 11 gained a second independent downstream-consumer check, and the dimension 6/8 verdict gap was closed in rubric.md. Full detail: references/gitapex-history.md#issue-261-self-audit-tracking-issue-resolution"
    - "https://github.com/tvna/gitapex/issues/261 deferred one finding with a stated reason: dimension 14 (a dedicated regression corpus for this file's own guardrail prose, distinct from evals/evaluating-skill-quality/'s existing corpus that tests this skill's grading behavior against arbitrary fed-in targets) was handed to https://github.com/tvna/gitapex/issues/364."
    - "https://github.com/tvna/gitapex/issues/390, a fresh isolated self-review after the rubric.md cleanup in https://github.com/tvna/gitapex/issues/383, returned WELL-FORMED-NOT-MATURE citing three dimension gaps (rubric.md duplication, registry-file consolidation, a missing subprocess-boundary test) plus one open self-referential-circularity blind spot. Full detail: references/gitapex-history.md#issue-390-self-review-dispatch-findings-after-rubric-cleanup"
    - "https://github.com/tvna/gitapex/issues/475 found SKILL.md's Subagent dispatch section already deferred to the per-platform isolation registry, so no text change was needed. A live reconfirmation trial on this platform matched the registry's entry; the isolation finding was not re-dispatched, since it already has two independent confirmations (https://github.com/tvna/gitapex/issues/474). Full detail: references/gitapex-history.md#issue-475-isolation-reconfirmation-trial"
    - "A concurrent follow-up (https://github.com/tvna/gitapex/issues/476) to https://github.com/tvna/gitapex/issues/475 reconfirmed the same mechanism and ran an isolated audit catching a real bug the earlier dispatch missed; its proposed SKILL.md changes were dropped on merge favoring the reviewed no-change decision. A tangential finding was filed separately (https://github.com/tvna/gitapex/issues/479). Full detail: references/gitapex-history.md#issue-475-follow-up-issue-476"
  skillDependencies:
    requires: []
    relatedTo:
      - battle-testing-a-skill
      - scorer-gated-skill-edits
      - outward-artifact-preflight
