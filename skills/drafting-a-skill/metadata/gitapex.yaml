apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: drafting-a-skill
spec:
  portability: Mixed
  capabilityAssumption: Broad
  lifecycle:
    experimental:
      reason: "First draft, pending evaluating-skill-quality and battle-testing-a-skill review verdicts before graduating to stable"
      trackingIssue: "https://github.com/tvna/gitapex/issues/1194"
  references:
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "gitapex-native successor to obra/superpowers' writing-skills and Anthropic's skill-creator, separated from evaluating-skill-quality by a DDD bounded-context split (drafting = formative 'how should this be'; evaluating = a gate on a finished, static artifact)"
    - kind: decision
      anchor: "skills/auditing-agent-product-scope/metadata/gitapex.yaml"
      summary: "Portability Mixed precedent, not Repository-scoped -- reused directly for this skill's own Mixed declaration"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "an isolated pre-implementation audit found 3 defects, corrected before drafting: (1) Steps 5/7 reframed from authoritative checks into advisory self-checks, since evaluating-skill-quality's rubric.md already owns cohesion ('exactly one owner') and the Blind spot pass exclusively; (2) skillDependencies.requires corrected from [] to [evaluating-skill-quality], since Step 8 mandatorily invokes its checker scripts; (3) Step 2's redirect targets named concretely"
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "repository owner changed capabilityAssumption from this skill's own initial Adaptive declaration to Broad, applying this skill's own Step 3 self-referentially; SKILL.md's body was rewritten (not merely relabeled) to inline every Step's core judgment call so a weak/economical model gets enough guidance directly, per rubric.md's own Capability assumption section"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "an independent evaluating-skill-quality dispatch found shell: [] (= prohibited) contradicted Step 8's own mandatory python3 checker invocations. Corrected to shell: [python3], matching evaluating-skill-quality's own identical precedent for the same two scripts"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "same dispatch found SKILL.md Step 3's 'every user-selectable metadata choice' framing over-claimed exhaustiveness against the sidecar's 8 real spec fields; Step 3 now scopes itself to the 4 elicited axes and states dependencyPolicy/skillDependencies/executionRequirements are derived facts, not elicited choices"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "an independent battle-testing-a-skill dispatch demonstrated an injection-compliant reply passing the original adversarial fixture's weak assertions, and found no Stop boundary treating requester-supplied source text as untrusted. Fixed: Step 1/Stop boundaries now state untrusted-input handling explicitly; the fixture's assertions were strengthened to require actual dispatch language, not just name mentions"
  skillDependencies:
    requires:
      - evaluating-skill-quality
    relatedTo:
      - battle-testing-a-skill
      - drafting-an-acm-issue
      - evaluating-deterministic-gate-quality
      - evaluating-context-channel-maturity
  executionRequirements:
    tools:
      read:
        - files
      write:
        - files
      shell:
        - python3
