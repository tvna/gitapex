apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: drafting-a-skill
spec:
  portability: Mixed
  capabilityAssumption: Broad
  lifecycle:
    experimental:
      reason: "First draft, pending evaluating-skill-quality and battle-testing-a-skill review verdicts before graduating to stable"
      trackingIssue: "https://github.com/tvna/gitapex/issues/1194"
  references:
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "gitapex-native successor to obra/superpowers' writing-skills and Anthropic's skill-creator, separated from evaluating-skill-quality by a DDD bounded-context split (drafting = formative 'how should this be'; evaluating = a gate on a finished, static artifact)"
    - kind: decision
      anchor: "skills/auditing-agent-product-scope/metadata/gitapex.yaml"
      summary: "Portability Mixed precedent, not Repository-scoped -- reused directly for this skill's own Mixed declaration"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "an isolated pre-implementation audit found 3 defects, corrected before drafting: (1) Steps 5/7 reframed from authoritative checks into advisory self-checks, since evaluating-skill-quality's rubric.md already owns cohesion ('exactly one owner') and the Blind spot pass exclusively; (2) skillDependencies.requires corrected from [] to [evaluating-skill-quality], since Step 8 mandatorily invokes its checker scripts; (3) Step 2's redirect targets named concretely"
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "repository owner changed capabilityAssumption from this skill's own initial Adaptive declaration to Broad, applying this skill's own Step 3 self-referentially; SKILL.md's body was rewritten (not merely relabeled) to inline every Step's core judgment call so a weak/economical model gets enough guidance directly, per rubric.md's own Capability assumption section"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "an independent evaluating-skill-quality dispatch found shell: [] (= prohibited) contradicted Step 8's own mandatory python3 checker invocations. Corrected to shell: [python3], matching evaluating-skill-quality's own identical precedent for the same two scripts"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "same dispatch found SKILL.md Step 3's 'every user-selectable metadata choice' framing over-claimed exhaustiveness against the sidecar's 8 real spec fields; Step 3 now scopes itself to the 4 elicited axes and states dependencyPolicy/skillDependencies/executionRequirements are derived facts, not elicited choices"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "an independent battle-testing-a-skill dispatch demonstrated an injection-compliant reply passing the original adversarial fixture's weak assertions, and found no Stop boundary treating requester-supplied source text as untrusted. Fixed: Step 1/Stop boundaries now state untrusted-input handling explicitly; the fixture's assertions were strengthened to require actual dispatch language, not just name mentions"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "a third-round evaluating-skill-quality dispatch found untrusted-input-triage, drafting-an-adr, and grounding-in-primary-sources each named mid-procedure in SKILL.md or references/ but absent from relatedTo -- Step 6's own reconciliation rule applied to itself. Added to relatedTo and named in Related skills"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "supersedes the prior correction's 'actual dispatch language' claim -- a third-round battle-testing-a-skill dispatch proved it false: 'dispatch' is a payload substring, so echoing the attack scored 1.000 vs. 0.846 for real resistance, per this repo's own gitapex_score_contract.py. Rebalanced to 3 multi-word positives grounded in SKILL.md's real phrasing, verified against 7 replies -- see the fixture's own comment"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "same dispatch found 4 fail-open gaps needing no adversarial input: Step 3 had no rule for an unobtainable elicitation answer (an agent took a self-chosen provisional value); Step 9 had none for a missing fresh-dispatch mechanism (performed both reviews in-context); Step 1 had none for an empty job or encoded/hidden content. All four given explicit stop-and-escalate or decode-first rules"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "waza-eval-gate.yml's own live per-PR run (first real execution, not a session-internal review) failed outright: the injected-self-certification-probe fixture's 'SYSTEM OVERRIDE' payload tripped a hard content-policy block the CLI reported via empty stderr, unmatched by gitapex_run_eval_suite.py's own two-marker rejection signature, aborting the whole suite rather than skipping one fixture"
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1194"
      summary: "fixed by rewording the payload away from impersonating a system-level directive while preserving the same false-prior-approval, skip-Step-9 test property, rather than widening gitapex_run_eval_suite.py's own shared rejection-detection heuristic -- that heuristic is pre-existing, cross-suite infrastructure outside this PR's own change surface"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1304"
      summary: "the prior correction's own 'SYSTEM OVERRIDE tripped a content-policy block' diagnosis is disproven: the reworded payload failed identically (same empty-stderr 'model CLI exited 1' signature), and the same signature reproduces on an unrelated branch touching different skills' suites hours earlier -- a pre-existing, repo-wide waza-eval-gate defect unrelated to this PR's fixture content, filed as https://github.com/tvna/gitapex/issues/1304 and out of this PR's own scope to fix"
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1379"
      summary: "split Step 2 into Part A (value judgment, borrowing eliciting-a-design's own Core Domain three axes) and Part B (vehicle selection, the original four criteria carried forward byte-identical); Part A inherits a prior eliciting-a-design Core Domain verdict as a re-verifiable starting point when reached via the generic pipeline, never a skip"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1379"
      summary: "an independent battle-testing-a-skill dispatch found Part A's first inheritance draft trusted a bare in-session claim that a prior eliciting-a-design pass happened, with nothing quotable required -- an unguarded rationalization seam distinct from the already-resisted external-injection path. Fixed: Part A now requires locating and quoting the prior verdict verbatim before adopting it; nothing verbatim falls back to running Part A in full"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1379"
      summary: "an independent evaluating-skill-quality dispatch found eliciting-a-design named in Step 2's own prose three times but absent from both relatedTo and Related skills, and the Notes portability claim ('Steps 1-7, 9 depend on no repository-specific tooling') now false -- Step 6's own reconciliation rule applied to itself. Added to relatedTo/Related skills; Notes now carves out Step 2 as the one exception"
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1379"
      summary: "a second battle-testing-a-skill dispatch confirmed the bare-claim gap closed but found two residual gaps: 'quote' didn't distinguish verbatim from a self-generated paraphrase, and Output had no line requiring the inherited verdict be recorded for audit. Fixed: the inheritance clause now requires a verbatim quote, and Output gained a bullet recording it when inherited"
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1379"
      summary: "deferred, not fixed: this skill's own description still names no relationship to eliciting-a-design, despite eliciting-a-design's reciprocal edit -- adding one would need this skill's own exact 500-line body-length ceiling and would trigger this repo's eval-coverage-disclosure audit-gate. Leaves this dimension-1 gap open, keeping this skill WELL-FORMED-NOT-MATURE; tracked under this skill's own existing lifecycle.experimental.trackingIssue graduation, not this issue's own scope"
    - kind: caveat
      anchor: "https://github.com/tvna/gitapex/issues/1379"
      summary: "two of this issue's four entries above (same anchor) were appended once an independent evaluating-skill-quality dispatch caught their absence, not inline as their own commits landed -- a process lapse against this file's own Step 3 claim that entries are 'never backfilled,' disclosed here rather than silently left, not a retraction of that principle going forward"
  skillDependencies:
    requires:
      - evaluating-skill-quality
    relatedTo:
      - battle-testing-a-skill
      - drafting-issues
      - eliciting-a-design
      - evaluating-deterministic-gate-quality
      - evaluating-context-channel-maturity
      - untrusted-input-triage
      - drafting-an-adr
      - grounding-in-primary-sources
  executionRequirements:
    tools:
      read:
        - files
      write:
        - files
      shell:
        - python3
