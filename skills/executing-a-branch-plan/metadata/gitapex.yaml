apiVersion: gitapex.io/v1alpha1
kind: SkillMetadata
metadata:
  name: executing-a-branch-plan
spec:
  portability: Mixed
  capabilityAssumption: Frontier
  lifecycle:
    renamedFrom: fixing-a-reported-issue
  skillDependencies:
    requires:
      - planning-a-branch-from-an-issue
      - outward-artifact-preflight
    relatedTo:
      - planning-a-branch-from-an-issue
      - drafting-a-pr-to-merge
      - stop-and-replan
      - untrusted-input-triage
      - screening-a-low-trust-contribution
      - diagnosing-a-failure
      - drafting-a-skill
      - scorer-gated-skill-edits
  executionRequirements:
    tools:
      read:
        - files
      write: []
      shell: []
  references:
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/818"
      summary: "Declared spec.executionRequirements.tools (W3 second slice, https://github.com/tvna/gitapex/issues/307): gitapex_check_canonical_governance_paths.py and gitapex_check_file_ownership_conflicts.py (plus the shared local _gitapex_path_normalize helper module, not a package dependency) each take path arguments and only read them; no writes, no subprocess/shell calls."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1275"
      summary: "spec.lifecycle.renamedFrom records fixing-a-reported-issue, retired not 1:1 renamed: Steps 1-2 (reproduce, escalate) went to planning-a-branch-from-an-issue's new bare-defect path; Steps 3-5 map onto this skill's Red-Green discipline and single-task case. planning-a-branch-from-an-issue's own slot already holds issue-to-branch -- recorded here instead, mirroring scanning-attack-surfaces's own precedent for an occupied successor slot."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1155"
      summary: "Step 6 now routes a task decomposed from a bare-defect-report ACM row through the new diagnosing-a-failure skill before that task's own Red step; added to relatedTo."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1388"
      summary: "references/code-quality-principles.md keeps 7 of cursor/plugins/pstack's 21 principles. The other 14 duplicate CLAUDE.md sections 1-5 or existing sibling-skill coverage -- 13 named in the issue's own Problem section, plus Fix Root Causes (the 14th, omitted from the issue's own count): diagnosing-a-failure and reviewing-an-artifact's root-cause-vs-symptom tag already cover it."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1476"
      summary: "Design doc Decision 20: a branch-plan-task dispatch must pass the full repo verification suite before reporting complete, via a new SubagentStop hook (check_task_full_verification.sh). spec.executionRequirements.tools.shell/write stay [], distinct from row 1's read-only rationale: the new script's subprocess/write calls run only inside Claude Code's own hook runner, never a step this skill's orchestrating instructions direct a calling session to perform."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1558"
      summary: "Step 6's per-task screening dispatches screening-a-low-trust-contribution's checks 2-8 to the new agents/review-persona.md subagent type (tools: Read, Grep, Glob) instead of reasoning about the task's own diff directly in the main thread, which at that point holds mcp__github write access, git push, and unrestricted Bash. Isolates tool privilege only -- the separate calling-context-contamination axis is disclosed in review-persona.md's own Limits section, not resolved here."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1630"
      summary: "Step 3 now also classifies whether a task's Planned ops edit an existing SKILL.md; task-decomposition.md's new Existing-skill-file edit floor section requires gitapex_check_skill_shape.py plus a formative-quality-dimensions.md sweep before such a task reports complete, unless the task's own Planned ops route it to scorer-gated-skill-edits via a stated scorer/held-out-split precondition; added to relatedTo."
    - kind: correction
      anchor: "https://github.com/tvna/gitapex/issues/1630"
      summary: "the same issue's independent Step 8 adversarial review found the floor over- and under-reaching. Over: the sibling task rewrote formative-quality-dimensions.md row 8 into an artifact-producing Eval preparation instruction, so an unqualified sweep obliged every ordinary SKILL.md edit to author evals/ fixtures; the sweep now excludes row 8. Under: the floor binds the worktree-isolated task agent, which never reads this file -- both checks now go into its dispatch prompt in-band."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1648"
      summary: "Supersedes both issue/1630 entries above (append-only, not deleted): task-decomposition.md's Existing-skill-file edit floor section is deleted outright and replaced by a unified Skill-file edit routing rule -- any task whose Planned ops create or edit a SKILL.md, new or existing, routes to drafting-a-skill's full procedure; scorer-gated-skill-edits stays a separate opt-in route reached only on a stated scorer and held-out split."
      outcome:
        baseCommit: "2ff00c34c897074a619d390c208d66e9c52cf7d3"
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1648"
      summary: "capabilityAssumption's own round-trip, never previously recorded: commit f79fdec3 changed it Frontier to Adaptive as a round-2 review-repair attempt; the near-500-line body and threat-model-and-authorization.md's uniformly-mandatory-read status contradict Adaptive's lean-body-plus-on-demand-reference claim (rubric.md dimension 5). Commits 14485a4c/80d9f7d5 reverted field and Notes prose to Frontier, under which dimension 5's Adaptive-only layering rule does not apply."
      outcome:
        baseCommit: "80d9f7d5a936534ca43182ff0a17ee2c9433c809"
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1648"
      summary: "dimension 5 major: 5-6 reference files were each cited from an ordinary, non-failure Step, exceeding rubric.md's three-file ceiling; no self-guard exemption applies (each varies with the target Branch Plan). Merged by lifecycle axis into decomposition-and-dispatch.md and events-and-review-gate.md; threat-model-and-authorization.md stays standalone. Three files now, matching the ceiling. Content preserved verbatim under demoted headings; cross-references repointed."
      outcome:
        baseCommit: "0a069a68ba4889ebcd79082494d5253c2596701b"
    - kind: caveat
      anchor: "https://github.com/tvna/gitapex/issues/1648"
      summary: "the entry above overclaims: rubric.md's own text reads 'if acting on the typical request needs three files open, the split is wrong' -- three IS the failure condition, not an acceptable ceiling. A round-5 re-review confirmed the 6-to-3 merge itself is clean (no new defect, links/anchors resolve) but dimension 5 does not clear: the ordinary path still opens exactly three files."
      outcome:
        baseCommit: "be8ee11641d2612f1ab796b63a463916da70c1d8"
    - kind: elision
      anchor: "https://github.com/tvna/gitapex/issues/1648"
      summary: "declined two further restructurings, by the repository owner's own direction: (a) arguing threat-model-and-authorization.md is a rubric self-guard exemption -- round 5 called this the repository owner's own rubric-process call, not a single session's; (b) merging all three files into one -- risks failing dimension 5 from the opposite direction (a 1700+-line file). Standing open gap, disclosed alongside this skill's other residuals."
    - kind: decision
      anchor: "https://github.com/tvna/gitapex/issues/1662"
      summary: "Split events-and-review-gate.md's failure/resume-only content (loss/absence, freshness/hang, failure dispatch, rollback) into new failure-and-recovery.md, never read on a clean run. Four files now, but the typical request still opens three (threat-model, decomposition-and-dispatch, events-and-review-gate). Real progressive-disclosure gain; does not itself close dimension 5's three-file reading -- open pending issue/1662's rubric fix (a Fable dispatch found no satisfiable clause for this shape)."

