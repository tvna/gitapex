# This file is hand-maintained pending the planned gitapex CLI (Rust,
# design stage only -- see docs/superpowers/specs/
# 2026-07-15-gitapex-cli-governance-design.md). Once that CLI ships, it
# is expected to supply this file's content instead.
name: Feature request
description: Propose a new capability (skill, script, or workflow addition)
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for proposing something new. Fill in the sections below.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: 'One row per criterion. Fill Criterion at minimum; the other columns can start blank.'
      value: |
        <!-- One row per acceptance criterion. -->
        | Criterion | Interpretation | Planned ops | Proof method | Residual risk |
        |---|---|---|---|---|
        |  |  |  |  |  |
    validations:
      required: true
