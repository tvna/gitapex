name: Bug report
description: Report a defect in a skill, script, or workflow
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for filing a bug. Fill in the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Exact commands or steps, in order.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/uv version, harness (Claude Code, Codex, etc.) if relevant.
    validations:
      required: false
