# This file is hand-maintained pending the planned gitapex CLI (Rust,
# design stage only -- see docs/superpowers/specs/
# 2026-07-15-gitapex-cli-governance-design.md). Once that CLI ships, it
# is expected to supply this file's content instead.
name: Documentation
description: Documentation-only change (SKILL.md, references, specs, plans, this repo's own docs)
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: Documentation-only change. Fill in the sections below.
  - type: textarea
    id: whats-wrong-or-missing
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: proposed-content
    attributes:
      label: Proposed content
    validations:
      required: false
