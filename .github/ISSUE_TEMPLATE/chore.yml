# This file is hand-maintained pending the planned gitapex CLI (Rust,
# design stage only -- see docs/superpowers/specs/
# 2026-07-15-gitapex-cli-governance-design.md). Once that CLI ships, it
# is expected to supply this file's content instead.
name: Chore
description: Maintenance, dependency, or tooling work with no user-facing behavior change
body:
  - type: markdown
    attributes:
      value: Maintenance work. Fill in the sections below.
  - type: textarea
    id: what-needs-to-change
    attributes:
      label: What needs to change
    validations:
      required: true
  - type: textarea
    id: why-now
    attributes:
      label: Why now
    validations:
      required: false
