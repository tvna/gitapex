# This file is hand-maintained pending the planned gitapex CLI (Rust,
# design stage only -- see docs/superpowers/specs/
# 2026-07-15-gitapex-cli-governance-design.md). Once that CLI ships, it
# is expected to supply this file's content instead.
name: Refactor
description: Behavior-preserving restructure of a skill, script, or workflow
body:
  - type: markdown
    attributes:
      value: Behavior-preserving restructure. Fill in the sections below.
  - type: textarea
    id: current-structure
    attributes:
      label: Current structure
    validations:
      required: true
  - type: textarea
    id: proposed-structure
    attributes:
      label: Proposed structure
    validations:
      required: true
  - type: textarea
    id: why-behavior-preserving
    attributes:
      label: Why this preserves behavior
      description: What proof shows nothing observable changes (tests, evals, live check)?
    validations:
      required: true
  - type: textarea
    id: residual-risk
    attributes:
      label: Residual risk
      description: What could still go wrong even after this refactor, or "none identified".
    validations:
      required: false
