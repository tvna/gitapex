name: Transfer check disclosure gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "evals/**/split.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transfer-check-disclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # Issue #928: gitapex_gate_transfer_check_disclosure.py was rewritten
      # to scan every '## Iteration:' entry in every evals/*/split.md file
      # whole-file (not diff-scoped) -- the standardized heading form all 5
      # files now use, superseding the old '**Iteration:' bold-paragraph
      # convention this step used to diff-detect via git/grep/comm before
      # calling the script with '--entries'. That flag no longer exists on
      # the rewritten script (it now takes explicit paths, or globs
      # 'evals/*/split.md' with none given), so the diff-detection step is
      # removed rather than adapted: the ACM row this gate implements
      # ("every iteration entry in every file is in scope ... not diff-
      # scoped only") means a whole-repo run is the correct shape, not a
      # narrower one. The `paths` trigger above still limits *when* this
      # workflow runs to a PR that touches a split.md file at all.
      - name: Check Transfer check disclosure
        run: |
          set -euo pipefail
          uv run --frozen python3 .github/scripts/gitapex_gate_transfer_check_disclosure.py
