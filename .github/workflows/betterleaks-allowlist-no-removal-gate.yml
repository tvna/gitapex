# Issue #1427 (retrospective #1308 repair 3). Fails a PR that removes a
# `.betterleaks.toml` `[allowlist].paths` entry present at the PR's base
# commit without an explicit waiver comment -- see
# .github/scripts/gitapex_gate_betterleaks_allowlist_no_removal.py's own
# module docstring for the motivating incident (PR #1305) and the
# structural, not line-based, comparison this gate runs.
#
# Deliberately no `paths:` filter -- drift gate:
# tests/test_gitapex_gate_betterleaks_allowlist_no_removal.py's own
# test_the_workflow_has_no_paths_filter. See
# detection-logic-property-coverage-gate.yml's own identical comment for
# why (GitHub's own skipped-vs-never-ran distinction for a required check).
name: Betterleaks allowlist no-removal gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  betterleaks-allowlist-no-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # fetch-depth: '0' + ref: head SHA -- this gate reads .betterleaks.toml's
      # own content at the merge-base commit via `git show`, which requires
      # that commit's tree to actually be present locally, not just reachable
      # by SHA -- drift gate:
      # tests/test_gitapex_gate_betterleaks_allowlist_no_removal.py's own
      # test_the_workflow_checks_out_the_head_sha_with_full_history.
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # git merge-base below -- drift gate:
      # tests/test_gitapex_gate_betterleaks_allowlist_no_removal.py's own
      # test_the_workflow_uses_merge_base_not_base_sha. Computed inline here
      # (not via the local-only gitapex_run_base_diff.py, which self-heals a
      # missing ref over the network -- this checkout's own full history
      # already makes both endpoint SHAs resolvable, so no fetch is needed),
      # matching detection-logic-property-coverage-gate.yml's own identical
      # choice for the identical reason.
      #
      # Issue #1035: every `.github/scripts/*.py` invocation goes through
      # `uv run` regardless of whether the script needs a third-party
      # dependency. This gate carries a real `pydantic` import (its own
      # --root validation), so `uv run` is load-bearing here too.
      - name: Check .betterleaks.toml allowlist for an unwaived removal
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
            echo "::error::git merge-base failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          uv run --frozen python3 .github/scripts/gitapex_gate_betterleaks_allowlist_no_removal.py \
            --merge-base "$merge_base"
