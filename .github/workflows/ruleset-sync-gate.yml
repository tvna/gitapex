# Issue #439: pull-request-time check that the live `main` ruleset has not
# lagged behind the required status checks named in `.github/rulesets/main.json`.
#
# The source of truth is read from the pull request's BASE ref, not its head.
# Applying a ruleset is a separate human dispatch, so a pull request that adds a
# new required check to the committed file has by construction not applied it
# yet; grading the head ref would make every such pull request fail itself for
# doing exactly what it set out to do. The base ref is the state that is already
# supposed to be live, and is the only ref this gate can honestly grade.
name: Ruleset sync gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruleset-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads RULESETS_PAT with Administration: read. The default GITHUB_TOKEN
    # cannot read /repos/{owner}/{repo}/rulesets at all, so without this
    # Environment the job could only ever report "unverified". Same secret name
    # as the apply workflow, a different Environment: this one holds a
    # read-only token and needs no reviewers, the apply one holds a
    # read/write token and does. See docs/runbooks/rulesets.md.
    environment: ruleset-verify
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'

      # `git show <base_sha>:<path>` rather than a second checkout: the base
      # commit is already present thanks to fetch-depth 0, and materialising
      # exactly one file keeps the head-ref working tree (which every other
      # step reads) untouched.
      - name: Materialise the base-ref source of truth
        id: sot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          sot_file="$RUNNER_TEMP/base_main_ruleset.json"
          # Distinguish "the base ref has no ruleset file yet" from "git could
          # not answer". Swallowing every git failure as the former reads a
          # missing base commit -- routine after a force-push to the base
          # branch -- as "nothing to check" and passes the gate green. Only a
          # readable base commit that genuinely lacks the file is a skip.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error::base commit $BASE_SHA is not present; cannot establish what the base ref requires."
            exit 1
          fi
          if git cat-file -e "$BASE_SHA:.github/rulesets/main.json" 2>/dev/null; then
            git show "$BASE_SHA:.github/rulesets/main.json" > "$sot_file"
          else
            echo "The base ref carries no .github/rulesets/main.json; this pull request introduces it." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sot_file=$sot_file" >> "$GITHUB_OUTPUT"
          echo "applicable=true" >> "$GITHUB_OUTPUT"

      # Exit 2 means the scan never got to look (no live ruleset yet, or no
      # token) -- a precondition no pull request can satisfy, so it is a
      # warning here rather than a failure. Exit 1 means GitHub is enforcing
      # less than the base ref already claims, which is a real regression and
      # fails the job.
      - name: Check the live ruleset has not lagged behind
        if: steps.sot.outputs.applicable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RULESETS_PAT }}
          TARGET_REPO: ${{ github.repository }}
          SOT_FILE: ${{ steps.sot.outputs.sot_file }}
        run: |
          set -uo pipefail
          set +e
          python3 .github/scripts/gitapex_scan_ruleset_drift.py \
            --repo "$TARGET_REPO" --sot "$SOT_FILE" --scope required-checks 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0) exit 0 ;;
            2) echo "::warning::Ruleset sync unverified; see the job summary and docs/runbooks/rulesets.md."; exit 0 ;;
            *) echo "::error::Ruleset sync failed; see the job summary for which checks are missing, or which committed file is unusable."; exit 1 ;;
          esac
