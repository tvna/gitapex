name: Skill rename lifecycle gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "skills/**/SKILL.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-rename-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # Refs #285 (repair 2, revised after a /code-review finding on the
      # first version of this gate): a plain directory-listing diff
      # (git ls-tree), not git diff --name-status -M's content-similarity
      # rename detection. That heuristic misses a rename bundled with a
      # substantial content rewrite -- similarity below its ~50% default
      # threshold reports separate add/delete lines, never an R<NN> pair,
      # so the gate silently skipped exactly the renames most likely to
      # need this check. Comparing directory *names* present at the merge
      # base vs. head is unaffected by how much file content changed.
      #
      # git merge-base below -- drift gate:
      # tests/test_gitapex_gate_skill_rename_lifecycle.py's own
      # test_the_workflow_uses_merge_base_not_base_sha.
      #
      # Only removed names paired with at least one added skill in the
      # same diff trigger the check -- a pure removal with nothing added
      # back is a deliberate retirement, not a rename, and is out of this
      # gate's scope.
      - name: Determine removed skill directories
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
            echo "::error::git merge-base failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          base_file="$RUNNER_TEMP/base_skills.txt"
          head_file="$RUNNER_TEMP/head_skills.txt"
          removed_file="$RUNNER_TEMP/removed_skills.txt"
          git ls-tree -d --name-only "$merge_base" -- skills/ | sed -E 's#^skills/##' | sort > "$base_file"
          git ls-tree -d --name-only "$HEAD_SHA" -- skills/ | sed -E 's#^skills/##' | sort > "$head_file"
          comm -23 "$base_file" "$head_file" > "$removed_file"
          added_count=$(comm -13 "$base_file" "$head_file" | wc -l)
          echo "removed_file=$removed_file" >> "$GITHUB_OUTPUT"
          if [ -s "$removed_file" ] && [ "$added_count" -gt 0 ]; then
            echo "Skill directories removed in this diff (candidate renames):"
            cat "$removed_file"
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "No skill directory both removed and added in this diff; skipping."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check renamedFrom is recorded
        if: steps.diff.outputs.applicable == 'true'
        run: |
          set -euo pipefail
          uv run --frozen python3 .github/scripts/gitapex_gate_skill_rename_lifecycle.py --removed "${{ steps.diff.outputs.removed_file }}"
