name: Bash-safety differential deep scan

# Issue #1365: the PR-blocking gate's own differential Hypothesis property
# tests for the two bash-safety classifiers (hooks/gitapex_check_bash_safety.py
# and skills/executing-a-branch-plan/scripts/gitapex_check_task_bash_safety.py)
# stay pinned to a fast, deterministic settings (derandomize=True,
# max_examples=200) so every PR run is quick and reproducible. This
# scheduled, non-PR-blocking job re-runs the same two differential test
# files with GITAPEX_HYPOTHESIS_DEEP_SCAN=1, which each file's own
# _PROPERTIES settings object reads to switch to (derandomize=False,
# max_examples=5000) instead -- substantially higher, randomized
# exploration of the real-bash oracle differential, at the cost of a much
# longer run, without ever touching the PR-blocking gate's own default
# settings or duplicating any test body.
on:
  schedule:
    - cron: "0 11 * * *"  # daily 11:00 UTC, offset from the 06:00/07:00/08:00/09:00/10:00 scans
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Pinned to main explicitly: workflow_dispatch checks out whatever
      # ref the operator selected in the UI, which defaults to the
      # currently-viewed branch, not necessarily main. Without this pin, a
      # manual run from a feature branch would scan that branch's own
      # (possibly stale or in-flight) classifier code instead of main's.
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Run bash-safety differential suites at higher exploration
        env:
          GITAPEX_HYPOTHESIS_DEEP_SCAN: "1"
        run: |
          set -o pipefail
          rc=0
          uv run --frozen pytest \
            tests/test_gitapex_check_bash_safety_differential.py \
            tests/test_gitapex_check_task_bash_safety_differential.py \
            --no-cov -v > pytest-output.txt 2>&1 || rc=$?
          {
            echo "## Bash-safety differential deep scan"
            echo '```'
            cat pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat pytest-output.txt
          exit "$rc"
