name: Retro title convention citation gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "skills/**/*.md"
      - "docs/**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retro-title-convention-citation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Issue #520 (row 1, refs #344): only files this PR actually adds or
      # modifies need checking -- pre-existing, already-shipped content is
      # out of scope for a gate whose job is to catch a claim *before it
      # ships*. A three-dot (merge-base) diff, not a two-dot direct diff,
      # matches skill-audit-gate.yml's own rationale: a file changed on the
      # base branch after this PR forked must never be misattributed here.
      # A pure deletion has no new claim to check, so it is excluded the
      # same way skill-audit-gate.yml excludes D/R100 statuses.
      #
      # git's default pathspec matching requires "**" to span at least one
      # directory segment -- 'docs/**/*.md' does NOT match a file directly
      # under docs/ (e.g. docs/glossary.md), unlike this workflow's own
      # `on.pull_request.paths` trigger glob above (a different engine,
      # zero-or-more semantics). Both the "**" form and the plain "*" form
      # are listed explicitly so a top-level docs/*.md edit is never
      # silently skipped by this step even though it correctly triggered
      # the workflow.
      - name: Determine changed doc/skill files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! diff_output=$(git diff --name-status "$BASE_SHA...$HEAD_SHA" -- \
              'skills/*.md' 'skills/**/*.md' 'docs/*.md' 'docs/**/*.md'); then
            echo "::error::git diff failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          changed=$(printf '%s\n' "$diff_output" | grep -vE '^(D|R100)[[:space:]]' | awk -F'\t' '{print $NF}' || true)
          if [ -z "$changed" ]; then
            echo "No added/modified skill or doc Markdown files in this diff; skipping."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Added/modified files requiring the convention-citation check:"
          echo "$changed"
          {
            echo "applicable=true"
            echo "files<<GITAPEX_EOF"
            echo "$changed"
            echo "GITAPEX_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check title/identity convention citations
        if: steps.diff.outputs.applicable == 'true'
        env:
          FILES: ${{ steps.diff.outputs.files }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # -d '\n' (GNU xargs, available on ubuntu-latest): split strictly
          # on newlines, not arbitrary whitespace, and disable xargs' own
          # quote/backslash interpretation -- a doc path containing a space
          # or a single quote must pass through as one argument, not get
          # split or abort xargs with "unmatched quote".
          printf '%s\n' "$FILES" | xargs -d '\n' -r python3 .github/scripts/gate_retro_title_convention_citation.py \
            --owner "${{ github.repository_owner }}" --repo "${{ github.event.repository.name }}"
