# Cross-model eval matrix for the committed waza suites (issue #106).
#
# This is the harness that lets a credentialed run MEASURE the repo's
# cross-model consistency concept instead of asserting it. It is advisory and
# manual only (workflow_dispatch): it never runs on push/PR and never gates a
# merge -- the same advisory posture waza-check.yml held before its
# retirement in issue #1135: a report, not a gate.
#
# It cannot produce results until the owner provisions the credential each
# job's own preflight step requires -- ANTHROPIC_API_KEY for `eval-matrix`
# (issue #1134: it runs evals/scripts/gitapex_run_eval_suite.py, a `claude`
# CLI subprocess, not waza) and the HF Inference Endpoint secrets for
# `eval-matrix-hf-gemma4` (issue #1259: also gitapex_run_eval_suite.py, via
# its own --executor http flag -- neither job shells out to waza anymore;
# see that job's own header comment). Until then a dispatch fails loudly at
# preflight rather than running against a missing endpoint -- no silent
# no-op, no fabricated readiness (CLAUDE.md sections 1 and 4).
#
# `eval-matrix-hf-gemma4` (issue #317, sub-task of #310) is an additive,
# independent lane, not a replacement of `eval-matrix` above: it answers a
# different question (does this skill survive on a structurally different,
# non-frontier-scale model?) than the Claude-tier consistency lane (do Claude
# opus/sonnet/haiku behave consistently?). Model: google/gemma-4-31B-it, the
# largest Gemma 4 variant on Hugging Face whose published (bf16 safetensors)
# weights are <=100GB -- confirmed 62.6GB total (49.8GB + 12.8GB across two
# safetensors shards) at https://huggingface.co/google/gemma-4-31B-it, larger
# than the other four Gemma 4 sizes (E2B, E4B, 12B, 26B-A4B). Serving
# mechanism: a Hugging Face Inference Endpoint, reached directly over HTTP by
# evals/scripts/gitapex_run_http_executor.py (issue #1259) via the official
# openai SDK's own base-URL override -- not a new self-hosted runner or GPU,
# avoiding the standing operational burden Ollama would add to a
# single-maintainer public repo. See
# docs/superpowers/specs/2026-08-23-hf-gemma4-http-executor-design.md for
# the full decision trail and an explicitly disclosed assumption this lane
# rests on (unverified in CI -- no live credentials in this repository's own
# development environment): that the HF endpoint exposes an
# OpenAI-Chat-Completions-compatible surface, reachable with the bearer
# token this job passes as HTTP_EXECUTOR_API_KEY.
name: Skill eval matrix (cross-model, advisory)

on:
  workflow_dispatch:
    inputs:
      models:
        description: >-
          JSON array of model ids to fan out over, e.g.
          ["claude-opus-5","claude-sonnet-5","claude-haiku-4-5-20251001"]. The
          exact tier ids depend on which models your copilot-sdk endpoint
          exposes, so they are an input here rather than hardcoded. Default is
          the one tier the committed suites already pin. A dispatch may name a
          tier outside .github/scripts/gitapex_gate_eval_declared_model.py's
          allowlist -- that gate grades committed declarations, and probing an
          id the allowlist has not yet approved is one legitimate way to find
          out whether it should be.
        required: false
        default: '["claude-sonnet-5"]'
      run_hf_gemma4:
        description: >-
          Set to "true" to also run the eval-matrix-hf-gemma4 lane. Defaults
          to "false": without this explicit opt-in, a plain dispatch of this
          workflow (e.g. for the Claude-tier eval-matrix job) would otherwise
          also schedule the separately-billed HF Inference Endpoint job every
          time, and would fail loudly at its own preflight step until
          HF_INFERENCE_ENDPOINT_URL/HF_API_TOKEN are provisioned even when
          only the Claude lane was actually wanted.
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(github.event.inputs.models) }}
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02

      # Issue #1134: this job no longer needs waza/Nix at all -- the run step
      # below now calls evals/scripts/gitapex_run_eval_suite.py (#1132/#1157),
      # a repository-owned runner that never shells out to the waza binary.
      # (The sibling eval-matrix-hf-gemma4 job below made the identical
      # cutover in issue #1259 -- see its own header comment.)
      #
      # Needed to run both the preflight check and the eval-suite runner
      # below via `uv run` -- bare-python3-invocation-gate.yml requires every
      # `.github/scripts/*.py` workflow call site to go through `uv run`, and
      # gitapex_run_eval_suite.py's own module docstring requires the same
      # for itself (it reaches PyYAML through gitapex_run_ablation.py).
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # Fail loudly if the credential the new runner's model-CLI subprocess
      # needs is not configured, before any run is attempted. Presence is
      # checked; the value is never printed (CLAUDE.md section 4 -- secrets
      # must not reach a log).
      #
      # ANTHROPIC_API_KEY, not COPILOT_BASE_URL/COPILOT_PROVIDER_BASE_URL
      # (issue #1134, replacing this job's former shared preflight,
      # gitapex_check_copilot_endpoint_configured.py): the new runner
      # executes exclusively through evals/scripts/gitapex_run_ablation.py's
      # `claude` CLI subprocess, whose own hermetic env allowlist
      # (`_HERMETIC_ENV_ALLOWLIST`) passes through only PATH/HOME/
      # ANTHROPIC_API_KEY/TMPDIR/TMP/TEMP -- verified by reading that
      # module's source, not assumed. The old copilot-sdk endpoint pair is
      # not read anywhere on this path and would preflight the wrong thing.
      - name: Preflight -- require ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No ANTHROPIC_API_KEY configured. Set repository" \
              "secret ANTHROPIC_API_KEY under Settings -> Secrets and" \
              "variables -> Actions before dispatching --" \
              "evals/scripts/gitapex_run_eval_suite.py invokes the claude CLI" \
              "directly and needs this for authentication. Never printed" \
              "here; only checked for presence."
            exit 1
          fi

      # evals/scripts/gitapex_run_ablation.build_command shells out to the
      # `claude` CLI directly (`argv = [model_cli, "-p", prompt, ...]`,
      # DEFAULT_MODEL_CLI = "claude") -- unlike waza, this binary is not
      # provisioned by this repo's own Nix flake, and it is not preinstalled
      # on GitHub's ubuntu-latest image (confirmed against
      # actions/runner-images' own published software manifest; the only
      # other workflow in this repo that runs Claude in CI,
      # ranking-the-open-queue-weekly.yml, does it through
      # anthropics/claude-code-action, a wrapped whole-session action with no
      # bare CLI left on PATH for a later step to shell out to -- not usable
      # here). Installed via npm (Node.js already ships on ubuntu-latest, per
      # the same manifest), pinned to a specific released version rather than
      # `@latest`, matching this repo's own pin-everything convention for CI
      # tooling. No Dependabot ecosystem tracks a bare npm install line
      # inside a workflow `run:` step, so this pin needs a deliberate,
      # manual bump over time, not a silent drift.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.240

      # For each committed suite: rewrite its config.model to this matrix
      # tier (the new runner reads config.model from eval.yaml itself and
      # exposes no CLI override either -- confirmed by reading
      # gitapex_run_eval_suite.py's own main(), the same gap
      # gitapex_set_config_model.py's own docstring already named for waza --
      # so this override step is still required, unchanged), then run it via
      # evals/scripts/gitapex_run_eval_suite.py (issue #1132/#1157), not
      # `nix run .#waza -- run` (issue #1134). The edit lands only on this
      # ephemeral checkout; committed suites stay pinned to their default.
      # Each suite's directory name is its skill name, with its SKILL.md at
      # `skills/<skill>/SKILL.md`. Results land under results/<model>/ and
      # are summarized to the job summary, and retained as an uploaded
      # artifact by the step below.
      #
      # An adversarial review of this PR (issue #1134) caught a real defect
      # in an earlier revision of this step: gitapex_run_eval_suite.py's own
      # `main()` returns 0 whenever run_eval_suite() completes without an
      # exception, regardless of the computed `mean_score` -- it only
      # returns non-zero on malformed input or an execution failure
      # (crash/timeout), never on a suite that simply scored low. Trusting
      # that exit code alone (as an earlier revision did) would report
      # "pass" for a skill that scored 0.0 on every fixture, as long as the
      # `claude` CLI subprocess itself did not crash -- silently defeating
      # the whole point of this matrix. Every committed `eval.yaml` declares
      # exactly one `metrics[]` entry with its own `threshold` (verified
      # against all 26 committed suites) -- the model override above rewrites
      # only the `config.model` line, so `$suite`'s own `metrics[].threshold`
      # still reflects the suite's real, unmodified bar. This step now
      # separately reads the run's own written `mean_score` and that
      # threshold, and only reports "pass" when the score actually clears
      # it. A second review pass caught that an earlier revision of this
      # check indexed `metrics[0]` unconditionally -- the vendored eval
      # schema allows any `metrics[]` length >= 1, so a future suite
      # declaring a second, stricter metric would have had it silently
      # ignored. This step now fails loudly (a distinct message, not a raw
      # traceback) unless exactly one `metrics[]` entry exists, rather than
      # assuming it.
      - name: Run suites for model ${{ matrix.model }}
        env:
          MODEL: ${{ matrix.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -u
          mkdir -p "results/${MODEL}"
          failed=0
          {
            echo "## Waza eval matrix -- model: ${MODEL}"
            echo ""
            echo "| skill | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Enumerate by eval.yaml so non-suite dirs (e.g. evals/scripts/)
          # are excluded; the skill name is the suite directory's basename.
          for suite in evals/*/eval.yaml; do
            skill="$(basename "$(dirname "$suite")")"
            # A failed override must not fall through to the runner: that
            # would execute the suite at its committed default model yet
            # record it under this matrix tier -- a silently mislabelled
            # result.
            if ! python3 evals/scripts/gitapex_set_config_model.py "$suite" "$MODEL"; then
              echo "| ${skill} | FAIL (model override) |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            out="results/${MODEL}/${skill}.json"
            if ! uv run --frozen python3 evals/scripts/gitapex_run_eval_suite.py \
                 --eval-yaml "$suite" \
                 --skill-md "skills/${skill}/SKILL.md" \
                 -o "$out"; then
              echo "| ${skill} | FAIL (execution error) |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            if uv run --frozen python3 evals/scripts/gitapex_check_suite_threshold.py "$out" "$suite"; then
              echo "| ${skill} | pass |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${skill} | FAIL (below threshold) |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"

      # Result artifact retention (issue #124, carried forward from PR #120:
      # deferred there "to avoid committing an unverified action pin" after
      # the pin lookup 403'd in that authoring environment). SHA verified
      # live against actions/upload-artifact's own tags
      # (`git ls-remote --tags`): v7 and v7.0.1 resolve to the same commit.
      # `if: always()` so a run that fails partway through the suite loop
      # above still uploads whatever results/<model>/*.json completed before
      # the failure, rather than losing them because the step exited
      # non-zero. One artifact per matrix instance: upload-artifact requires
      # unique names within a workflow run and explicitly documents the
      # matrix case (a bare `results` name here would collide across
      # `matrix.model` instances and fail every run past the first to finish).
      - name: Upload results for model ${{ matrix.model }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eval-matrix-results-${{ matrix.model }}
          path: results/${{ matrix.model }}/
          if-no-files-found: warn

  # Additive cross-vendor portability lane (issue #317, sub-task of #310).
  # Answers a different question than eval-matrix above (Claude-tier
  # consistency): does this skill survive on a structurally different,
  # non-frontier-scale model? Same fail-loud-at-preflight / advisory-only /
  # never-merge-gating shape as eval-matrix, reusing its own committed
  # gitapex_set_config_model.py override script unmodified -- no new files, no new
  # self-hosted runner (see the header comment above for the model-size and
  # serving-mechanism decision trail and citations).
  #
  # Issue #1259: this job no longer needs waza/Nix either -- it now calls
  # evals/scripts/gitapex_run_eval_suite.py's own --executor http flag
  # (evals/scripts/gitapex_run_http_executor.py, an argv-adapter Executor
  # backed by the official openai SDK), matching the eval-matrix job's own
  # cutover in #1134. This does not weaken gitapex_run_ablation.py's
  # existing hermetic-by-default guarantee for its Claude-CLI path (that
  # module is unchanged): --executor http is an additional, explicit
  # opt-in surface this job selects deliberately, not a relaxation of the
  # default. Primary-source finding backing this cutover (design doc
  # docs/superpowers/specs/2026-08-23-hf-gemma4-http-executor-design.md):
  # waza's own copilot-sdk executor does not make a bare HTTP call itself
  # -- it launches an embedded GitHub Copilot CLI subprocess via the
  # Copilot SDK, and that embedded CLI is what actually reaches a custom
  # provider. This job's new executor calls the HF endpoint directly,
  # resting on the same disclosed, unverified-in-CI assumption the prior
  # revision of this comment already carried: that the endpoint exposes an
  # OpenAI-Chat-Completions-compatible surface -- unchanged by this cutover,
  # only which code path relies on it.
  eval-matrix-hf-gemma4:
    # Explicit opt-in only: a plain dispatch of this workflow (e.g. to run
    # the existing Claude-tier eval-matrix job) must not also silently
    # schedule this separately-billed HF lane or fail it at preflight for
    # secrets nobody asked to use this time.
    if: ${{ github.event.inputs.run_hf_gemma4 == 'true' }}
    runs-on: ubuntu-latest
    # 45m (eval-matrix's own budget, copied here originally) is not enough:
    # this job loops over all committed suites sequentially in one runner
    # (no parallel: true anywhere in this repo's suites), and as of this
    # writing that is 19 suites / 183 tasks (`ls evals/*/eval.yaml`,
    # `ls evals/*/tasks/*.yaml`) -- under 15s/task budget at 45m once
    # checkout, uv setup, and HF endpoint latency are subtracted. This 180m
    # figure is a conservative, UNMEASURED estimate sized off that
    # suite/task count, not a verified figure from a real timed dispatch
    # (this repository has no live HF credentials to execute one -- see the
    # design doc's disclosed residual risk). Carried forward unchanged from
    # this job's pre-#1259 (waza/Nix) revision -- the per-suite loop shape
    # and HTTP latency profile this estimate was sized against have not
    # materially changed with the executor cutover. Adjust down once a live
    # dispatch (after secrets are provisioned) reports an actual runtime.
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      HF_GEMMA4_MODEL: google/gemma-4-31B-it
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02

      # Issue #1259: this job no longer needs waza/Nix at all -- the run
      # step below now calls evals/scripts/gitapex_run_eval_suite.py's own
      # --executor http flag, a repository-owned runner that never shells
      # out to the waza binary. Needed to run both the preflight check and
      # the eval-suite runner below via `uv run` -- bare-python3-invocation-
      # gate.yml requires every `.github/scripts/*.py` workflow call site to
      # go through `uv run`, and gitapex_run_eval_suite.py's own module
      # docstring requires the same for itself.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # Fail loudly if the HF Inference Endpoint credentials are not
      # configured, before any run is attempted. Presence is checked; values
      # are never printed (CLAUDE.md section 4 -- secrets must not reach a
      # log). See the PR body for the exact issuance path (creation
      # location, minimum scope, rotation). Checked variable names
      # (HTTP_EXECUTOR_BASE_URL/HTTP_EXECUTOR_API_KEY) match what the run
      # step below actually passes to gitapex_run_eval_suite.py --executor
      # http -- the underlying repository secrets
      # (HF_INFERENCE_ENDPOINT_URL/HF_API_TOKEN) are unchanged from before
      # this cutover, only which internal env var name they populate.
      - name: Preflight -- require HF Inference Endpoint secrets
        env:
          HTTP_EXECUTOR_BASE_URL: ${{ secrets.HF_INFERENCE_ENDPOINT_URL }}
          HTTP_EXECUTOR_API_KEY: ${{ secrets.HF_API_TOKEN }}
        run: |
          if [ -z "$HTTP_EXECUTOR_BASE_URL" ] || [ -z "$HTTP_EXECUTOR_API_KEY" ]; then
            echo "::error::No Hugging Face Inference Endpoint configured. Set" \
              "repository secrets HF_INFERENCE_ENDPOINT_URL and HF_API_TOKEN" \
              "under Settings -> Secrets and variables -> Actions before" \
              "dispatching. See issue #317 / this lane's PR body for the" \
              "issuance path."
            exit 1
          fi

      # For each committed suite: rewrite its config.model to the confirmed
      # Gemma 4 model id (same gitapex_set_config_model.py the eval-matrix job uses,
      # unmodified), then run it via evals/scripts/gitapex_run_eval_suite.py
      # --executor http (issue #1259), not `nix run .#waza -- run`. The
      # edit lands only on this ephemeral checkout; committed suites stay
      # pinned to their default. HF_INFERENCE_ENDPOINT_URL is passed as
      # HTTP_EXECUTOR_BASE_URL, the base-URL override
      # evals/scripts/gitapex_run_http_executor.py's own HttpExecutorConfig
      # reads; the token is passed as HTTP_EXECUTOR_API_KEY. This assumes
      # the endpoint exposes an OpenAI-Chat-Completions-compatible surface
      # -- disclosed explicitly rather than asserted as confirmed, since
      # this repository has no live credentials to verify it, the same
      # unexecuted status this lane has carried since #106. Mean-score-vs-
      # threshold check reused verbatim from the eval-matrix job's own
      # pattern above (see that job's own run step comment for the full
      # rationale, including the two adversarial-review-caught defects that
      # step's own logic already guards against).
      - name: Run suites against the HF Gemma 4 endpoint
        env:
          MODEL: ${{ env.HF_GEMMA4_MODEL }}
          HTTP_EXECUTOR_BASE_URL: ${{ secrets.HF_INFERENCE_ENDPOINT_URL }}
          HTTP_EXECUTOR_API_KEY: ${{ secrets.HF_API_TOKEN }}
        run: |
          set -u
          mkdir -p "results/${MODEL}"
          failed=0
          {
            echo "## Waza eval matrix -- HF Inference Endpoint model: ${MODEL}"
            echo ""
            echo "| skill | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Enumerate by eval.yaml so non-suite dirs (e.g. evals/scripts/)
          # are excluded; the skill name is the suite directory's basename.
          for suite in evals/*/eval.yaml; do
            skill="$(basename "$(dirname "$suite")")"
            # A failed override must not fall through to the runner: that
            # would execute the suite at its committed default model yet
            # record it under this lane -- a silently mislabelled result.
            if ! python3 evals/scripts/gitapex_set_config_model.py "$suite" "$MODEL"; then
              echo "| ${skill} | FAIL (model override) |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            out="results/${MODEL}/${skill}.json"
            if ! uv run --frozen python3 evals/scripts/gitapex_run_eval_suite.py \
                 --eval-yaml "$suite" \
                 --skill-md "skills/${skill}/SKILL.md" \
                 --executor http \
                 -o "$out"; then
              echo "| ${skill} | FAIL (execution error) |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            if uv run --frozen python3 evals/scripts/gitapex_check_suite_threshold.py "$out" "$suite"; then
              echo "| ${skill} | pass |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${skill} | FAIL (below threshold) |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"

      # Result artifact retention (issue #124), same rationale and SHA as
      # eval-matrix's own upload step above. No matrix here (this job runs
      # once, against the one HF_GEMMA4_MODEL), so a static name is safe --
      # unlike eval-matrix, there is no `matrix.model` collision risk to
      # suffix against.
      - name: Upload HF Gemma 4 results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eval-matrix-hf-gemma4-results
          path: results/
          if-no-files-found: warn
