name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Run pytest
        run: uv run --frozen pytest --cov-report=xml --cov-report=json

      # Issue #536: evals/scripts/*.py had no minimum-coverage floor, so a
      # file's CLI surface could ship untested (PR #512's own retrospective
      # finding) without CI ever flagging it. coverage.json already exists
      # from the pytest step above; this only asserts a threshold on what
      # it measured.
      - name: Enforce evals/scripts coverage minimum
        run: uv run --frozen python3 .github/scripts/gate_evals_scripts_coverage.py --coverage-json coverage.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
