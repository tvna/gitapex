name: Routine scope enforcement gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "docs/superpowers/specs/*routine*.md"
      - "docs/superpowers/specs/*Routine*.md"
      - "docs/gitapex/specs/*routine*.md"
      - "docs/gitapex/specs/*Routine*.md"
      - "skills/**/metadata/gitapex.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routine-scope-enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # No fetch-depth: 0 -- unlike skill-rename-lifecycle-gate.yml (which
      # needs a merge-base and two historical tree listings via git
      # ls-tree), this job's only step is a plain `find` over the checked-
      # out working tree with no git history operation at all, so the
      # default shallow checkout is sufficient and avoids paying for a
      # full-history clone on every trigger.
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # Issue #520 (row 2, refs #348): every Routine-connection doc
      # currently in the repository is checked on each run, not just the
      # ones this diff touches -- a change to a skill's own
      # metadata/gitapex.yaml (e.g. flipping capabilityAssumption to
      # Broad) can turn a previously-compliant doc into an offender
      # without the doc itself changing, so a diff-scoped file list would
      # miss exactly that case. This mirrors
      # skill-rename-lifecycle-gate.yml's own full-tree comparison
      # rationale (a plain listing, not a diff-scoped one, is what makes
      # the check unaffected by which specific file changed).
      - name: Find Routine-connection docs
        id: find
        run: |
          set -euo pipefail
          docs=$( { find docs/superpowers/specs -maxdepth 1 -iname '*routine*.md' 2>/dev/null || true; find docs/gitapex/specs -maxdepth 1 -iname '*routine*.md' 2>/dev/null || true; } | sort)
          if [ -z "$docs" ]; then
            echo "No Routine-connection docs found; skipping."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A discovered filename is PR-author-controlled content (a normal
          # tracked path, not generated), and every line below crosses two
          # trust boundaries: the $GITHUB_OUTPUT heredoc (a filename
          # containing a real embedded newline -- POSIX forbids only "/"
          # and NUL in a filename -- could produce a fragment that reads as
          # the literal line "GITAPEX_EOF", terminating the heredoc early
          # and letting a later fragment overwrite `applicable`) and the
          # downstream `xargs -d '\n'` call (an extra "line" is read as a
          # competing CLI argument, e.g. an injected `--skills-root`).
          # Reject anything that is not the exact single-line shape this
          # convention actually produces -- the same fail-closed discipline
          # `gitapex_compute_skill_audit_flags.py`'s own
          # `_DESIGN_DOC_SHAPE_RE` already applies to this same class of
          # path for the sibling skill-audit-gate.
          bad=$(printf '%s\n' "$docs" | grep -vE '^docs/(superpowers|gitapex)/specs/[A-Za-z0-9._-]+\.md$' || true)
          if [ -n "$bad" ]; then
            echo "::error::a discovered Routine-connection doc path does not match the expected docs/{superpowers,gitapex}/specs/<filename>.md shape" >&2
            exit 1
          fi
          echo "Routine-connection docs to check:"
          echo "$docs"
          {
            echo "applicable=true"
            echo "docs<<GITAPEX_EOF"
            echo "$docs"
            echo "GITAPEX_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check Routine scope enforcement
        if: steps.find.outputs.applicable == 'true'
        env:
          DOCS: ${{ steps.find.outputs.docs }}
        run: |
          set -euo pipefail
          # -d '\n': see retro-title-convention-citation-gate.yml's own
          # xargs step for why plain whitespace/quote splitting is unsafe
          # for a file-path list.
          printf '%s\n' "$DOCS" | xargs -d '\n' -r uv run --frozen python3 .github/scripts/gitapex_gate_routine_scope_enforcement.py --skills-root skills
