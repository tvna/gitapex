# Issue #1722 (from #1704, #1706): recurrence prevention for a defect class
# this repository shipped twice into `gitapex_gate_bare_python3_invocation.py`'s
# own `load_python_dependent_hook_script_names` -- an `except` clause that
# catches a real failure and silently hands back a falsy default (None, an
# empty collection) with no re-raise, turning a bug into a false "clean"
# verdict somewhere else entirely. That function is already fixed on `main`
# (commits f6e97a7, f6bed27); this job runs the AST scan that stops the same
# shape shipping again in `.github/scripts/*.py` or `hooks/*.py`.
#
# Deliberately no `paths:` filter -- drift gate:
# tests/test_gitapex_gate_except_fail_open.py's own
# test_the_workflow_has_no_paths_filter, matching
# exception-handler-gap-gate.yml's own identical precedent (GitHub's own
# skipped-vs-never-ran distinction for a required check).
name: Except-clause fail-open gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  except-fail-open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # ref:/fetch-depth: '0' below is this gate's own diff-post-image
      # checkout pin -- drift gate: tests/test_gitapex_gate_except_fail_open.py's
      # own test_the_workflow_checks_out_the_head_sha_with_full_history,
      # matching exception-handler-gap-gate.yml's own identical precedent
      # (this gate correlates diff-derived line numbers with tree content).
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # git merge-base below -- drift gate:
      # tests/test_gitapex_gate_except_fail_open.py's own
      # test_the_workflow_uses_merge_base_not_base_sha.
      #
      # The two `git diff` flags below (--no-renames, -c
      # core.quotePath=false) -- drift gate:
      # tests/test_gitapex_gate_except_fail_open.py's own
      # test_the_workflow_passes_the_two_flags_the_gate_depends_on.
      #
      # Issue #1035: every `.github/scripts/*.py` invocation goes through
      # `uv run` regardless of whether the script needs a third-party
      # dependency -- load-bearing here too, since this gate carries a real
      # `pydantic` import for its own CLI-arg validation.
      - name: Grade the except clauses this diff adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
            echo "::error::git merge-base failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          git -c core.quotePath=false diff -U0 --no-renames "$merge_base" "$HEAD_SHA" \
              -- '.github/scripts/*.py' 'hooks/*.py' \
            | uv run --frozen python3 .github/scripts/gitapex_gate_except_fail_open.py
