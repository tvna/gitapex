name: Retrospective gate-drift meta-check

on:
  schedule:
    - cron: "0 7 * * *"  # daily 07:00 UTC, first of the offset daily scans
  workflow_dispatch: {}

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  retrospective-gate-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Pinned to main explicitly: workflow_dispatch checks out whatever
      # ref the operator selected in the UI, which defaults to the
      # currently-viewed branch, not necessarily main. Without this pin, a
      # manual run from a feature branch would scan that branch's history
      # (a false pass on an unmerged citation, or a false failure on a
      # stale branch) while the report text still claims it evaluated main.
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          ref: main
          fetch-depth: '0'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # Issue #1406 (refs #297, #187, #242, #246, #709, #1297; supersedes
      # this step's own prior scope): the flat gate-proposal-issues design
      # (docs/superpowers/specs/2026-08-29-flat-gate-proposal-issues-design.md)
      # files every missing-deterministic-gate retrospective finding as its
      # own standalone `gate-proposal`-labelled issue instead of leaving it
      # embedded in an ever-growing `retrospective`-labelled issue, so this
      # step is rescoped to audit that new label: confirm the label itself
      # still exists, report (threshold-gated, unchanged at 20) its
      # currently-open issue count, and fail on any closed labelled issue
      # that never passed the existing two-signal check (no time window, no
      # reopen action -- a human resolves that by hand). No
      # continue-on-error here -- unlike waza-check.yml (retired in issue
      # #1135), this job is meant to actually fail when either pass trips.
      # `--label` is omitted deliberately: it now defaults to the script's
      # own `GATE_PROPOSAL_LABEL` constant.
      - name: Scan gate-proposal label for drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          uv run --frozen python3 .github/scripts/gitapex_scan_retrospective_gate_drift.py \
            --owner tvna --repo gitapex --ref HEAD --threshold 20 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Issue #1653: the two-signal check above audits already-CLOSED
      # gate-proposal issues, but never verifies an OPEN
      # gate-proposal-umbrella issue's own stated `Consolidates: #a, #b,
      # ...` claim (that every named source issue is actually closed as
      # its duplicate). #1566-#1575 (10 umbrella issues, 32 referenced
      # source issues total) sat with that claim unverified for roughly a
      # day before a human caught it and closed them by hand -- this step
      # closes that gap. Sibling script, not a third pass in the scan
      # above (see that script's own module docstring for why); runs
      # regardless of the scan step's own outcome (`if: ${{ !cancelled()
      # }}`, matching the GPRR step below) since this is an independent
      # concern from that step's own threshold/two-signal result.
      # Informational, like every other pass in this workflow: no
      # continue-on-error, so a red result here still fails this job, but
      # nothing beyond that -- it does not block any PR.
      - name: Scan gate-proposal-umbrella consolidation claims for drift
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          uv run --frozen python3 .github/scripts/gitapex_scan_gate_proposal_consolidation_drift.py \
            --owner tvna --repo gitapex \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Issue #726: reports the Gate-Preventable Repair Rate (GPRR) --
      # what share of classified retrospective repairs were
      # missing-deterministic-gate, trended by week -- as an inspectable
      # numeric time series rather than only this workflow's own
      # threshold pass/fail check above. Deliberately informational: it
      # never fails the run on the computed value itself (see
      # docs/superpowers/specs/2026-08-04-gprr-design.md Decision 5), only
      # on a genuine GitHub API error, so no continue-on-error is needed
      # for that reason -- there is nothing else here that would trip it.
      # Recomputes the full series from source every run instead of
      # persisting one (Decision 2), so it needs no extra write scope
      # beyond the added `pull-requests: read` above (for the merged-PR
      # denominator).
      #
      # `if: ${{ !cancelled() }}`: without this, GitHub Actions skips
      # every step after the citation-drift step above fails (which it
      # deliberately does whenever the no-citation backlog exceeds its
      # threshold -- an expected, not exceptional, outcome). The GPRR
      # trend is exactly the kind of context most useful to see on a day
      # the citation-drift check is red, so it must not silently vanish
      # from the step summary on precisely those days. Still respects an
      # operator-cancelled run (unlike `always()`), and the job's overall
      # pass/fail status is unaffected either way -- it still reflects
      # the citation-drift step's own outcome.
      - name: Compute Gate-Preventable Repair Rate (GPRR)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          uv run --frozen python3 .github/scripts/gitapex_compute_gprr.py \
            --owner tvna --repo gitapex \
            | tee -a "$GITHUB_STEP_SUMMARY"
