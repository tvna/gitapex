# The workflow name stays "Lint workflows" even though it now also lints
# Python (issue #678). A branch-protection required check is identified by
# "<workflow name> / <job id>", and that setting lives in GitHub, where no
# in-repo tooling can read or update it. Renaming here would silently
# invalidate any existing "Lint workflows / actionlint" entry. Adding the
# ruff job already needs one admin change; this avoids needing two.
name: Lint workflows

# Deliberately no `paths:` filter, for the reason waza-eval-gate.yml's own
# header states at length and docs/superpowers/plans/
# 2026-07-30-evals-required-merge-gate.md records as a decision: GitHub
# distinguishes a job that runs and reports `skipped` (does not block a
# required check) from a workflow that never fires at all for a given PR
# (leaves the required check `Pending` forever). A `paths:` trigger filter
# is the second case. Both jobs here are intended for promotion to required
# status checks, so a filter would permanently block any PR that happens
# not to touch a matched path. Running unconditionally is the
# required-check-safe shape, and it also removes any dependence on getting
# a `**/*.py`-style glob right under GitHub's own filter semantics.
# The cost is a checkout plus two short jobs on every PR, the same price
# waza-eval-gate.yml accepted for the same reason.
on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02

      # Pinned by image digest (not just the 1.7.12 tag) for the same
      # supply-chain reason the other pinned actions in this repo use a
      # commit SHA rather than a mutable version tag.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # Deliberately NOT a pinned ruff action or docker digest, unlike the
      # actionlint step above. Issue #678's whole finding was that `ruff`
      # here resolved from ambient PATH state rather than from the declared
      # environment; a separately-pinned CI image would leave that split in
      # place, with CI enforcing one ruff and contributors running another.
      # `uv run` resolves the single version recorded in uv.lock, wheel
      # hashes and all, so this job and a local run are the same ruff.
      #
      # --locked, NOT --frozen. The two are not interchangeable: --frozen
      # means "run without updating uv.lock", which happily runs the locked
      # ruff even when pyproject.toml now asks for a different one, exit 0
      # and no warning. --locked asserts uv.lock is still in sync with
      # pyproject.toml and errors when it is not. Only the second one
      # actually closes the drift this gate exists to close, so bumping the
      # pin without running `uv lock` fails here instead of silently
      # enforcing the old rule set.
      - name: Run ruff
        run: uv run --locked ruff check --output-format github .
