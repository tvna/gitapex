# The workflow name stays "Lint workflows" even though it now also lints
# Python (issue #678). A branch-protection required check is identified by
# "<workflow name> / <job id>", and that setting lives in GitHub, where no
# in-repo tooling can read or update it. Renaming here would silently
# invalidate any existing "Lint workflows / actionlint" entry. Adding the
# ruff job already needs one admin change; this avoids needing two.
name: Lint workflows

# pyproject.toml and uv.lock are in the filter so a change to the ruff
# configuration or to the pinned ruff version is itself checked, not just
# changes to the Python it governs. The actionlint job also runs on a
# Python-only change as a result -- GitHub filters paths per workflow, not
# per job -- which costs a few seconds and cannot report a false failure,
# since it reads only the workflow files.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pinned by image digest (not just the 1.7.12 tag) for the same
      # supply-chain reason the other pinned actions in this repo use a
      # commit SHA rather than a mutable version tag.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # Deliberately NOT a pinned ruff action or docker digest, unlike the
      # actionlint step above. Issue #678's whole finding was that `ruff`
      # here resolved from ambient PATH state rather than from the declared
      # environment; a separately-pinned CI image would leave that split in
      # place, with CI enforcing one ruff and contributors running another.
      # `uv run --frozen` resolves the single version recorded in uv.lock
      # (wheel hashes and all), so this job and a local run are the same
      # ruff by construction. --frozen fails rather than silently
      # re-resolving if uv.lock and pyproject.toml have drifted apart.
      - name: Run ruff
        run: uv run --frozen ruff check --output-format github .
