name: Skill audit disclosure gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    # The last three entries exist for the deterministic-gate-quality
    # check (issue #673): .gitapex/ssot.json registers gate implementations
    # under hooks/ and .github/workflows/ as well as .github/scripts/, and
    # the registry file itself determines that scope. None of them matched
    # any pre-existing entry, so without these the job would simply never
    # run for a PR that deleted a PreToolUse hook gate or dropped a gate
    # from the registry.
    #
    # No gate_*.py / scan_*.py entry is added: the .github/scripts/*.py
    # entry already fires for both, verified live rather than assumed --
    # PR #651 touched none of the other four entries, only
    # .github/scripts/gitapex_gate_plugin_root_brace_notation.py, and this workflow
    # ran and passed on it (check run 91426145937 of run 30721581500).
    paths:
      - "skills/**/SKILL.md"
      - "docs/superpowers/specs/*.md"
      - "skills/*/scripts/*.py"
      - "evals/scripts/*.py"
      - ".github/scripts/*.py"
      - "hooks/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".gitapex/ssot.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-audit-disclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # Refs #248 (refs #242, #246): battle-testing-a-skill and
      # evaluating-skill-quality both require a model-judgment subagent
      # dispatch, so this gate cannot grade their verdicts in CI -- it
      # only requires that a PR touching skills/*/SKILL.md discloses
      # both audits' outcome (or an explicit waiver) in its body.
      #
      # Issue #874: the applicability computation this step used to carry
      # inline -- ~150 lines of bash implementing the D/R100 filter, the
      # `:(glob)` pathspecs, the shape validation, the gate-detection call
      # and the per-skill description/eval-coverage/security signals -- now
      # lives in .github/scripts/gitapex_compute_skill_audit_flags.py, so
      # an agent can reproduce this verdict locally *before* pushing
      # (`gitapex_gate_skill_audit_disclosure.py --check-diff`) instead of
      # discovering it from a failed check on an already-open PR. The rules
      # themselves are unchanged; see that module's docstring, which
      # carries the rationale each of them was written with.
      #
      # stdout is the machine channel (key=value lines appended straight to
      # $GITHUB_OUTPUT) and every diagnostic goes to stderr, so a failed
      # computation cannot persist a partial flag set: the script writes
      # nothing to stdout unless the whole computation succeeded.
      - name: Determine changed SKILL.md, design-doc, checker-script, and gate-script files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          uv run -qq --frozen python3 .github/scripts/gitapex_compute_skill_audit_flags.py \
            --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" \
            --format github-output >> "$GITHUB_OUTPUT"

      # PR_BODY carries untrusted external text (anyone with PR-author
      # access controls it) -- passed via env, never interpolated
      # directly into this step's shell script, to avoid GitHub Actions
      # expression/script injection.
      - name: Check skill audit disclosure
        if: steps.diff.outputs.applicable == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          DESCRIPTION_CHANGED_SKILLS: ${{ steps.diff.outputs.description-changed-skills }}
          NEEDS_EVAL_COVERAGE_SKILLS: ${{ steps.diff.outputs.needs-eval-coverage-skills }}
          SECURITY_RELEVANT_SKILLS: ${{ steps.diff.outputs.security-relevant-skills }}
          CHANGED_DESIGN_DOCS: ${{ steps.diff.outputs.changed-design-docs }}
          CHANGED_CHECKER_SCRIPTS: ${{ steps.diff.outputs.changed-checker-scripts }}
          CHANGED_GATE_SCRIPTS: ${{ steps.diff.outputs.changed-gate-scripts }}
          CHANGED_CHECKER_OR_GATE_SCRIPTS: ${{ steps.diff.outputs.changed-checker-or-gate-scripts }}
          SKILL_MD_CHANGED: ${{ steps.diff.outputs.skill-md-changed }}
        run: |
          set -euo pipefail
          skill_md_changed_flag=()
          if [ "$SKILL_MD_CHANGED" = "true" ]; then
            skill_md_changed_flag=(--skill-md-changed)
          fi
          printf '%s' "$PR_BODY" | uv run --frozen python3 .github/scripts/gitapex_gate_skill_audit_disclosure.py \
            --description-changed-skills "$DESCRIPTION_CHANGED_SKILLS" \
            --needs-eval-coverage-skills "$NEEDS_EVAL_COVERAGE_SKILLS" \
            --security-relevant-skills "$SECURITY_RELEVANT_SKILLS" \
            --changed-design-docs "$CHANGED_DESIGN_DOCS" \
            --changed-checker-scripts "$CHANGED_CHECKER_SCRIPTS" \
            --changed-gate-scripts "$CHANGED_GATE_SCRIPTS" \
            --changed-checker-or-gate-scripts "$CHANGED_CHECKER_OR_GATE_SCRIPTS" \
            "${skill_md_changed_flag[@]}"
