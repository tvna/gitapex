name: Skill audit disclosure gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    # The last three entries exist for the deterministic-gate-quality
    # check (issue #673): .gitapex/ssot.json registers gate implementations
    # under hooks/ and .github/workflows/ as well as .github/scripts/, and
    # the registry file itself determines that scope. None of them matched
    # any pre-existing entry, so without these the job would simply never
    # run for a PR that deleted a PreToolUse hook gate or dropped a gate
    # from the registry.
    #
    # No gate_*.py / scan_*.py entry is added: the .github/scripts/*.py
    # entry already fires for both, verified live rather than assumed --
    # PR #651 touched none of the other four entries, only
    # .github/scripts/gate_plugin_root_brace_notation.py, and this workflow
    # ran and passed on it (check run 91426145937 of run 30721581500).
    paths:
      - "skills/**/SKILL.md"
      - "docs/superpowers/specs/*.md"
      - "skills/*/scripts/*.py"
      - "evals/scripts/*.py"
      - ".github/scripts/*.py"
      - "hooks/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - ".gitapex/ssot.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-audit-disclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Refs #248 (refs #242, #246): battle-testing-a-skill and
      # evaluating-skill-quality both require a model-judgment subagent
      # dispatch, so this gate cannot grade their verdicts in CI -- it
      # only requires that a PR touching skills/*/SKILL.md discloses
      # both audits' outcome (or an explicit waiver) in its body. A pure
      # deletion of a SKILL.md has no new content to audit, so it is
      # excluded here rather than at the workflow `paths` trigger, which
      # cannot distinguish add/modify from delete. A byte-identical rename
      # (git's "R100" status) is excluded the same way -- same rationale,
      # no new content. A three-dot (merge-base) diff is used, not a
      # two-dot direct diff, so a SKILL.md change merged to the base
      # branch after this PR forked is never misattributed to this PR.
      - name: Determine changed SKILL.md, design-doc, checker-script, and gate-script files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! diff_output=$(git diff --name-status "$BASE_SHA...$HEAD_SHA" -- 'skills/*/SKILL.md'); then
            echo "::error::git diff failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          changed=$(printf '%s\n' "$diff_output" | grep -vE '^(D|R100)[[:space:]]' || true)

          # One collector for the two add/modify-only path signals below.
          # Issue #673's review found this block hand-copied a third time;
          # the three copies differed only in a pathspec list, a shape
          # regex, a label, and two variable names, while each repeated the
          # same git-diff error branch, the same D/R100 filter, the same
          # `while IFS=$'\t' read` body, and the same comma-join -- so a
          # bug fixed in one had to be found and fixed in three. The two
          # regexes had already drifted (`+` in one, `*` in another) over
          # an overlapping path set. Results come back in COLLECTED_LINES
          # (the raw filtered diff lines, for the applicability test) and
          # COLLECTED_PATHS (the validated comma-joined list).
          #
          # `D` and `R100` are excluded here because a deleted or
          # byte-identically-renamed SKILL.md or design doc has no new
          # content to audit. That rationale does NOT transfer to a gate,
          # which is why the gate signal below does not use this function.
          #
          # Shape validation before the comma-join is not decoration: a PR
          # author fully controls these filenames, both sinks
          # ($GITHUB_OUTPUT and the gate script's comma-split) are
          # comma-delimited, and a filename carrying a literal comma would
          # otherwise split into two bogus entries downstream.
          collect_paths() {
            local label="$1" shape_re="$2"
            shift 2
            local diff_output filtered joined status path newpath new_path
            if ! diff_output=$(git diff --name-status "$BASE_SHA...$HEAD_SHA" -- "$@"); then
              echo "::error::git diff failed for $label between $BASE_SHA and $HEAD_SHA" >&2
              return 1
            fi
            filtered=$(printf '%s\n' "$diff_output" | grep -vE '^(D|R100)[[:space:]]' || true)
            joined=""
            if [ -n "$filtered" ]; then
              echo "Added/modified $label requiring disclosure:"
              echo "$filtered"
              while IFS=$'\t' read -r status path newpath; do
                [ -z "$status" ] && continue
                case "$status" in
                  R*) new_path="$newpath" ;;
                  *) new_path="$path" ;;
                esac
                if ! printf '%s' "$new_path" | grep -E "$shape_re" >/dev/null; then
                  echo "::error::unsupported $label filename for signal computation: $new_path" >&2
                  return 1
                fi
                joined="${joined}${joined:+,}${new_path}"
              done <<< "$filtered"
            fi
            COLLECTED_LINES="$filtered"
            COLLECTED_PATHS="$joined"
          }

          # Issue #517 (refs #277): design docs. Deliberately no `:(glob)`
          # on this pathspec, unlike the checker-script one below: without
          # it a nested docs/superpowers/specs/<dir>/<file>.md is selected
          # and then hard-fails the single-level shape regex, which is the
          # loud, fail-closed outcome wanted for a path shape nobody has
          # decided about yet. Adding `:(glob)` here would silently drop it
          # from scope instead -- a fail-open, not a cleanup.
          collect_paths "design doc" '^docs/superpowers/specs/[A-Za-z0-9._-]+\.md$' \
            'docs/superpowers/specs/*.md'
          changed_design_doc_lines="$COLLECTED_LINES"
          changed_design_docs="$COLLECTED_PATHS"

          # Issue #565 (refs #560 repair 5): deterministic checker scripts.
          # Every pathspec carries `:(glob)` so `*` does not cross `/` --
          # git's *default* pathspec matching does (verified live:
          # 'skills/*/scripts/*.py' with no `:(glob)` matches a nested
          # 'skills/foo/scripts/sub/bar.py' too), the opposite of this
          # workflow's own top-level `paths:` trigger, whose `*` never
          # crosses `/` per GitHub Actions' path-filter syntax. Here the
          # `:(glob)` is wanted, unlike the design-doc case above: nested
          # checker-script subdirectories are an out-of-scope-by-design
          # boundary matching every skill's flat scripts/ layout, so a
          # stray nested path pulled in by a PR that also touched something
          # else must not hard-fail this required check -- reproduced
          # directly against a scratch repo before `:(glob)` was added.
          collect_paths "checker script" \
            '^(skills/[A-Za-z0-9_-]+/scripts/[A-Za-z0-9._-]+\.py|evals/scripts/[A-Za-z0-9._-]+\.py|\.github/scripts/[A-Za-z0-9._-]+\.py)$' \
            ':(glob)skills/*/scripts/*.py' ':(glob)evals/scripts/*.py' ':(glob).github/scripts/*.py'
          changed_checker_script_lines="$COLLECTED_LINES"
          changed_checker_scripts="$COLLECTED_PATHS"

          # Issue #673 (refs #665 repair 1): this repository's own
          # deterministic gates. Not a fourth `collect_paths` call, because
          # this signal differs on both of that function's fixed rules.
          #
          # Membership is not a path glob. A gate is anything matching the
          # .github/scripts/gate_*.py / scan_*.py naming convention, OR
          # registered in .gitapex/ssot.json's gates[].script, OR that
          # registry file itself. The glob-only first version under-covered
          # badly: 16 of the 35 registered gate paths did not match it,
          # including hooks/ PreToolUse deny logic and
          # skill_security_relevance.py, the script deciding whether this
          # very workflow's adversarial-coverage-mapping check fires.
          # detect_changed_gate_scripts.py owns that rule; see its docstring.
          #
          # Deletions and renames are in scope. `collect_paths` filters
          # them out, which is right for a SKILL.md and wrong for a gate:
          # verified live, a PR whose only change was `git rm` of a gate
          # script made this whole job report applicable=false and exit 0 --
          # a green required check for deleting a gate.
          #
          # The diff is unscoped because membership spans .github/scripts/,
          # hooks/, .github/workflows/, and .gitapex/ssot.json; the helper
          # filters, and doing it there keeps one rule in one place rather
          # than a pathspec list here that must stay in sync with a registry.
          if ! gate_diff_output=$(git diff --name-status "$BASE_SHA...$HEAD_SHA"); then
            echo "::error::git diff failed for gate detection between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          # Three of the registered gates are workflow YAML, so Dependabot's
          # weekly github-actions update (.github/dependabot.yml) touches
          # them -- and a bot cannot add a disclosure to its own PR body.
          # The detector exempts a workflow file whose entire change is
          # `uses:` pin bumps; this supplies the content it needs to tell
          # a pin bump from a gate-logic change. Content-based, not
          # author-based: a human pin bump is treated identically, and any
          # non-pin line in the same file keeps it in scope.
          workflow_diff_file=$(mktemp)
          if ! git diff --unified=0 "$BASE_SHA...$HEAD_SHA" \
              -- ':(glob).github/workflows/*.yml' ':(glob).github/workflows/*.yaml' \
              > "$workflow_diff_file"; then
            echo "::error::git diff failed for workflow pin detection between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          if ! changed_gate_scripts=$(printf '%s\n' "$gate_diff_output" \
              | python3 .github/scripts/detect_changed_gate_scripts.py \
                  --unified-diff "$workflow_diff_file"); then
            echo "::error::gate-path detection failed; refusing to report this check green on a scope that could not be computed" >&2
            exit 1
          fi

          # $changed_gate_scripts is tested here as an independent term,
          # not folded into the checker-script one it overlaps with today:
          # narrowing the checker-script globs later must never silently
          # disable the gate check by making the job skip entirely
          # (dimensions.md dimensions 3 and 15). It is also the only term
          # here that can be non-empty for a pure deletion.
          if [ -z "$changed" ] && [ -z "$changed_design_doc_lines" ] \
             && [ -z "$changed_checker_script_lines" ] && [ -z "$changed_gate_scripts" ]; then
            echo "No added/modified skills/*/SKILL.md, docs/superpowers/specs/*.md, or deterministic checker script, and no changed deterministic gate, in this diff; skipping disclosure check."
            {
              echo "applicable=false"
              echo "description-changed-skills="
              echo "needs-eval-coverage-skills="
              echo "security-relevant-skills="
              echo "changed-design-docs="
              echo "changed-checker-scripts="
              echo "changed-gate-scripts="
              echo "skill-md-changed=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Issue #427 (refs #422): for each changed SKILL.md whose own
          # frontmatter `description:` field's parsed value changed, compute
          # (a) whether this PR's diff also touches that skill's
          # evals/<skill>/tasks/ or evals/<skill>/eval-status.md, and hand
          # both skill-name lists to the gate script -- git access stays in
          # this workflow step, the script only grades PR-body text against
          # these workflow-supplied facts. (Issue #499: eval-status.md moved
          # from the single central docs/skill-eval-status.md to one file
          # per skill under evals/<skill>/, so this check now requires the
          # actual skill's own file rather than accepting a touch anywhere
          # in one shared central doc.)
          #
          # description-changed detection delegates to skill_description_diff.py
          # (git show + parsed-value comparison) rather than a `git diff -U0 |
          # grep` line match: two PR #428 review findings showed the line-match
          # approach misses a YAML block-scalar description whose edit is
          # confined to continuation lines
          # (https://github.com/tvna/gitapex/pull/428#discussion_r3654041059),
          # and false-positives on a byte-identical rename under a
          # single-pathspec diff
          # (https://github.com/tvna/gitapex/pull/428#discussion_r3654041064).
          # Comparing against the merge-base (not $BASE_SHA's own tip) keeps
          # this consistent with the three-dot diff above: a description
          # change merged to the base branch after this PR forked must not be
          # misattributed to this PR either.
          description_changed_skills=""
          needs_eval_coverage_skills=""
          security_relevant_skills=""
          if [ -n "$changed" ]; then
            echo "Added/modified SKILL.md files requiring disclosure:"
            echo "$changed"

            merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            all_changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            while IFS=$'\t' read -r status path newpath; do
              [ -z "$status" ] && continue
              case "$status" in
                R*) old_path="$path"; new_path="$newpath" ;;
                *) old_path="$path"; new_path="$path" ;;
              esac
              skill=$(printf '%s\n' "$new_path" | sed -E 's#^skills/([^/]+)/SKILL\.md$#\1#')
              # Skill names get written to $GITHUB_OUTPUT and interpolated into
              # a grep -E pattern below; a PR author fully controls this
              # directory name in their own diff, so validate it first rather
              # than trusting an arbitrary string into either sink.
              if ! printf '%s' "$skill" | grep -E '^[A-Za-z0-9_-]+$' >/dev/null; then
                echo "::error::unsupported skill directory name for signal computation: $new_path" >&2
                exit 1
              fi

              # Issue #517 (refs #454): heuristic security-relevance,
              # computed only from the SKILL.md's frontmatter block (name +
              # description + any other frontmatter fields), not its full
              # procedure body -- this meta-repo's own prose mentions "gate"
              # constantly outside frontmatter, which would otherwise
              # over-match almost every skill. Delegated to
              # skill_security_relevance.py rather than a bash sed/grep
              # one-liner: a sed range address re-arms itself on any later
              # '---' line in the body (e.g. a markdown horizontal rule),
              # leaking body prose into the scan -- this script's bounded,
              # tested extraction avoids that (see its own docstring).
              security_result=$(git show "$HEAD_SHA:$new_path" | python3 .github/scripts/skill_security_relevance.py)
              if [ "$security_result" = "relevant" ]; then
                security_relevant_skills="${security_relevant_skills}${security_relevant_skills:+,}${skill}"
              fi

              # `grep -q` closes its stdin as soon as it finds a match, which
              # can SIGPIPE a still-writing upstream process; combined with
              # `pipefail` (set above) that turns a real match into a false
              # "not found" whenever the upstream process's own nonzero SIGPIPE
              # exit status outranks grep's own zero exit in the pipeline's
              # reported status
              # (https://github.com/tvna/gitapex/pull/428#discussion_r3654041066).
              # Every grep below drops `-q` and redirects to /dev/null instead,
              # so it always reads its input to completion.
              description_result=$(python3 .github/scripts/skill_description_diff.py \
                --base-rev "$merge_base" --head-rev "$HEAD_SHA" \
                --base-path "$old_path" --head-path "$new_path")
              if [ "$description_result" = "changed" ]; then
                description_changed_skills="${description_changed_skills}${description_changed_skills:+,}${skill}"
                if ! printf '%s\n' "$all_changed" | grep -E "^evals/${skill}/tasks/" >/dev/null \
                   && ! printf '%s\n' "$all_changed" | grep -xF "evals/${skill}/eval-status.md" >/dev/null; then
                  needs_eval_coverage_skills="${needs_eval_coverage_skills}${needs_eval_coverage_skills:+,}${skill}"
                fi
              fi
            done <<< "$changed"
          fi
          skill_md_changed=false
          if [ -n "$changed" ]; then
            skill_md_changed=true
          fi
          {
            echo "applicable=true"
            echo "description-changed-skills=${description_changed_skills}"
            echo "needs-eval-coverage-skills=${needs_eval_coverage_skills}"
            echo "security-relevant-skills=${security_relevant_skills}"
            echo "changed-design-docs=${changed_design_docs}"
            echo "changed-checker-scripts=${changed_checker_scripts}"
            echo "changed-gate-scripts=${changed_gate_scripts}"
            echo "skill-md-changed=${skill_md_changed}"
          } >> "$GITHUB_OUTPUT"

      # PR_BODY carries untrusted external text (anyone with PR-author
      # access controls it) -- passed via env, never interpolated
      # directly into this step's shell script, to avoid GitHub Actions
      # expression/script injection.
      - name: Check skill audit disclosure
        if: steps.diff.outputs.applicable == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          DESCRIPTION_CHANGED_SKILLS: ${{ steps.diff.outputs.description-changed-skills }}
          NEEDS_EVAL_COVERAGE_SKILLS: ${{ steps.diff.outputs.needs-eval-coverage-skills }}
          SECURITY_RELEVANT_SKILLS: ${{ steps.diff.outputs.security-relevant-skills }}
          CHANGED_DESIGN_DOCS: ${{ steps.diff.outputs.changed-design-docs }}
          CHANGED_CHECKER_SCRIPTS: ${{ steps.diff.outputs.changed-checker-scripts }}
          CHANGED_GATE_SCRIPTS: ${{ steps.diff.outputs.changed-gate-scripts }}
          SKILL_MD_CHANGED: ${{ steps.diff.outputs.skill-md-changed }}
        run: |
          set -euo pipefail
          skill_md_changed_flag=()
          if [ "$SKILL_MD_CHANGED" = "true" ]; then
            skill_md_changed_flag=(--skill-md-changed)
          fi
          printf '%s' "$PR_BODY" | python3 .github/scripts/gate_skill_audit_disclosure.py \
            --description-changed-skills "$DESCRIPTION_CHANGED_SKILLS" \
            --needs-eval-coverage-skills "$NEEDS_EVAL_COVERAGE_SKILLS" \
            --security-relevant-skills "$SECURITY_RELEVANT_SKILLS" \
            --changed-design-docs "$CHANGED_DESIGN_DOCS" \
            --changed-checker-scripts "$CHANGED_CHECKER_SCRIPTS" \
            --changed-gate-scripts "$CHANGED_GATE_SCRIPTS" \
            "${skill_md_changed_flag[@]}"
