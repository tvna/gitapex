# Issue #1556. A regex literal newly added by a PR diff to any `*.py` file
# must not carry a statically-detectable catastrophic-backtracking
# (CWE-1333/ReDoS) shape -- see .github/scripts/gitapex_gate_regex_
# catastrophic_backtracking.py's own module docstring for the two detected
# shapes, the motivating defect (a live-reproduced catastrophic-
# backtracking regex in gitapex_gate_bare_python3_invocation.py, exercised
# against untrusted PR content in a required CI job with no path filter),
# and the disclosed known misses.
#
# Deliberately no `paths:` filter -- drift gate:
# tests/test_gitapex_gate_regex_catastrophic_backtracking.py's own
# test_the_workflow_has_no_paths_filter. See that test's docstring for why
# (GitHub's own skipped-vs-never-ran distinction for a required check).
name: Regex catastrophic-backtracking gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regex-catastrophic-backtracking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # `ref:`/`fetch-depth: '0'` below is this gate's own diff-post-image
      # checkout pin -- drift gate: tests/test_gitapex_gate_regex_catastrophic_backtracking.py's
      # own test_the_workflow_checks_out_the_head_sha_with_full_history.
      # This gate correlates diff-derived line numbers with tree content
      # (it re-reads each in-scope file to resolve the pattern argument's
      # own literal string value), the same requirement
      # detection-logic-property-coverage-gate.yml states for itself.
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # git merge-base below -- drift gate:
      # tests/test_gitapex_gate_regex_catastrophic_backtracking.py's own
      # test_the_workflow_uses_merge_base_not_base_sha.
      #
      # The two `git diff` flags below (--no-renames, -c
      # core.quotePath=false) -- drift gate:
      # tests/test_gitapex_gate_regex_catastrophic_backtracking.py's own
      # test_the_workflow_passes_the_two_flags_the_gate_depends_on.
      #
      # Issue #1035: every `.github/scripts/*.py` invocation goes through
      # `uv run` regardless of whether the script needs a third-party
      # dependency. This gate carries a real `pydantic` import (its own
      # --root validation), so `uv run` is load-bearing here too.
      - name: Grade the regex literals this diff adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
            echo "::error::git merge-base failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          git -c core.quotePath=false diff -U0 --no-renames "$merge_base" "$HEAD_SHA" -- '*.py' \
            | uv run --frozen python3 .github/scripts/gitapex_gate_regex_catastrophic_backtracking.py
