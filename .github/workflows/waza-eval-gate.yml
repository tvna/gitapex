# Issue #582: execute each touched skill's committed evals/<skill>/ suite as
# a real (not merely advisory) gate on push/PR, without disturbing
# waza-eval-matrix.yml -- that workflow is issue #124's cross-model matrix
# scope (workflow_dispatch-only, model-override, advisory) and is
# deliberately left unmodified here.
#
# Deliberately no top-level `paths:` filter on the `pull_request:` trigger
# below, even though this job only ever has work to do when evals/** (or a
# skill's own suite) changed. GitHub's documented required-status-check
# semantics distinguish a job-level `if:` skip (reports `skipped`, which does
# not block a required check) from a workflow that never fires at all for a
# given PR (leaves any required check on it `Pending` forever). A `paths:`
# trigger filter is the latter case: once this job is later promoted to a
# required status check in branch protection (out of scope for this PR --
# see issue #124 for the credential-provisioning prerequisite), any PR that
# does not happen to touch a matched path would never get a run at all, and
# would be permanently blocked from merging by a check that can never turn
# green. Running unconditionally and reporting `has-changes=false` (no-op,
# not skipped) is the required-check-safe way to stay decoupled from that
# failure mode from day one.
name: Waza eval gate

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # waza is provisioned from this repo's flake (SSoT), never re-installed
      # by hand -- same rule waza-check.yml and waza-eval-matrix.yml follow.
      # See flake.nix + #57.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22
        with:
          extra-conf: "experimental-features = nix-command flakes"

      # For a pull_request event, diff against the merge-base of
      # BASE_SHA/HEAD_SHA (a three-dot diff), matching skill-audit-gate.yml's
      # own rationale: a change merged to the base branch after this PR
      # forked must never be misattributed to this PR. For workflow_dispatch
      # there is no PR base/head to diff against at all, so every committed
      # evals/*/eval.yaml suite is treated as touched -- a manual dispatch
      # always has something to run rather than silently no-op'ing. Either
      # way, the actual skill-name extraction is delegated to
      # detect_touched_eval_skills.py (unit-tested in
      # tests/test_detect_touched_eval_skills.py) rather than re-derived
      # inline here -- this step only ever produces a flat path list.
      - name: Determine touched skills
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! diff_output=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
              echo "::error::git diff failed between $BASE_SHA and $HEAD_SHA" >&2
              exit 1
            fi
            changed_paths="$diff_output"
          else
            # workflow_dispatch: no PR base/head SHA exists to diff against.
            # Enumerate every committed suite by its eval.yaml (the same
            # enumeration waza-eval-matrix.yml already uses, which excludes
            # non-suite directories such as evals/scripts/ since they have
            # no eval.yaml of their own).
            changed_paths=""
            for suite in evals/*/eval.yaml; do
              [ -f "$suite" ] || continue
              changed_paths="${changed_paths}${suite}"$'\n'
            done
          fi

          if ! skills=$(printf '%s\n' "$changed_paths" | python3 .github/scripts/detect_touched_eval_skills.py); then
            echo "::error::detect_touched_eval_skills.py rejected a touched path (see the error above)" >&2
            exit 1
          fi
          echo "Touched skills: ${skills:-(none)}"

          has_changes=false
          if [ -n "$skills" ]; then
            has_changes=true
          fi

          {
            echo "skills=${skills}"
            echo "has-changes=${has_changes}"
          } >> "$GITHUB_OUTPUT"

      # Fail loudly if the credentials the copilot-sdk executor needs are not
      # configured, before any run is attempted, but only when there is
      # actually at least one touched skill to run -- a PR that touches
      # nothing under evals/ must not be blocked on a secret it will never
      # need. Presence is checked; values are never printed (CLAUDE.md
      # section 4 -- secrets must not reach a log). This job is not yet a
      # required status check (see issue #582 and #124 for the sequencing).
      - name: Preflight -- require executor endpoint secrets
        if: steps.diff.outputs.has-changes == 'true'
        env:
          COPILOT_BASE_URL: ${{ secrets.COPILOT_BASE_URL }}
          COPILOT_PROVIDER_BASE_URL: ${{ secrets.COPILOT_PROVIDER_BASE_URL }}
        run: |
          if [ -z "$COPILOT_BASE_URL" ] && [ -z "$COPILOT_PROVIDER_BASE_URL" ]; then
            echo "::error::No copilot-sdk endpoint configured. Set repository" \
              "secret COPILOT_BASE_URL (and/or COPILOT_PROVIDER_BASE_URL) under" \
              "Settings -> Secrets and variables -> Actions before this check" \
              "can run for real. See issue #124 for the issuance path (this" \
              "job is not yet a required status check -- see issue #582)."
            exit 1
          fi

      # Run each touched skill's suite at its own committed default model --
      # unlike waza-eval-matrix.yml, there is deliberately no
      # set_config_model.py override here, since this gate answers "does the
      # skill behave correctly" (its own pinned default), not "how does it
      # behave across models" (that matrix's own separate question). Mirrors
      # waza-eval-matrix.yml's per-suite loop/summary-table style otherwise.
      - name: Run touched skills' evals suites
        if: steps.diff.outputs.has-changes == 'true'
        env:
          COPILOT_BASE_URL: ${{ secrets.COPILOT_BASE_URL }}
          COPILOT_PROVIDER_BASE_URL: ${{ secrets.COPILOT_PROVIDER_BASE_URL }}
          SKILLS: ${{ steps.diff.outputs.skills }}
        run: |
          set -u
          mkdir -p results
          failed=0
          {
            echo "## Waza eval gate"
            echo ""
            echo "| skill | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          IFS=',' read -r -a skills_array <<< "$SKILLS"
          for skill in "${skills_array[@]}"; do
            [ -n "$skill" ] || continue
            if nix run .#waza -- run "$skill" -o "results/${skill}.json"; then
              echo "| ${skill} | pass |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${skill} | FAIL |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"
