# Issue #582: execute each touched skill's committed evals/<skill>/ suite as
# a real (not merely advisory) gate on pull_request, without disturbing
# waza-eval-matrix.yml -- that workflow is issue #124's cross-model matrix
# scope (workflow_dispatch-only, model-override, advisory) and is
# deliberately left unmodified here.
#
# Deliberately no top-level `paths:` filter on the `pull_request:` trigger
# below, even though this job only ever has work to do when evals/** (or a
# skill's own suite) changed. GitHub's documented required-status-check
# semantics distinguish a job-level `if:` skip (reports `skipped`, which does
# not block a required check) from a workflow that never fires at all for a
# given PR (leaves any required check on it `Pending` forever). A `paths:`
# trigger filter is the latter case: once this job is later promoted to a
# required status check in branch protection (out of scope for this PR --
# see issue #124 for the credential-provisioning prerequisite), any PR that
# does not happen to touch a matched path would never get a run at all, and
# would be permanently blocked from merging by a check that can never turn
# green. Running unconditionally and reporting `has-changes=false` (no-op,
# not skipped) is the required-check-safe way to stay decoupled from that
# failure mode from day one.
name: Waza eval gate

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # For a pull_request event, diff against the merge-base of
      # BASE_SHA/HEAD_SHA (a three-dot diff), matching skill-audit-gate.yml's
      # own rationale: a change merged to the base branch after this PR
      # forked must never be misattributed to this PR. For workflow_dispatch
      # there is no PR base/head to diff against at all, so every committed
      # evals/*/eval.yaml suite is treated as touched -- a manual dispatch
      # always has something to run rather than silently no-op'ing. Either
      # way, the actual skill-name extraction is delegated to
      # gitapex_detect_touched_eval_skills.py (unit-tested in
      # tests/test_gitapex_detect_touched_eval_skills.py) rather than re-derived
      # inline here -- this step only ever produces a flat path list.
      #
      # `--name-status` (not `--name-only`) plus `-z`: a PR that deletes an
      # entire evals/<skill>/ directory must not have those paths reported
      # as touched -- the run step would then try to run
      # evals/scripts/gitapex_run_eval_suite.py against an evals/<skill>/
      # eval.yaml that no longer exists on HEAD, failing a legitimate
      # deletion PR. So `D` (deleted) and `R100` (pure
      # rename, no content change) status records are dropped, mirroring
      # skill-audit-gate.yml's own established `grep -vE '^(D|R100)[[:space:]]'`
      # convention -- adapted here to `--name-status -z`'s NUL-separated (not
      # tab/newline-separated) fields: a rename/copy ("R"/"C"-prefixed)
      # status record carries TWO path fields (old, new), every other status
      # exactly ONE, so the flat field list below is walked with an explicit
      # index rather than assumed to be a fixed width or line-delimited (there
      # are no line boundaries at all in `-z` output). `-z` is also what
      # disables git's core.quotepath C-style quoting of a non-ASCII/special
      # -byte path (see gitapex_detect_touched_eval_skills.py's own docstring for why
      # that quoting would otherwise silently defeat detection).
      #
      # The raw `-z` bytes are captured to a temp file, never a plain bash
      # scalar variable (`x=$(...)`) -- confirmed empirically that bash
      # silently drops embedded NUL bytes on scalar capture (`x=$(printf
      # 'a\0b')` yields `x="ab"`), which would glue two touched paths
      # together. `mapfile -d ''` reads NUL-delimited fields from that file
      # straight into a bash array (arrays hold multiple NUL-free elements
      # fine; a scalar variable is what cannot hold an embedded NUL). The
      # filtered, currently-live paths are collected into a second array and
      # handed to gitapex_detect_touched_eval_skills.py's `--nul` mode via `printf
      # '%s\0' "${arr[@]}"` -- kept NUL-delimited all the way into Python
      # rather than converted to newline via `tr` first, since `tr '\0' '\n'`
      # cannot tell its own inserted separator apart from a literal newline
      # byte inside a real path, silently mis-splitting that one path into
      # two (see gitapex_detect_touched_eval_skills.py's docstring for the full
      # rationale and tests/test_gitapex_detect_touched_eval_skills.py for the
      # reproduced defeat case).
      - name: Determine touched skills
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          touched_paths_arr=()

          if [ "$EVENT_NAME" = "pull_request" ]; then
            diff_file="$(mktemp)"
            if ! git diff --name-status -z "$BASE_SHA...$HEAD_SHA" > "$diff_file"; then
              rm -f "$diff_file"
              echo "::error::git diff failed between $BASE_SHA and $HEAD_SHA" >&2
              exit 1
            fi
            mapfile -d '' -t diff_fields < "$diff_file"
            rm -f "$diff_file"

            i=0
            n=${#diff_fields[@]}
            while [ "$i" -lt "$n" ]; do
              status="${diff_fields[$i]}"
              case "$status" in
                R*|C*)
                  # Rename/copy record: [status, old-path, new-path].
                  path="${diff_fields[$((i + 2))]}"
                  i=$((i + 3))
                  ;;
                *)
                  # Every other status: [status, path].
                  path="${diff_fields[$((i + 1))]}"
                  i=$((i + 2))
                  ;;
              esac
              case "$status" in
                D|R100) ;; # deleted, or pure rename with no content change
                *) touched_paths_arr+=("$path") ;;
              esac
            done
          else
            # workflow_dispatch: no PR base/head SHA exists to diff against.
            # Enumerate every committed suite by its eval.yaml (the same
            # enumeration waza-eval-matrix.yml already uses, which excludes
            # non-suite directories such as evals/scripts/ since they have
            # no eval.yaml of their own).
            for suite in evals/*/eval.yaml; do
              [ -f "$suite" ] || continue
              touched_paths_arr+=("$suite")
            done
          fi

          if ! skills=$(printf '%s\0' "${touched_paths_arr[@]}" | uv run --frozen python3 .github/scripts/gitapex_detect_touched_eval_skills.py --nul); then
            echo "::error::gitapex_detect_touched_eval_skills.py rejected a touched path (see the error above)" >&2
            exit 1
          fi
          echo "Touched skills: ${skills:-(none)}"

          has_changes=false
          if [ -n "$skills" ]; then
            has_changes=true
          fi

          {
            echo "skills=${skills}"
            echo "has-changes=${has_changes}"
          } >> "$GITHUB_OUTPUT"

      # Issue #1134: this gate no longer needs waza/Nix at all -- the run
      # step below now calls evals/scripts/gitapex_run_eval_suite.py (#1132/
      # #1157), a repository-owned runner that never shells out to the waza
      # binary. `uv` (already installed above) is the only toolchain this
      # job needs.

      # Fail loudly if the credential the new runner's model-CLI subprocess
      # needs is not configured, before any run is attempted, but only when
      # there is actually at least one touched skill to run -- a PR that
      # touches nothing under evals/ must not be blocked on a secret it will
      # never need. Presence is checked; the value is never printed
      # (CLAUDE.md section 4 -- secrets must not reach a log).
      #
      # ANTHROPIC_API_KEY, not COPILOT_BASE_URL/COPILOT_PROVIDER_BASE_URL
      # (issue #1134, replacing this gate's former shared preflight,
      # gitapex_check_copilot_endpoint_configured.py): the new runner
      # executes exclusively through evals/scripts/gitapex_run_ablation.py's
      # `claude` CLI subprocess, whose own hermetic env allowlist
      # (`_HERMETIC_ENV_ALLOWLIST`) passes through only PATH/HOME/
      # ANTHROPIC_API_KEY/TMPDIR/TMP/TEMP -- verified by reading that
      # module's source, not assumed. The old copilot-sdk endpoint pair is
      # not read anywhere on this path and would preflight the wrong thing.
      # This job is not yet a required status check (see issue #582 and
      # #124 for the sequencing).
      #
      # Known, accepted limitation (not a bug), carried over from the old
      # preflight: this workflow triggers on `pull_request`, and GitHub
      # never exposes repository secrets to a `pull_request`-triggered run
      # for a fork-originated PR (its own documented, non-configurable
      # security default). So this step's error will fire for every fork PR
      # that touches evals/, even when ANTHROPIC_API_KEY is genuinely
      # configured as a repo secret. `pull_request_target` is deliberately
      # NOT used here for the same reason the old preflight rejected it: it
      # would run with the base repo's secrets and write-scoped token
      # against the fork's untrusted code, a real security regression, and
      # this repo currently has no evidence of accepting external fork
      # contributions to weigh against that risk.
      - name: Preflight -- require ANTHROPIC_API_KEY
        if: steps.diff.outputs.has-changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No ANTHROPIC_API_KEY configured. Set repository" \
              "secret ANTHROPIC_API_KEY under Settings -> Secrets and" \
              "variables -> Actions before dispatching --" \
              "evals/scripts/gitapex_run_eval_suite.py invokes the claude CLI" \
              "directly and needs this for authentication. Never printed" \
              "here; only checked for presence."
            exit 1
          fi

      # evals/scripts/gitapex_run_ablation.build_command shells out to the
      # `claude` CLI directly (`argv = [model_cli, "-p", prompt, ...]`,
      # DEFAULT_MODEL_CLI = "claude") -- unlike waza, this binary is not
      # provisioned by this repo's own Nix flake, and it is not preinstalled
      # on GitHub's ubuntu-latest image (confirmed against
      # actions/runner-images' own published software manifest; the only
      # other workflow in this repo that runs Claude in CI,
      # ranking-the-open-queue-weekly.yml, does it through
      # anthropics/claude-code-action, a wrapped whole-session action with no
      # bare CLI left on PATH for a later step to shell out to -- not usable
      # here). Installed via npm (Node.js already ships on ubuntu-latest, per
      # the same manifest), pinned to a specific released version rather than
      # `@latest`, matching this repo's own pin-everything convention for CI
      # tooling. No Dependabot ecosystem tracks a bare npm install line
      # inside a workflow `run:` step, so this pin needs a deliberate,
      # manual bump over time, not a silent drift.
      - name: Install Claude Code CLI
        if: steps.diff.outputs.has-changes == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.240

      # Run each touched skill's suite at its own committed default model --
      # unlike waza-eval-matrix.yml, there is deliberately no
      # gitapex_set_config_model.py override here, since this gate answers "does the
      # skill behave correctly" (its own pinned default), not "how does it
      # behave across models" (that matrix's own separate question). Mirrors
      # waza-eval-matrix.yml's per-suite loop/summary-table style otherwise.
      #
      # evals/scripts/gitapex_run_eval_suite.py (issue #1132/#1157), not
      # `nix run .#waza -- run` (issue #1134): every committed suite lives at
      # `evals/<skill>/eval.yaml` with its skill's SKILL.md at
      # `skills/<skill>/SKILL.md`, the same mapping `skill` (the touched
      # skill's directory basename) already names. `uv run --frozen`, not a
      # bare `python3` invocation, since this script reaches PyYAML through
      # gitapex_run_ablation.py (see that script's own module docstring).
      #
      # An adversarial review of this PR (issue #1134) caught a real defect
      # in an earlier revision of this step: gitapex_run_eval_suite.py's own
      # `main()` returns 0 whenever run_eval_suite() completes without an
      # exception, regardless of the computed `mean_score` -- it only
      # returns non-zero on malformed input or an execution failure
      # (crash/timeout), never on a suite that simply scored low. Trusting
      # that exit code alone (as an earlier revision did) would report
      # "pass" for a skill that scored 0.0 on every fixture, as long as the
      # `claude` CLI subprocess itself did not crash -- silently defeating
      # the whole point of a gate. Every committed `eval.yaml` declares
      # exactly one `metrics[]` entry with its own `threshold` (verified
      # against all 26 committed suites), so this step now separately reads
      # the run's own written `mean_score` and that threshold, and only
      # reports "pass" when the score actually clears it.
      - name: Run touched skills' evals suites
        if: steps.diff.outputs.has-changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILLS: ${{ steps.diff.outputs.skills }}
        run: |
          set -u
          mkdir -p results
          failed=0
          {
            echo "## Waza eval gate"
            echo ""
            echo "| skill | result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          IFS=',' read -r -a skills_array <<< "$SKILLS"
          for skill in "${skills_array[@]}"; do
            [ -n "$skill" ] || continue
            eval_yaml="evals/${skill}/eval.yaml"
            out="results/${skill}.json"
            if ! uv run --frozen python3 evals/scripts/gitapex_run_eval_suite.py \
                 --eval-yaml "$eval_yaml" \
                 --skill-md "skills/${skill}/SKILL.md" \
                 -o "$out"; then
              echo "| ${skill} | FAIL (execution error) |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            if uv run --frozen python3 -c "import json, sys, yaml; result = json.load(open(sys.argv[1], encoding='utf-8')); suite = yaml.safe_load(open(sys.argv[2], encoding='utf-8')); threshold = suite['metrics'][0]['threshold']; mean_score = result['mean_score']; print(f'mean_score={mean_score!r} threshold={threshold!r}', file=sys.stderr); sys.exit(0 if mean_score >= threshold else 1)" "$out" "$eval_yaml"; then
              echo "| ${skill} | pass |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${skill} | FAIL (below threshold) |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"
