name: Waza skill check

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  pull_request:
    paths:
      - "skills/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  waza-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.5"

      - name: Install waza
        run: go install github.com/microsoft/waza/cmd/waza@6157165282fcd4e39b4335d4aee502610b58cead  # v0.38.0

      # waza check has no flag to fail on a non-compliant skill -- verified
      # empirically that it exits 0 regardless of readiness, across every
      # skill in this repo. It is a report, not a gate; `continue-on-error`
      # makes that explicit so a future waza release that adds real gating
      # semantics can't silently start blocking merges unannounced. A real
      # CI gate would need `waza gate` (baseline comparison over `waza run`
      # eval results), which needs an eval.yaml per skill and is out of
      # scope here -- see docs/superpowers/specs/2026-07-12-skill-distribution-foundation-design.md
      # Non-goals.
      - name: Run waza check (advisory report, not a merge gate)
        continue-on-error: true
        run: |
          {
            echo '```'
            waza check --no-update-check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
