name: Waza skill check

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  pull_request:
    paths:
      - "skills/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  waza-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # waza is provisioned from this repo's flake (pinned to 0.38.0 there),
      # not `go install` -- the flake is the single version source of truth
      # and waza's `go install` path is unsupported upstream (LFS artifacts).
      # This removes Go from CI. See flake.nix + #57.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22
        with:
          extra-conf: "experimental-features = nix-command flakes"

      # waza check has no flag to fail on a non-compliant skill -- verified
      # empirically that it exits 0 regardless of readiness, across every
      # skill in this repo. It is a report, not a gate; `continue-on-error`
      # makes that explicit so a future waza release that adds real gating
      # semantics can't silently start blocking merges unannounced. A real
      # CI gate would need `waza gate` (baseline comparison over `waza run`
      # eval results), which needs an eval.yaml per skill and is out of
      # scope here -- see docs/superpowers/specs/2026-07-12-skill-distribution-foundation-design.md
      # Non-goals.
      - name: Run waza check (advisory report, not a merge gate)
        continue-on-error: true
        run: |
          {
            echo '```'
            nix run .#waza -- check --no-update-check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
