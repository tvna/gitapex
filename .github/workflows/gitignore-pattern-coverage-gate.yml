name: Gitignore pattern coverage gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitignore-pattern-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # git merge-base below -- drift gate:
      # tests/test_gitapex_gate_gitignore_pattern_coverage.py's own
      # test_the_workflow_uses_merge_base_not_base_sha.
      - name: Determine added .gitignore patterns
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
            echo "::error::git merge-base failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          added_file="$RUNNER_TEMP/added_gitignore_lines.txt"
          git diff "$merge_base" "$HEAD_SHA" -- .gitignore \
            | grep -E '^\+' | grep -vE '^\+\+\+' | sed -E 's/^\+//' > "$added_file" || true
          echo "added_file=$added_file" >> "$GITHUB_OUTPUT"
          if [ -s "$added_file" ]; then
            echo ".gitignore lines added in this diff (candidates):"
            cat "$added_file"
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "No lines added to .gitignore in this diff; skipping."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check added patterns have test coverage
        if: steps.diff.outputs.applicable == 'true'
        run: |
          set -euo pipefail
          uv run --frozen python3 .github/scripts/gitapex_gate_gitignore_pattern_coverage.py --added "${{ steps.diff.outputs.added_file }}"
