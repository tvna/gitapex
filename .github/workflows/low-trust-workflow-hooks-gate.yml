name: Low-trust workflow/hooks review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - ".github/workflows/**"
      - "hooks/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  low-trust-workflow-hooks-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # Pinned to the PR's base SHA, not the default PR-merge ref: this
      # gate's whole purpose is grading a low-trust author's edit to
      # .github/workflows/**, so checking out (and running) that same
      # author's version of this gate's own script would let the PR
      # neuter its own grader. The script needs no repository content --
      # both inputs below come from the event payload -- so pinning costs
      # nothing.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      # labeled/unlabeled is in `types:` above so applying the
      # workflow-hooks-reviewed label re-runs this check on the same PR
      # without needing a new push.
      #
      # paths: below intentionally matches only the two categories issue
      # #136 scoped this gate to (.github/workflows/**, hooks/**), not
      # every path check 4 in screening-a-low-trust-contribution/SKILL.md
      # also names (.github/scripts/**, skills/*/scripts/**) -- extending
      # coverage to those is tracked as follow-up work, not done here.
      # The paths: filter also means this check cannot yet be promoted to
      # a required status check (it never reports on a non-matching PR);
      # that would need the diff-computed-in-job pattern
      # gitignore-pattern-coverage-gate.yml already uses, also left as
      # follow-up.
      - name: Check author association and review label
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          python3 .github/scripts/gitapex_gate_low_trust_workflow_hooks.py \
            --author-association "$AUTHOR_ASSOCIATION" --labels "$LABELS"
