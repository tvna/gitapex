name: Low-trust workflow/hooks review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - ".github/workflows/**"
      - "hooks/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  low-trust-workflow-hooks-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # Deliberately NOT pinned to the PR's base SHA: this gate's own
      # script is new on every branch that introduces or changes it, so
      # a base-SHA checkout would not find the script until after the
      # introducing PR merges (verified while fixing this workflow --
      # the pin briefly landed here and made this gate fail
      # file-not-found on its own introducing PR). The default PR-merge
      # ref is what nearly every other pull_request-triggered gate in
      # this repository uses too (e.g. provenance-disclosure-gate.yml);
      # the one exception, exception-handler-gap-gate.yml, pins to
      # head.sha, not base -- none pin to base. Residual limitation, left as a
      # known gap rather than assumed away: a PR editing this workflow
      # or its script can still tamper with its own grader within a
      # single run; the only backstop today is requiring this job's
      # name as a required status check plus human review, not the
      # checkout ref.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # labeled/unlabeled is in `types:` above so applying the
      # workflow-hooks-reviewed label re-runs this check on the same PR
      # without needing a new push.
      #
      # paths: above intentionally matches only the two categories issue
      # #136 scoped this gate to (.github/workflows/**, hooks/**), not
      # every path check 4 in screening-a-low-trust-contribution/SKILL.md
      # also names (.github/scripts/**, skills/*/scripts/**) -- extending
      # coverage to those is tracked as follow-up work, not done here.
      # The paths: filter also means this check cannot yet be promoted to
      # a required status check (it never reports on a non-matching PR);
      # that would need the diff-computed-in-job pattern this repo's
      # no-paths-filter gates use instead (e.g. hidden-characters-gate.yml,
      # provenance-disclosure-gate.yml), also left as follow-up.
      - name: Check author association and review label
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          python3 .github/scripts/gitapex_gate_low_trust_workflow_hooks.py \
            --author-association "$AUTHOR_ASSOCIATION" --labels "$LABELS"
