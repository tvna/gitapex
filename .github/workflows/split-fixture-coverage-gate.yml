name: Split fixture coverage gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "evals/*/split.md"
      - "evals/**/split.md"
      - "skills/*/SKILL.md"
      - "skills/**/SKILL.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  split-fixture-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # Issue #526 (unifying #191/#352's proposed gates): only split.md/
      # SKILL.md files this PR actually added or modified need checking,
      # matching retro-title-convention-citation-gate.yml's own rationale
      # -- pre-existing, already-shipped content is out of scope for a gate
      # whose job is to catch a gap before it ships. A three-dot
      # (merge-base) diff, not a two-dot direct diff, so a file changed on
      # the base branch after this PR forked is never misattributed here.
      # A pure deletion has no new content to check, so it is excluded the
      # same way skill-audit-gate.yml excludes D/R100 statuses.
      #
      # Issue #192 item 6 (Check E's delta-scoped coverage demand): also
      # computes a <skill-md-after-path><TAB><before-content-path-or-empty>
      # entries file for the changed SKILL.md files, the same merge-base
      # git-show approach skill-branch-fixture-coverage-gate.yml's own diff
      # step already uses for the #49 gate -- passed to
      # gitapex_gate_split_fixture_coverage.py as --skill-md-before-map so
      # it can tell a genuinely new Stop-boundary bullet/Procedure item
      # apart from a pre-existing one.
      - name: Determine changed split.md/SKILL.md files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! diff_output=$(git diff --name-status "$BASE_SHA...$HEAD_SHA" -- \
              'evals/*/split.md' 'evals/**/split.md' 'skills/*/SKILL.md' 'skills/**/SKILL.md'); then
            echo "::error::git diff failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          changed=$(printf '%s\n' "$diff_output" | grep -vE '^(D|R100)[[:space:]]' | awk -F'\t' '{print $NF}' || true)
          split_files=$(printf '%s\n' "$changed" | grep -E '/split\.md$' || true)
          skill_files=$(printf '%s\n' "$changed" | grep -E '/SKILL\.md$' || true)
          if [ -z "$split_files" ] && [ -z "$skill_files" ]; then
            echo "No added/modified split.md or SKILL.md files in this diff; skipping."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Added/modified split.md files:"
          echo "$split_files"
          echo "Added/modified SKILL.md files:"
          echo "$skill_files"

          before_map_file=""
          if [ -n "$skill_files" ]; then
            merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            before_map_file="$RUNNER_TEMP/skill_md_before_map.tsv"
            : > "$before_map_file"
            skill_diff=$(printf '%s\n' "$diff_output" | grep -E '/SKILL\.md($|\t)' | grep -vE '^(D|R100)[[:space:]]' || true)
            while IFS=$'\t' read -r status path newpath; do
              [ -z "$status" ] && continue
              case "$status" in
                R*) old_path="$path"; new_path="$newpath" ;;
                *) old_path="$path"; new_path="$path" ;;
              esac
              before_file=""
              if [ "$status" != "A" ]; then
                candidate_before_file=$(mktemp)
                if git show "${merge_base}:${old_path}" > "$candidate_before_file" 2>/dev/null; then
                  before_file="$candidate_before_file"
                else
                  rm -f "$candidate_before_file"
                fi
              fi
              printf '%s\t%s\n' "$new_path" "$before_file" >> "$before_map_file"
            done <<< "$skill_diff"
          fi

          {
            echo "applicable=true"
            echo "split_files<<GITAPEX_EOF"
            echo "$split_files"
            echo "GITAPEX_EOF"
            echo "skill_files<<GITAPEX_EOF"
            echo "$skill_files"
            echo "GITAPEX_EOF"
            echo "before-map-file=${before_map_file}"
          } >> "$GITHUB_OUTPUT"

      - name: Check split.md fixture-table coverage
        if: steps.diff.outputs.applicable == 'true'
        env:
          SPLIT_FILES: ${{ steps.diff.outputs.split_files }}
          SKILL_FILES: ${{ steps.diff.outputs.skill_files }}
          BEFORE_MAP_FILE: ${{ steps.diff.outputs.before-map-file }}
        run: |
          set -euo pipefail
          mapfile -t split_args < <(printf '%s\n' "$SPLIT_FILES" | grep -v '^$' || true)
          mapfile -t skill_args < <(printf '%s\n' "$SKILL_FILES" | grep -v '^$' || true)
          cmd=(uv run --frozen python3 .github/scripts/gitapex_gate_split_fixture_coverage.py --repo-root .)
          if [ "${#split_args[@]}" -gt 0 ]; then
            cmd+=(--split-md "${split_args[@]}")
          fi
          if [ "${#skill_args[@]}" -gt 0 ]; then
            cmd+=(--skill-md "${skill_args[@]}")
          fi
          if [ -n "$BEFORE_MAP_FILE" ]; then
            cmd+=(--skill-md-before-map "$BEFORE_MAP_FILE")
          fi
          # Issue #907 (gate review, dual-signal deny): the offender list went
          # only to stderr, so job status was the single channel -- while the
          # diff step above already emits a ::error:: annotation for its own
          # failure. Tee the output so the offenders surface as a workflow
          # annotation and in the step summary too, without swallowing the
          # exit code (PIPESTATUS, since the pipe's own status is tee's).
          set +e
          "${cmd[@]}" 2>&1 | tee gate-output.txt
          rc="${PIPESTATUS[0]}"
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "## Split fixture coverage gate"
              echo ""
              echo '```'
              cat gate-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E '^[[:space:]]+- ' gate-output.txt | sed 's/^[[:space:]]*- /::error::/' || true
          fi
          exit "$rc"
