# Issue #650: keep every hook command on the braced ${CLAUDE_PLUGIN_ROOT}
# form. apm 0.25.0 substitutes only that form, so an unbraced command is
# copied verbatim into a consumer's .claude/settings.json, resolves against
# an unset variable, and its hook never fires -- while apm's own install log
# still reports the hook as integrated. A silent loss of every PreToolUse
# gate is exactly the failure class a deterministic gate has to catch.
#
# Deliberately no `paths:` filter, following waza-eval-gate.yml's own
# rationale: a workflow that never fires for a given PR leaves a required
# status check Pending forever, whereas a job that runs and passes is safe
# to promote to required later. The scan is stdlib-only Python over three
# small files, so running it unconditionally costs a few seconds.
name: Plugin-root brace notation gate

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-root-brace-notation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02

      # No dependency install step: the gate is standard library only, and
      # ubuntu-latest ships python3. It does shell out to `git ls-files` to
      # read the tracked-file set, which the checkout above provides; a
      # shallow clone is sufficient, so no fetch-depth override is needed.
      - name: Check hook commands brace the plugin-root variable
        run: |
          set -euo pipefail
          python3 .github/scripts/gitapex_gate_plugin_root_brace_notation.py
