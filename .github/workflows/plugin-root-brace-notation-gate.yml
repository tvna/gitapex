# Issue #650: keep every hook command on the braced ${CLAUDE_PLUGIN_ROOT}
# form. apm 0.25.0 substitutes only that form, so an unbraced command is
# copied verbatim into a consumer's .claude/settings.json, resolves against
# an unset variable, and its hook never fires -- while apm's own install log
# still reports the hook as integrated. A silent loss of every PreToolUse
# gate is exactly the failure class a deterministic gate has to catch.
#
# Deliberately no `paths:` filter -- drift gate:
# tests/test_gitapex_gate_plugin_root_brace_notation.py's own
# test_the_workflow_has_no_paths_filter. See that test's docstring for why
# (following skill-eval-gate.yml's own required-check-stuck-Pending
# rationale). The scan itself is a fast Python pass over three small files
# (issue #1040 added a real `pydantic` import, so it is
# no longer stdlib-only, but still runs unconditionally in a few seconds).
name: Plugin-root brace notation gate

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-root-brace-notation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # Issue #1035: every `.github/scripts/*.py` invocation goes through
      # `uv run`. Issue #1040 gave this gate a real `pydantic` import, so
      # `uv run` is now load-bearing here too, not merely a blanket
      # convention -- a bare `python3` invocation fails at import time. It
      # also shells out to `git ls-files` to read the tracked-file set,
      # which the checkout above provides; a shallow clone is sufficient,
      # so no fetch-depth override is needed.
      - name: Check hook commands brace the plugin-root variable
        run: |
          set -euo pipefail
          uv run --frozen python3 .github/scripts/gitapex_gate_plugin_root_brace_notation.py
