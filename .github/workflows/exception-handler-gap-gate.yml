# Issue #682 (refs #665, #673, #674, #680): five separate times this
# repository has shipped the same defect into one of its own gates -- a
# decoded read whose enclosing `try` names the wrong failure (or no failure
# at all), and a `.get()` on a `json.loads` result that was never checked to
# be an object. Every instance passed pytest with the affected file at 100
# percent line coverage, because the handler that would have caught it does
# not exist: no line, branch or `except`-line coverage metric can point at
# an absent handler, and issue #682's own measurement found `ruff --select
# ALL` reports zero findings on any of the three defect lines. This job runs
# the AST scan that was measured against exactly those historical defects.
#
# Deliberately no `paths:` filter, following lint.yml's and
# plugin-root-brace-notation-gate.yml's own stated rationale: GitHub
# distinguishes a job that runs and reports `skipped` (which does not block
# a required check) from a workflow that never fires for a given PR (which
# leaves a required check Pending forever). This job is intended for
# promotion to a required status check, so a filter would permanently block
# any PR that happens not to touch a matched path. The scan is stdlib-only
# Python over the files a diff actually adds lines to, so running it
# unconditionally costs a few seconds.
name: Exception-handler gap gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exception-handler-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # `ref:` is pinned to the PR head, which every other gate workflow
      # here leaves at the default `refs/pull/N/merge`. That is not a style
      # difference: this gate reads each file's post-image content off the
      # working tree and grades it against line numbers taken from
      # `git diff`'s own post-image, so the tree has to *be* that
      # post-image. Under the default merge-ref checkout the two diverge for
      # any file the base branch also changed -- verified live, a file both
      # branches touched grades clean under the merge ref and correctly
      # reports its gap under the head sha. No other gate here correlates
      # diff-derived line numbers with tree content, which is why none of
      # them needs this; several do read the tree (for example
      # gate_split_fixture_coverage.py and gate_transfer_check_disclosure.py)
      # but locate what they grade by text rather than by line number.
      #
      # The accepted cost, stated rather than discovered later: this runs the
      # PR branch's own copy of the gate, so a branch that forked before a
      # hardening of the gate landed on main is graded by the older rules.
      # Branch protection's "Require branches to be up to date" closes that,
      # and it is a GitHub-side setting no in-repo file can record.
      #
      # fetch-depth: 0 so the merge-base below resolves.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # git merge-base (not base.sha directly), same reasoning as
      # gitignore-pattern-coverage-gate.yml and skill-rename-lifecycle-gate.yml:
      # a change that landed on the base branch after this PR forked must
      # never be misattributed to this PR.
      #
      # Two `git diff` flags carry weight and are not defaults:
      #
      #   --no-renames, because rename detection is on by default and a file
      #   moved into one of the graded directories arrives as a
      #   "similarity index 100%" header with zero added lines. Promoting a
      #   helper into .github/scripts/ is exactly how this harness grows, and
      #   without this the promoted file enters scope ungraded -- the same
      #   rename-shaped fail-open detect_changed_gate_scripts.py's own
      #   docstring records having had to close.
      #
      #   -c core.quotePath=false, because quoting is on by default and a
      #   non-ASCII path anywhere in the diff is then emitted as an escaped,
      #   quoted string the gate refuses to resolve (exit 2). That would fail
      #   the whole job over a file which may not even be in scope, and a
      #   contributor could not fix it except by renaming their file. Stated
      #   precisely, because the flag does less than it looks like it does:
      #   it covers the non-ASCII case only. Git still quotes a path
      #   containing a double quote, a backslash, or a control character
      #   whatever this is set to, and such a path still exits 2 -- fail-closed
      #   on a name this gate cannot resolve, and not a shape a .py file in
      #   this repository has ever had.
      #
      # No dependency install step: the gate is standard library only, and
      # ubuntu-latest ships python3.
      - name: Grade the decoded reads and JSON accesses this diff adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
            echo "::error::git merge-base failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          git -c core.quotePath=false diff -U0 --no-renames "$merge_base" "$HEAD_SHA" -- '*.py' \
            | python3 .github/scripts/gate_exception_handler_gaps.py
