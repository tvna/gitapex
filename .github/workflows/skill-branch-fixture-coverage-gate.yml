name: Skill decision-branch fixture coverage gate

# Deliberately no `paths:` filter, for the reason lint.yml's and
# skill-eval-gate.yml's own headers state at length: GitHub distinguishes a
# job that runs and reports `skipped` (does not block a required status
# check) from a workflow that never fires at all for a given pull request
# (leaves the required check `Pending` forever, with no in-repository fix).
# A `paths:` trigger filter is the second case, and
# .github/scripts/gitapex_gate_ruleset_required_checks.py (issue #439)
# structurally refuses to accept a path-filtered job's context as a
# required status check for exactly that reason -- see issue #1422. Running
# unconditionally is the required-check-safe shape; the diff step below
# already exits early (reporting success) when no skills/*/SKILL.md
# changed, so the added cost is one checkout plus a short diff on every PR,
# the same price lint.yml and skill-eval-gate.yml already accepted.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-branch-fixture-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # Issue #49 repair 1 (re-escalated, unbuilt, across #419, #440,
      # #454, #548): a SKILL.md's own Stop-boundary bullets and named
      # dispatch branches must not outgrow its evals/<skill>/tasks/
      # fixture count. Diff-scoped (added/modified skills/*/SKILL.md,
      # D/R100-excluded) and delta-scoped -- see
      # gitapex_gate_skill_branch_fixture_coverage.py's own module docstring for
      # why this only fires when THIS diff increases a skill's own
      # decision-branch count, never retroactively against a pre-existing
      # gap this gate did not create. A three-dot (merge-base) diff
      # mirrors skill-audit-gate.yml's and transfer-check-disclosure-gate.yml's
      # own rationale: a SKILL.md change already merged to the base branch
      # after this PR forked must never be misattributed to this PR.
      - name: Determine changed SKILL.md and compute branch/fixture facts
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! diff_output=$(git diff --name-status "$BASE_SHA...$HEAD_SHA" -- 'skills/*/SKILL.md'); then
            echo "::error::git diff failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          changed=$(printf '%s\n' "$diff_output" | grep -vE '^(D|R100)[[:space:]]' || true)
          if [ -z "$changed" ]; then
            echo "No added/modified skills/*/SKILL.md in this diff; skipping."
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Added/modified SKILL.md files:"
          echo "$changed"

          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          entries_file="$RUNNER_TEMP/skill_branch_entries.tsv"
          : > "$entries_file"
          while IFS=$'\t' read -r status path newpath; do
            [ -z "$status" ] && continue
            case "$status" in
              R*) old_path="$path"; new_path="$newpath" ;;
              *) old_path="$path"; new_path="$path" ;;
            esac
            skill=$(printf '%s\n' "$new_path" | sed -E 's#^skills/([^/]+)/SKILL\.md$#\1#')
            # Skill name is interpolated into a path below and written to a
            # temp TSV file this workflow itself parses -- a PR author fully
            # controls this directory name in their own diff, so validate
            # its shape first (same guard skill-audit-gate.yml already
            # applies to the identical extraction).
            if ! printf '%s' "$skill" | grep -E '^[A-Za-z0-9_-]+$' >/dev/null; then
              echo "::error::unsupported skill directory name for signal computation: $new_path" >&2
              exit 1
            fi

            after_file=$(mktemp)
            git show "${HEAD_SHA}:${new_path}" > "$after_file"

            # A pure addition ('A' status) has no merge-base version at
            # all -- every branch it declares counts as new. A modify or
            # rename does have one; git show can still legitimately fail
            # for a rename whose old_path didn't exist at merge_base (a
            # rename plus re-add across history is rare but not
            # impossible) -- treated the same as "no prior version found".
            before_file=""
            if [ "$status" != "A" ]; then
              candidate_before_file=$(mktemp)
              if git show "${merge_base}:${old_path}" > "$candidate_before_file" 2>/dev/null; then
                before_file="$candidate_before_file"
              else
                rm -f "$candidate_before_file"
              fi
            fi

            # grep -c always prints a count (even "0") and only exits
            # non-zero when the count is zero; `|| true` absorbs that
            # under `pipefail` without masking a real git-ls-tree failure
            # (which prints nothing, so grep -c on empty input still
            # correctly reports "0").
            fixture_count=$(git ls-tree -r --name-only "$HEAD_SHA" -- "evals/${skill}/tasks/" 2>/dev/null | grep -c '\.yaml$' || true)

            printf '%s\t%s\t%s\t%s\n' "$skill" "$before_file" "$after_file" "$fixture_count" >> "$entries_file"
          done <<< "$changed"

          {
            echo "applicable=true"
            echo "entries-file=${entries_file}"
          } >> "$GITHUB_OUTPUT"

      - name: Check decision-branch fixture coverage
        if: steps.diff.outputs.applicable == 'true'
        env:
          # The entries-file path reaches the shell through env rather than a
          # `${{ }}` interpolation inside `run:`; interpolating a context
          # directly into a script body is the template-injection shape
          # zizmor flags, and there is no reason to hand-wave it as safe here
          # when an env var costs nothing (see apply-rulesets.yml's own
          # identical "Guard dispatch ref" step for the same reasoning).
          ENTRIES_FILE: ${{ steps.diff.outputs.entries-file }}
        run: |
          set -euo pipefail
          uv run --frozen python3 .github/scripts/gitapex_gate_skill_branch_fixture_coverage.py --entries "$ENTRIES_FILE"
