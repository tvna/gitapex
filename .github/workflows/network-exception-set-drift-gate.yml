# Issue #1512 (consolidated into #1572's own umbrella): two functions in
# the same module that both wrap a network call in try/except must declare
# the same exception set for it. `_gitapex_github_http.py`'s own
# `graphql_call`/`request_with_retry` pair drifted exactly this way --
# found only by a Step 8 adversarial review, not any earlier, cheaper
# check -- see .github/scripts/gitapex_gate_network_exception_set_drift.py's
# own module docstring for the full motivating case and design rationale.
#
# Deliberately no `paths:` filter -- drift gate:
# tests/test_gitapex_gate_network_exception_set_drift.py's own
# test_the_workflow_has_no_paths_filter. See that test's docstring, and
# exception-handler-gap-gate.yml's own identical comment, for why (GitHub's
# own skipped-vs-never-ran distinction for a required check).
name: Network exception-set drift gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network-exception-set-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # `ref:`/`fetch-depth: '0'` below is this gate's own diff-post-image
      # checkout pin -- drift gate:
      # tests/test_gitapex_gate_network_exception_set_drift.py's own
      # test_the_workflow_checks_out_the_head_sha_with_full_history. See
      # exception-handler-gap-gate.yml's own identical comment for why
      # (this gate correlates diff-derived line numbers with tree content).
      #
      # The accepted cost, stated rather than discovered later: this runs the
      # PR branch's own copy of the gate, so a branch that forked before a
      # hardening of the gate landed on main is graded by the older rules.
      # Branch protection's "Require branches to be up to date" closes that,
      # and it is a GitHub-side setting no in-repo file can record.
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # git merge-base below -- drift gate:
      # tests/test_gitapex_gate_network_exception_set_drift.py's own
      # test_the_workflow_uses_merge_base_not_base_sha.
      #
      # The two `git diff` flags below (--no-renames, -c
      # core.quotePath=false) -- drift gate:
      # tests/test_gitapex_gate_network_exception_set_drift.py's own
      # test_the_workflow_passes_the_two_flags_the_gate_depends_on. See
      # exception-handler-gap-gate.yml's own identical comment for why each
      # matters.
      #
      # Issue #1035: every `.github/scripts/*.py` invocation goes through
      # `uv run` regardless of whether the script needs a third-party
      # dependency. This gate carries a real `pydantic` import (its own
      # CLI-arg validation), so `uv run` is load-bearing here too.
      - name: Grade the network try/except pairs this diff adds or touches
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
            echo "::error::git merge-base failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          git -c core.quotePath=false diff -U0 --no-renames "$merge_base" "$HEAD_SHA" -- '*.py' \
            | uv run --frozen python3 .github/scripts/gitapex_gate_network_exception_set_drift.py
