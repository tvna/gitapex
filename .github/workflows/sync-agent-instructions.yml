name: Sync agent instructions

on:
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC. A run with no upstream drift is a
    # no-op (sync_pr_publish returns "up-to-date": no branch, no commit, no PR),
    # and an open sync PR is only re-committed on real drift, so daily cadence
    # surfaces upstream changes faster without churning CI/notifications.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  MASTER_REPO: tvna/claude-md
  # Upstream delivers the compiled instruction files as raw blobs on its default
  # branch -- there is no GitHub Release and no version tag (one is planned, not
  # yet present). The sync tracks the latest commit on that branch. Pulling an
  # unreviewed upstream change is an accepted project trade-off.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The PR-publishing step mints its own short-lived GitHub App token (write
    # scope), so the job's default GITHUB_TOKEN never needs more than read
    # access to check out the repository.
    permissions:
      contents: read
    # Scopes SYNC_BOT_APP_ID / SYNC_BOT_APP_PRIVATE_KEY to this job via a
    # GitHub Environment rather than plain repo secrets, so they can carry
    # their own protection rules (e.g. required reviewers) independent of
    # other workflows in this repo. See CONTRIBUTING.md -> "Signed-commit bot
    # App" for how the Environment and secrets are created.
    environment:
      name: sync-bot
    steps:
      # Recommended: restrict egress to api.github.com and raw.githubusercontent.com.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch upstream instruction files
        id: fetch
        env:
          MASTER_REPO: ${{ env.MASTER_REPO }}
        run: |
          set -euo pipefail
          # Resolve the default branch head once, then fetch every file pinned to
          # that exact commit, so all files come from one consistent upstream
          # revision even if the branch advances mid-run. Branch delivery ships no
          # SHA256SUMS manifest; the commit pin is the consistency guarantee.
          branch="$(curl -fsSL "https://api.github.com/repos/${MASTER_REPO}" | jq -r '.default_branch')"
          sha="$(curl -fsSL "https://api.github.com/repos/${MASTER_REPO}/commits/${branch}" | jq -r '.sha')"
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "could not resolve ${MASTER_REPO}@${branch} head commit" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
          base="https://raw.githubusercontent.com/${MASTER_REPO}/${sha}"
          tmp="$(mktemp -d)"
          for f in AGENTS.md CLAUDE.md; do
            curl -fsSL "${base}/${f}" -o "${tmp}/${f}"
          done
          # Land the fetched files as committed real files (no symlink).
          # No-delta layout: write to the repository root.
          cp "${tmp}/AGENTS.md" AGENTS.md
          cp "${tmp}/CLAUDE.md" CLAUDE.md
          rm -rf "$tmp"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # A `git push` from the runner's default GITHUB_TOKEN produces an
      # unsigned commit, which this repository's required_signatures
      # branch-protection rule rejects at merge time (the original failure
      # this workflow hit). Mint a short-lived GitHub App installation token
      # instead; .github/scripts/sync_pr_publish.py uses it to create the commit
      # server-side via the GraphQL createCommitOnBranch mutation, which
      # GitHub signs and shows as Verified. See the App setup steps in
      # CONTRIBUTING.md for how SYNC_BOT_APP_ID / SYNC_BOT_APP_PRIVATE_KEY
      # are issued.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.SYNC_BOT_APP_ID }}
          private-key: ${{ secrets.SYNC_BOT_APP_PRIVATE_KEY }}

      - name: Publish a signed pull request on change
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<EOF
          Syncs AGENTS.md and CLAUDE.md from ${MASTER_REPO}
          at commit ${{ steps.fetch.outputs.sha }} (latest on the default branch).

          Review and merge behind the code-owner gate. Do not auto-merge.
          EOF
          uv run --frozen python3 .github/scripts/sync_pr_publish.py \
            --base "${GITHUB_REF_NAME}" \
            --branch chore/sync-claude-md \
            --title "chore: sync agent instructions from ${MASTER_REPO}" \
            --body-file /tmp/pr-body.md \
            --commit-subject "chore: sync agent instructions (${{ steps.fetch.outputs.short_sha }})" \
            --add AGENTS.md \
            --add CLAUDE.md
