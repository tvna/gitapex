# Issue #702 (refs #665 repair 6): no repository-tracked file may carry a literal
# hidden/invisible Unicode character (BOM, zero-width, bidi control) --
# apm's own supply-chain scan already flags this repository over exactly
# this class of defect, and PR #651's own authoring session reproduced it
# twice in one sitting despite catching both before commit.
#
# Deliberately no `paths:` filter, following waza-eval-gate.yml's own
# rationale: a workflow that never fires for a given PR leaves a required
# status check Pending forever, whereas a job that runs and passes is safe
# to promote to required later. The scan is stdlib-only Python over every
# tracked file, so running it unconditionally costs a few seconds.
name: Hidden characters gate

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hidden-characters:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      # Issue #1035: the gate is standard-library only, but every
      # `.github/scripts/*.py` invocation now goes through `uv run`
      # regardless. It does shell out to `git ls-files` to read the
      # tracked-file set, which the checkout above provides; a shallow
      # clone is sufficient, so no fetch-depth override is needed.
      - name: Check for hidden/invisible characters in tracked files
        run: |
          set -euo pipefail
          uv run --frozen python3 .github/scripts/gitapex_gate_hidden_characters.py
