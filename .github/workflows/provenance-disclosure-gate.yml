name: Provenance disclosure gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provenance-disclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner + checkout
        uses: tvna/gitapex/.github/actions/harden-checkout@2f62b5648552a0f800b1b85e75ec108a7016dd02
        with:
          fetch-depth: '0'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # Issue #520 (row 3, refs #350): the flagged pattern (a review-
      # response draft or doc/PR-body diff naming a specific tool's
      # absence/presence as an evidence-limitation reason) can live in the
      # PR body alone, so this workflow runs on every PR regardless of
      # which paths changed -- unlike the other two new gates, a paths:
      # filter here would skip exactly the body-only case #350 itself was.
      # Added-line extraction (not the whole file) for doc/eval/skill
      # Markdown: pre-existing, already-reviewed prose is out of this
      # gate's scope, only what this diff introduces. A three-dot
      # (merge-base) diff matches the other new gates' own rationale.
      # git's default pathspec matching requires "**" to span at least one
      # directory segment -- 'docs/**/*.md' does NOT match a file directly
      # under docs/ (e.g. docs/glossary.md), unlike the GitHub Actions
      # workflow-trigger paths: glob (a different engine, zero-or-more
      # semantics). Both the "**" form (nested files) and the plain "*"
      # form (top-level files) are listed explicitly per directory so a
      # top-level docs/*.md or evals/*.md edit is never silently skipped.
      # Issue #552: a prior `grep -E '^\+[^+]' | sed 's/^\+//'` extraction
      # dropped every blank-line-only diff addition, collapsing per-file
      # paragraph structure (and file-to-file boundaries) that
      # gitapex_gate_provenance_disclosure.py's own paragraph-scoped check depends
      # on, producing false positives on a sufficiently large addition.
      # gitapex_extract_diff_added_lines.py replaces it. A first fix (tracking
      # per-hunk boundaries under -U0) was itself found to cause false
      # NEGATIVES: -U0 shows zero context, so two edits inside the same
      # real paragraph, separated only by an untouched non-blank line, are
      # reported as two separate hunks -- indistinguishable from two edits
      # in genuinely different paragraphs. The current script instead reads
      # real blank context/added lines to find true paragraph breaks, which
      # requires enough diff context (-U1000000) that git never needs to
      # split one file's changes into more than one hunk for any realistic
      # file size in this gate's docs/evals/skills scope.
      - name: Extract added lines from doc/eval/skill Markdown
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          added_file="$RUNNER_TEMP/added_lines.txt"
          if ! git diff -U1000000 "$BASE_SHA...$HEAD_SHA" -- \
              'docs/*.md' 'docs/**/*.md' 'evals/*.md' 'evals/**/*.md' 'skills/*.md' 'skills/**/*.md' \
              | uv run -qq --frozen python3 .github/scripts/gitapex_extract_diff_added_lines.py > "$added_file"; then
            echo "::error::git diff/extraction failed between $BASE_SHA and $HEAD_SHA" >&2
            exit 1
          fi
          echo "added-file=$added_file" >> "$GITHUB_OUTPUT"

      # PR_BODY carries untrusted external text (anyone with PR-author
      # access controls it) -- written to a file via env, never
      # interpolated directly into the shell script, avoiding GitHub
      # Actions expression/script injection (same rationale as
      # skill-audit-gate.yml's own PR_BODY handling).
      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"

      - name: Check provenance disclosure
        run: |
          set -euo pipefail
          uv run --frozen python3 .github/scripts/gitapex_gate_provenance_disclosure.py \
            --body "$RUNNER_TEMP/pr_body.txt" \
            --diff-added "${{ steps.diff.outputs.added-file }}"
