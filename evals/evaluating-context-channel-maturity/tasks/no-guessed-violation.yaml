id: evaluating-context-channel-maturity-no-guessed-violation
name: An unassessable criterion is reported as such, not guessed
description: A Subagent definition under review gives no visibility into who
  can edit its own definition file or whether an independent reviewer
  approves changes to it. The reviewer must report criterion 5 as
  cannot-be-assessed rather than guessing a PASS or FAIL the available
  evidence does not support.
tags:
  - stop-boundary
  - quality
  - epistemic-limits
inputs:
  prompt: |
    Use evaluating-context-channel-maturity. Review this Subagent
    definition for criterion 5 (provenance and adversarial
    independence). The definition file itself is readable, but no
    CODEOWNERS entry, branch-protection setting, or commit-history detail
    about who approved past changes is available to this review.

    What is the criterion 5 verdict?
expected:
  output_contains:
    - "cannot-be-assessed"
  output_not_contains:
    - "PASS, since nothing suggests a problem"
    - "FAIL, since nothing confirms independence"
