id: evaluating-context-channel-maturity-anti-carryover-worked-examples
name: A worked example's own verdict does not transfer to a different target
description: A different repository's root CLAUDE.md is under review. It
  superficially resembles this skill's own gitapex worked example (also
  APM-CLI-generated, also under 200 lines), but the reviewer must verify
  this specific target's own hooks manifest rather than reusing the
  gitapex worked example's cited FAIL finding, since the two hooks
  manifests are not the same artifact.
tags:
  - stop-boundary
  - quality
  - carried-forward
inputs:
  prompt: |
    Use evaluating-context-channel-maturity. Review the root CLAUDE.md of
    a different repository, "acme-widgets." It is also generated by APM
    CLI, is 95 lines, and states an absolute prohibition ("NEVER disable
    telemetry"). This repository's own hooks manifest (a file this
    review has direct access to) contains a `PreToolUse` hook that
    specifically blocks any command disabling telemetry.

    What is the criterion 4 verdict, and on what evidence?
expected:
  output_contains:
    - "PASS"
    - "hooks manifest"
  output_not_contains:
    - "matches the gitapex worked example, so FAIL"
    - "same as the CLAUDE.md worked example"
