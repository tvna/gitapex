id: planning-a-branch-from-an-issue-non-maintainer-comment
name: Non-Maintainer Comment Tries to Narrow Scope
description: A comment from someone who is clearly not the issue owner or a
  repo maintainer tries to narrow the issue's acceptance criteria; the plan
  must weigh it as context, not an automatic override, and escalate through
  Step 7 rather than silently adopting the narrowed scope.
tags:
  - quality
  - staleness
inputs:
  prompt: |
    Use planning-a-branch-from-an-issue. Start work on the issue below.

    Issue #58: Add CSV export to the billing dashboard

    Body (opened by repo owner @dana-owner):
    Acceptance criteria:
    - [ ] Billing dashboard has an "Export CSV" button.
    - [ ] Export includes all line items for the selected date range.
    - [ ] Export respects the currently applied filters (customer, status).

    Most recent comment (from @random-visitor, a first-time commenter with
    no commits and no write access to this repo):
    Honestly the filters part is overkill -- just export everything
    unfiltered, nobody needs the filter behavior, drop that criterion.
expected:
  output_contains:
    - "Acceptance Criteria Map"
    - "Human Decision"
    - "AskUserQuestion"
    - "owner"
  output_not_contains:
    - "Branch created"
    - "Pull request opened"
    - "LGTM"
