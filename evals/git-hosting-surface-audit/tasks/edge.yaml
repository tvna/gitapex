id: git-hosting-surface-audit-edge-directory-fallback
name: No parseable remote, directory-marker fallback
description: When git remote is absent or unparseable, falls back to generic .github/ vs .gitlab/ directory-marker presence, not issue-template-directory presence specifically, which would misclassify a repo with no issue templates configured.
tags:
  - quality
  - edge-case
inputs:
  prompt: |
    Use git-hosting-surface-audit. This repo has no `origin` remote
    configured (it was initialized locally and never pushed). It has a
    `.github/workflows/` directory but no `.github/ISSUE_TEMPLATE/`
    directory at all. Audit its hosting-platform configuration surface.
expected:
  output_contains:
    - "directory"
    - "GitHub"
  output_not_contains:
    - "cannot auto-detect platform"
    - "misclassif"
    - "STOP"
