name: outward-artifact-preflight-eval
description: Quality suite for the gitapex outward-artifact-preflight skill.
skill: outward-artifact-preflight
version: "0.1.0"
config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5
metrics:
  - name: outward_artifact_preflight_quality
    weight: 1.0
    threshold: 0.8
    description: Flags undisclosed provenance markers, non-ASCII content, and a citation-shaped sentence that could trip a git host's closing-keyword scan, before push/post, and never clears a flagged artifact without a fix or explicit owner sign-off.
tasks:
  - "tasks/*.yaml"
