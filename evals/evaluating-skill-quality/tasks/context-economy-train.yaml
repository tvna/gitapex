inputs:
  prompt: |
    Use evaluating-skill-quality. Review this draft SKILL.md excerpt for a
    skill called "priority-queue-walkthrough". Is this a good skill?

    ---
    name: priority-queue-walkthrough
    description: Explain how a priority-queue dispatcher orders work items. Use when the user asks how the dispatcher's ordering algorithm works.
    ---

    # Priority Queue Walkthrough

    ## Procedure

    1. See `scripts/dispatch_order.py` for the ordering algorithm.

    `scripts/dispatch_order.py` (top of file):
    ```python
    import heapq

    def dispatch_order(items):
        # Create an empty list called heap
        heap = []
        # Loop over each item in items
        for item in items:
            # Push the item onto the heap
            heapq.heappush(heap, item)
        # Create an empty list called result
        result = []
        # While the heap is not empty
        while heap:
            # Pop the smallest item from the heap
            smallest = heapq.heappop(heap)
            # Append the smallest item to result
            result.append(smallest)
        # Return the result list
        return result
    ```
expected:
  output_contains:
    - "token cost"
  output_not_contains:
    - "LGTM"
    - "no concerns"
