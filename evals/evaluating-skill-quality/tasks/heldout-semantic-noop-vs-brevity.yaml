id: evaluating-skill-quality-heldout-semantic-noop-vs-brevity
name: Unmeasured No-op Versus Static Brevity
description: Requires pruning decisions to distinguish static evidence from measured no-op evidence and reject sentence-length-only pruning.
tags:
  - quality
  - train
  - review-corrected
inputs:
  prompt: |
    Review two sentences from a release skill. Sentence A: "Be thorough and produce a high-quality result." Sentence B: "Before publishing, require the signed tag, the artifact digest from CI, and the rollback command; stop and name every missing item." No before/after behavioral run, named model, harness, or fixture set is available. The operator asks to shorten the skill. Decide by operational semantics, not character count. Include all four lines: NO_OP_STATUS: MEASURED or NO_OP_STATUS: UNMEASURED; STATIC_PRUNE_CANDIDATE: A or STATIC_PRUNE_CANDIDATE: B; LONG_BUT_OPERATIONAL: A or LONG_BUT_OPERATIONAL: B; STATIC_BREVITY_ONLY: ACCEPTED or STATIC_BREVITY_ONLY: REJECTED.
expected:
  output_contains:
    - "NO_OP_STATUS: UNMEASURED"
    - "STATIC_PRUNE_CANDIDATE: A"
    - "LONG_BUT_OPERATIONAL: B"
    - "STATIC_BREVITY_ONLY: REJECTED"
  output_not_contains:
    - "NO_OP_STATUS: MEASURED"
    - "STATIC_PRUNE_CANDIDATE: B"
    - "LONG_BUT_OPERATIONAL: A"
    - "STATIC_BREVITY_ONLY: ACCEPTED"
