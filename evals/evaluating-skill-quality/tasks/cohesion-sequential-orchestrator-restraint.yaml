id: evaluating-skill-quality-cohesion-sequential-orchestrator-restraint
name: New-Service-Onboarding Orchestrator Is Not Split Merely For Touching Several Systems
description: Restraint check (test split, read once) for the Skill vs. multiple skills / cohesion Agentic operation mechanism-fit check -- the target's four ordered steps (register in the service catalog, provision a database, configure monitoring, write the runbook) each feed the next and converge on one outcome, "a new service is fully onboarded and operable," even though the steps touch four different systems. This is sequential/functional cohesion, not a split candidate. The review must not flag a cohesion split finding merely because the skill has several steps or crosses systems -- checks the restraint side the issue that motivated this check explicitly requires.
tags:
  - quality
  - mechanism-fit
  - cohesion
  - restraint
inputs:
  prompt: |
    Use evaluating-skill-quality. Review this draft SKILL.md excerpt for a
    skill called "new-service-onboarding". Is this a good skill?

    ---
    name: new-service-onboarding
    description: Onboard a new backend service end to end -- register it in the service catalog, provision its database, configure its monitoring dashboards, and write its on-call runbook. Use when a team is bringing up a new service and needs it fully operable.
    ---

    # New Service Onboarding

    ## Procedure

    1. Register the service in the catalog, recording its name and owning
       team. The catalog entry's generated service ID is required by every
       step below.
    2. Provision a database for the service, tagged with the catalog's
       service ID from step 1.
    3. Configure monitoring dashboards keyed to the same service ID,
       wired to alert on the database provisioned in step 2.
    4. Write the on-call runbook, linking the catalog entry, the
       database, and the monitoring dashboards from steps 1-3 so an
       on-call engineer has one document covering the whole service.

    The service is not considered onboarded until all four steps complete;
    a partially-run subset (e.g. a catalog entry with no database) is not a
    usable end state on its own.
expected:
  output_contains:
    - "no cohesion split finding"
  output_not_contains:
    - "LGTM"
    - "no concerns"
