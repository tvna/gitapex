id: evaluating-skill-quality-dispatch-required-negative-control
name: Forced Inline-Only Answer Must Not Score as a Confirmed Dispatch
description: >-
  A deliberately-forced negative control for the dispatch-trace checker
  (issue #584), not a normal grading fixture: the prompt explicitly forbids
  dispatching, delegating to, or invoking any subagent/Task/Agent tool, so
  the model answers using only its own inline reasoning -- exactly the
  scenario evaluating-skill-quality's own Subagent dispatch section says
  must not stand in for an isolated review. A `not_confirmed` dispatch-trace
  verdict on this fixture is the correct, expected result, proving the
  checker (evals/scripts/check_dispatch_trace.py) can tell "answered
  correctly without dispatching" apart from "actually dispatched" -- it is
  not evidence of a fixture defect if it stays not_confirmed. Content
  target is the same document-helper draft as normal.yaml, so the two
  fixtures are directly comparable pairs for the checker's own proof.
tags:
  - quality
  - dispatch-verification
inputs:
  prompt: |
    Review the following draft SKILL.md for a skill called "document-helper"
    and give me the full review. Answer using only your own inline reasoning
    in this turn -- do not dispatch, delegate to, or invoke any subagent,
    Task, or Agent tool for any part of this review.

    ---
    name: document-helper
    description: Helps with documents and file processing tasks.
    ---
    # Document Helper
    This skill helps you work with documents. Follow good practices and
    use your best judgment throughout.
    ## Procedure
    1. Open the document.
    2. Do the necessary processing.
    3. Save the result.
expected:
  output_contains:
    - "document-helper"
  output_not_contains:
    - "LGTM"
    - "looks fine"
  requires_fresh_dispatch:
    tool_names: ["Agent"]
    min_dispatches: 1
