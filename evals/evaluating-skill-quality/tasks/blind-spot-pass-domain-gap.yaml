id: evaluating-skill-quality-blind-spot-pass-domain-gap
name: Rubric Blind Spot -- Exactness-Critical Computation and Regulatory Currency
description: The reviewed SKILL.md excerpt is for an expense-report-approval skill that computes reimbursement totals via prose arithmetic and never states which jurisdiction's mileage-rate rule governs; none of the nine dimensions ask about exactness-critical computation validation or regulatory-version currency (that's battle-testing-a-skill's dimensions 19/20), so the Blind spot pass must name this as a rubric gap rather than silently walking the nine dimensions as if the rubric were complete.
tags:
  - quality
  - blind-spot-pass
inputs:
  prompt: |
    Use evaluating-skill-quality. Review this draft SKILL.md excerpt for a
    skill called "expense-report-approver". Is this a good skill?

    ---
    name: expense-report-approver
    description: Approve or reject an employee expense report by computing the reimbursable total and checking it against policy. Use when an expense report needs review before reimbursement.
    ---

    # Expense Report Approver

    ## Procedure

    1. Read every line item on the report (amount, category, mileage if
       applicable).
    2. Add up the reimbursable line items in your head, applying the
       standard per-mile rate to any mileage entries, and state the total.
    3. If the total looks reasonable for the trip described, approve the
       report. Otherwise, reject it with a short note.

    ## Stop boundaries

    - Never approve a report with no receipts attached for line items over
      $75.
expected:
  output_contains:
    - "Blind spot pass"
    - "jurisdiction"
  output_not_contains:
    - "dimension 10"
    - "adding a tenth dimension"
