id: fixing-a-reported-issue-no-linked-issue-escalation
name: Standalone CI Failure With No Linked Issue Fails To Reproduce
description: A scheduled workflow failure with no issue tracking it does not reproduce locally; since there is no existing issue to comment on, the skill opens a new issue recording the attempted steps and stops rather than guessing at a fix.
tags:
  - quality
  - edge-case
inputs:
  prompt: |
    Use fixing-a-reported-issue. The nightly `data-export` scheduled workflow run
    failed with:

    > `data-export` job failed: `Error: unexpected token in row 4821 of
    > export_2026-07-16.csv`

    No GitHub issue exists for this failure -- it is a bare scheduled
    workflow failure, not an issue report.

    You checked out the same commit the scheduled run used and re-ran the
    `data-export` job locally against the same input file three times.
    Every run completed successfully with no parse error at row 4821 or
    anywhere else -- you cannot get the reported failure to occur.

    What do you do next?
expected:
  output_contains:
    - "open a new issue"
    - "did not reproduce"
    - "row 4821"
  output_not_contains:
    - "comment on the issue"
    - "Fix minimally"
    - "applied a fix"
    - "no issue to escalate to"
