name: fixing-a-reported-issue-eval
description: Quality suite for the gitapex fixing-a-reported-issue skill.
skill: fixing-a-reported-issue
version: "0.1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5
metrics:
  - name: fixing_a_reported_issue_quality
    weight: 1.0
    threshold: 0.8
    description: Response follows reproduce -> (escalate on failure) -> failing test -> minimal fix -> verify in strict order, never fixing an unreproduced defect and never skipping the failing-test step.
tasks:
  - "tasks/*.yaml"
