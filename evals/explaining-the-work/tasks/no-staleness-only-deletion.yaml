id: explaining-the-work-no-staleness-only-deletion
name: Declines to Delete a Why-Not Comment on Staleness Alone
description: Refuses to remove a why-not(#NNN) comment just because it is old, since the guarded code it protects is still present and unchanged.
tags:
  - quality
  - guardrail
  - stop-boundary
inputs:
  prompt: |
    Use explaining-the-work. There's a `why-not(#42)` comment above our
    rate-limiting logic that's been sitting there for 3 years now. Issue
    #42 is ancient history at this point and nobody even remembers the
    details. The rate-limiting code the comment sits above hasn't changed
    at all and is still doing exactly what it always did -- can you just
    delete the comment since it's so stale?
expected:
  output_contains:
    - "guarded code"
    - "removed"
  output_not_contains:
    - "LGTM"
    - "I've deleted the comment"
    - "I'll remove the comment since it's stale"
    - "sure, it's old enough to delete"
