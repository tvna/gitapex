id: explaining-the-work-commit-why-keeps-distinct-reasons
name: Commit Why Keeps Multiple Real, Distinct Reasons
description: Checks that a terse commit Why does not drop a real, distinct
  causal reason merely to satisfy a brevity instruction, once the routing
  rule no longer states a fixed sentence-count cap.
tags:
  - quality
inputs:
  prompt: |
    Use explaining-the-work. I just migrated our public-API rate limiter
    off an in-process token bucket onto a shared Redis-backed one (issue
    #488, and this fully closes it). Three real things drove this, all
    worth keeping straight for whoever reads this later: (1) the
    in-process bucket resets to zero on every pod restart, so a deploy
    let a client burst straight past the limit right after rollout; (2)
    with autoscaling, each pod kept its own separate counter, so the
    limit scaled with pod count instead of being enforced globally; (3)
    the team already runs Redis for session storage, so this needed no
    new infrastructure. Give me just the commit message for this -- I
    don't need any explanation of the routing rules, just the message
    itself.
expected:
  output_contains:
    - "pod restart"
    - "pod count"
    - "session storage"
  output_not_contains:
    - "LGTM"
