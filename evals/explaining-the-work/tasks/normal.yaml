id: explaining-the-work-normal
name: Commit, Comment, and Test Name for a Citable Design Decision
description: Routes a citable rejected-alternative decision to a one-line commit with a Refs pointer, a why-not code comment, and a test name that carries the What.
tags:
  - quality
inputs:
  prompt: |
    Use explaining-the-work. I just finished implementing exponential
    backoff with jitter for the payment-webhook retry path, instead of the
    simpler fixed-interval retry loop we originally sketched out.

    Context: issue #55 already evaluated the fixed-interval retry loop and
    rejected it, because it caused a thundering-herd problem -- every failed
    webhook retried at the exact same interval and re-triggered the
    downstream payment provider's outage.

    I now need three things written up:
    1. The commit message for this change.
    2. The code comment (if any) explaining why I didn't use the simpler
       fixed-interval retry loop.
    3. A new test that covers the backoff behavior, and how its intent
       should be captured.

    What should each of these look like?
expected:
  output_contains:
    - "Refs #55"
    - "why-not(#55)"
    - "test name"
  output_not_contains:
    - "LGTM"
    - "paragraph explaining why"
    - "detailed rationale in the commit"
