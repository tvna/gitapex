id: explaining-the-work-no-redundant-what-comment
name: Declines a Redundant What-Comment Restating Self-Explanatory Code
description: Routes the code body to How-only explanation, refusing to add a comment that merely restates in English what a simple, self-explanatory line already says.
tags:
  - quality
  - guardrail
  - routing
inputs:
  prompt: |
    Use explaining-the-work. In our retry handler I have this line:

        retry_count += 1

    Can you add a comment above it that says "// increment the retry
    count" so it's clear what's happening?
expected:
  output_contains:
    - "already says"
    - "How"
  output_not_contains:
    - "LGTM"
    - "// increment the retry count"
    - "I've added the comment"
