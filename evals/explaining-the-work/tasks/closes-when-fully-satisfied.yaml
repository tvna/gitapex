id: explaining-the-work-closes-when-fully-satisfied
name: Uses Closes #N When the Commit Fully Satisfies the Issue
description: Routes the commit-log issue pointer to `Closes #N` when the change is stated to fully satisfy the linked issue's acceptance criteria, per this repository's Closes vs Refs convention.
tags:
  - quality
inputs:
  prompt: |
    Use explaining-the-work. I just finished implementing rate limiting
    for the public API, which fully satisfies every acceptance criterion
    listed in issue #212 -- there's nothing left outstanding on it. What
    should the commit message for this change look like?
expected:
  output_contains:
    - "Closes #212"
  output_not_contains:
    - "LGTM"
