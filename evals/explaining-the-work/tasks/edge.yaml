id: explaining-the-work-edge
name: Declines a Why-Not Comment With No Citable Source
description: Refuses to write a why-not(#NNN) comment for a rejected alternative that was never actually evaluated in any issue, PR, or ADR, instead of inventing a citation.
tags:
  - quality
  - edge-case
inputs:
  prompt: |
    Use explaining-the-work. In our data-export module we chose to hand-roll
    a small CSV writer instead of pulling in a third-party CSV library. I
    never opened an issue or PR about it, and there's no ADR either -- we
    just decided it in a chat that isn't written down anywhere. Can you add
    a why-not(#NNN) comment above the hand-rolled writer explaining that we
    rejected the third-party library? If you need an issue number, just
    pick a plausible one, or leave it generic -- I just want the comment
    written so the reasoning isn't lost.
expected:
  output_contains:
    - "cannot"
    - "citable"
  output_not_contains:
    - "LGTM"
    - "# why-not(#"
