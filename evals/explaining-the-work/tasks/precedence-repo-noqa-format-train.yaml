id: explaining-the-work-precedence-repo-noqa-format-train
name: Repo's Deterministic noqa Contract Takes Precedence Over why-not Template
description: Defers to the calling repository's own deterministic noqa Contract-block format instead of forcing the why-not(#NNN) template onto a suppressed-warning comment, per this skill's Precedence rule.
tags:
  - quality
  - precedence
inputs:
  prompt: |
    Use explaining-the-work. Our repo's CI lints every suppressed warning
    and enforces an exact `Contract:` block format for it -- every
    suppression comment must read `# noqa: <reason>` on the same line as
    the suppressed code, checked by our lint step. I need to suppress a
    false-positive unused-import warning on this line and explain why
    it's not actually unused. Should this be a why-not(#NNN) comment per
    explaining-the-work, or the repo's noqa format?
expected:
  output_contains:
    - "precedence"
    - "noqa"
  output_not_contains:
    - "LGTM"
