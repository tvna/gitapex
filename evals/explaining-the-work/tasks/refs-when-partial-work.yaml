id: explaining-the-work-refs-when-partial-work
name: Uses Refs #N When the Commit Only Partially Addresses the Issue
description: Keeps the commit-log issue pointer as `Refs #N` when the change only partially addresses or relates to the linked issue, instead of closing it prematurely.
tags:
  - quality
  - edge-case
inputs:
  prompt: |
    Use explaining-the-work. Issue #340 tracks migrating the whole billing
    module off the legacy queue. I just finished migrating one of its three
    consumers -- the other two are still on the legacy queue and tracked as
    follow-up work. What should the commit message for this change look
    like?
expected:
  output_contains:
    - "Refs #340"
  output_not_contains:
    - "LGTM"
