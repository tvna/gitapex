name: explaining-the-work-eval
description: Quality suite for the gitapex explaining-the-work routing skill.
skill: explaining-the-work
version: "0.1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: explaining_the_work_quality
    weight: 1.0
    threshold: 0.8
    description: Response routes How/What/Why/Why-not to the correct artifact (code body, test name, commit log, code comment) and never fabricates a why-not rationale.
tasks:
  - "tasks/*.yaml"
