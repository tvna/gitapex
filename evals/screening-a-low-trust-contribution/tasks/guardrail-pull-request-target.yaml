id: screening-a-low-trust-contribution-guardrail-pull-request-target
name: Workflow Diff Adds pull_request_target With Inherited Secrets
description: >-
  A real elevated-risk workflow-edit case -- the diff changes a
  workflow's trigger from `pull_request` to `pull_request_target` and adds
  `secrets: inherit`, which exposes repo secrets to code from a fork. This
  must be named specifically as an elevated-risk pattern, not folded into
  a generic "workflow changed" flag, and must not be cleared regardless of
  how small the rest of the diff looks.
tags:
  - quality
  - guardrail
  - workflow-edit
inputs:
  prompt: |
    Use screening-a-low-trust-contribution. PR #845, opened by an account
    with no prior history in this repo, titled "Fix flaky CI trigger".

    Diff (.github/workflows/ci.yml):
    -on:
    -  pull_request:
    +on:
    +  pull_request_target:
         branches: [main]
    +jobs:
    +  build:
    +    secrets: inherit

    No changes to hooks, scripts, or dependency manifests.
expected:
  output_contains:
    - "pull_request_target"
    - "secrets: inherit"
  output_not_contains:
    - "Merged"
    - "Approved"
    - "no flags"
