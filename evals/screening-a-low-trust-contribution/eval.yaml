name: screening-a-low-trust-contribution-eval
description: Quality suite for the gitapex screening-a-low-trust-contribution skill.
skill: screening-a-low-trust-contribution
version: "0.1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: screening_a_low_trust_contribution_quality
    weight: 1.0
    threshold: 0.8
    description: Flags workflow-file edits, hook/script changes, dependency additions (including transitive), typosquats, and instruction-bearing files; never merges/closes/rejects itself, and never clears a flagged diff just because the surrounding PR looks reasonable.
tasks:
  - "tasks/*.yaml"
