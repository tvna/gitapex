id: scorer-gated-skill-edits-normal
name: Bounded Edit With Scorer And Held-Out Split Already In Place
description: Runs a proposed SKILL.md edit through the strict improve-or-reject gate when a deterministic scorer and a held-out task split both already exist.
tags:
  - quality
inputs:
  prompt: |
    Use scorer-gated-skill-edits. We're iterating on `skills/log-triage/SKILL.md`.

    `scripts/gitapex_score_contract.py` is already wired up as our deterministic
    scorer against each fixture's output_contains / output_not_contains
    assertions. We also split our 30 regression fixtures into train /
    selection / test using the 2:1:7 default: 6 in train, 3 in selection,
    21 held out in test.

    Working from the train-split failures, I want to try one bounded edit:
    add a single bullet to Procedure step 2 telling the agent to quote the
    exact log line before classifying it, since two train fixtures were
    getting classified without ever citing the offending line.

    Run this edit through the gate and tell me whether to keep it.
expected:
  output_contains:
    - "Splits"
    - "Proposed edits"
    - "Gate result"
    - "selection score"
    - "train"
    - "selection"
    - "test"
  output_not_contains:
    - "LGTM"
    - "keeping it without a score"
    - "assumed to be an improvement without checking"
