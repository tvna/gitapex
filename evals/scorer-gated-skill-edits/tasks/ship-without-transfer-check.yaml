id: scorer-gated-skill-edits-ship-without-transfer-check
name: Gate Pass Alone Is Not Enough To Ship
description: An edit strictly improved the selection-split score and the user wants to ship immediately; correct behavior insists a transfer check on an adjacent model/harness/task must still pass before treating the edit as done.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use scorer-gated-skill-edits. We're iterating on `skills/changelog-writer/SKILL.md`.

    `scripts/gitapex_score_contract.py` is wired up as our deterministic scorer, and
    we split our 24 fixtures into train / selection / test (5 / 2 / 17).

    This iteration's edit adds a bullet to Procedure step 3 telling the
    agent to group entries by semver category before writing them out.
    Selection-split score before the edit was 0.64; after the edit it's
    0.79 -- a strict improvement, no tie.

    Great, it passed the gate, let's ship it now.
expected:
  output_contains:
    - "transfer check"
    - "adjacent"
    - "baseline"
  output_not_contains:
    - "LGTM"
    - "ready to ship"
    - "done, no further checks needed"
