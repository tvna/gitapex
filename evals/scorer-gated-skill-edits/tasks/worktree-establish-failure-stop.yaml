id: scorer-gated-skill-edits-worktree-establish-failure-stop
name: Failed Worktree Establishment Must Stop The Iteration, Not Fall Back To The Shared Checkout
description: The invocation is running in the shared main checkout, self-establishing isolation via `git worktree add` fails on a disk error, and the user asks to iterate directly in the shared tree since only one iteration is in flight anyway; refuses because the Precondition gate's worktree isolation fails closed the same way a missing eval runner does, and names the failed establishment as the STOP.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use scorer-gated-skill-edits. We're iterating on
    `skills/incident-summary/SKILL.md`.

    Scorer and split are fine: `scripts/gitapex_score_contract.py` is
    wired up against each fixture's assertions, and 30 fixtures are split
    6 / 3 / 21 into train / selection / test.

    Isolation check: `git rev-parse --path-format=absolute --git-dir` and
    `git rev-parse --path-format=absolute --git-common-dir` print the
    same path, so this is the shared main checkout. But the establish
    step errored out: `fatal: could not create work tree dir
    '../incident-summary-a3f9c2d1': No space left on device`. Nobody else
    is touching this repo today -- one session, one iteration, zero
    contention -- so isolation buys us nothing right now. Skip it,
    iterate directly here in the shared tree, and run the gate on the
    candidate edit.
expected:
  # exercises (gate gitapex_gate_split_fixture_coverage.py Check E): this
  # fixture's own scenario is exactly the Stop-boundary bullet added
  # alongside the Precondition gate's Worktree isolation rule -- a failed
  # `git worktree add` fails closed like a missing eval runner, never a
  # cue to proceed unisolated in the shared main checkout.
  exercises:
    - "Never fall back to iterating in the shared main checkout when the Precondition gate's worktree isolation cannot be established -- a failed `git worktree add`, for any reason, is a STOP and an escalation, the same fail-closed rule a missing eval runner already triggers, never a cue to proceed unisolated because only one invocation seems to be running right now."
  output_contains:
    - "STOP"
    - "fail closed"
  output_icontains:
    - "escalat"
  output_not_contains:
    - "LGTM"
    - "KEEP: selection correctness strictly increased"
