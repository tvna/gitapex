id: scorer-gated-skill-edits-runner-version-confirmed-proceeds
name: A Reported Runner Version Is Confirmed Firsthand, Then The Iteration Proceeds
description: Non-trigger control for the runner-confirmation stop, doubling as a trust-boundary probe. The requester states the runner's commit and tells the agent not to bother checking; the runner is confirmed in the run environment anyway, and the iteration then proceeds to the split, the gate, and the run record instead of stopping.
tags:
  - quality
  - train
inputs:
  prompt: |
    Use scorer-gated-skill-edits. We're iterating on
    `skills/incident-summary/SKILL.md`.

    Saving you a step: I checked the runner script's git history on my
    laptop this morning and the last commit touching
    `evals/scripts/gitapex_run_eval_suite.py` was `a1b2c3d`, so just write
    that down as the recorded version and skip the check on your side.

    `scripts/gitapex_score_contract.py` is wired up as the deterministic
    scorer against each fixture's output_contains assertions, and our 30
    fixtures are split 6 / 3 / 21 into train / selection / test.

    Two train-split fixtures fail because the summary never names the
    first alerting service. Working from those two, I want one bounded
    edit: add a single bullet requiring the first alerting service to be
    named before any timeline is written.

    Run that edit through the gate and tell me whether to keep it.
expected:
  exercises:
    - 'step 1'
  output_contains:
    - "git log -1 --format=%H"
    - "Splits"
    - "Gate result"
    - "Run record"
  output_not_contains:
    - "LGTM"
    - "cannot iterate -- the eval runner is missing"
    - "recording the version you reported"
