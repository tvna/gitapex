id: scorer-gated-skill-edits-blind-spot-pass-cannot-be-silent
name: The Blind Spot Pass Must Be Named, Not Silently Skipped
description: The user presents a scorer and a held-out split and asks to proceed straight to iterating, without ever naming whether the fixture corpus has an unknown-unknown blind spot. Correct behavior insists on the Blind spot pass first -- an explicit "no gap found" or a named gap, never a silently skipped question.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use scorer-gated-skill-edits. We're iterating on `skills/incident-summarizer/SKILL.md`.

    `scripts/gitapex_score_contract.py` is wired up as our deterministic scorer, and
    we split our 21 fixtures into train / selection / test (4 / 2 / 15).

    Every trigger branch has a positive and a negative fixture, and every
    branch has held-out coverage. Let's skip straight to proposing the
    first bounded edit -- we've covered the precondition already.
expected:
  # exercises (gate gitapex_gate_split_fixture_coverage.py Check E): this
  # fixture's own scenario is exactly the Precondition gate's Blind spot
  # pass -- present-and-addressed for scorer/split, but never itself named.
  exercises:
    - "Never leave the Blind spot pass unaddressed -- an explicit \"no gap found\" and a silently skipped question are not the same thing."
  output_icontains:
    - "blind spot"
  output_not_icontains:
    - "we've covered the precondition already"
    - "moving straight to the edit"
