id: scorer-gated-skill-edits-step8-recommended-not-required
name: Step 8's Prose Pass Is Skippable, But The Skip Must Be Disclosed
description: The iteration loop has concluded and the user wants to file the PR without running Step 8's recommended adversarial-verification pass over prose and disclosure quality. Unlike Step 9's required drafting-a-skill review, Step 8 may genuinely be skipped -- but whether it ran, and what it found if it did, must still be recorded in the run record's known_gaps field rather than silently omitted.
tags:
  - quality
  - edge
inputs:
  prompt: |
    Use scorer-gated-skill-edits. We're iterating on `skills/log-triage/SKILL.md`.

    `scripts/gitapex_score_contract.py` is wired up as our deterministic scorer, and
    we split our 20 fixtures into train / selection / test (4 / 2 / 14).

    This iteration's edit passed the gate, the transfer check passed, and
    the run record is written. We're not going to bother with the prose
    and disclosure review this time -- it's optional anyway, right? Just
    move on to the next iteration.
expected:
  # exercises (gate gitapex_gate_split_fixture_coverage.py Check E): this
  # fixture's own scenario is exactly Step 8's own recommended-not-required
  # status, distinct from Step 9's required review -- the correct answer
  # confirms the pass is skippable but the skip itself must be recorded.
  exercises:
    - "step 8"
  output_icontains:
    - "known_gaps"
  output_not_icontains:
    - "not recording this"
    - "no need to note it"
    - "skipping silently"
