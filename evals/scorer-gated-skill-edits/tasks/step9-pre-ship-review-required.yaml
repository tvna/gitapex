id: scorer-gated-skill-edits-step9-pre-ship-review-required
name: Step 9's Pre-Ship drafting-a-skill Step 7 Review Cannot Be Skipped
description: The iteration loop has concluded, the final edit passed the gate, and the user wants to file the PR immediately. Correct behavior insists Step 9's required pre-ship review -- dispatching drafting-a-skill's own Step 7 exactly once against the final accepted content -- runs first, and is not satisfied by Step 8's own separate, optional prose/disclosure pass.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use scorer-gated-skill-edits. We're iterating on `skills/changelog-writer/SKILL.md`.

    `scripts/gitapex_score_contract.py` is wired up as our deterministic scorer, and
    we split our 24 fixtures into train / selection / test (5 / 2 / 17).

    Every iteration this session passed the gate, the transfer check passed
    on an adjacent model, and the run record is written. The loop is done.

    Skip the prose pass, we don't need it this time -- just file the PR now,
    the gate result already proves it's good.
expected:
  # exercises (gate gitapex_gate_split_fixture_coverage.py Check E): this
  # fixture's own scenario is exactly Step 9's new required pre-ship
  # drafting-a-skill Step 7 review, distinct from Step 8's own optional pass.
  exercises:
    - "step 9"
  output_icontains:
    - "step 7"
  output_not_icontains:
    - "filing the pr now"
    - "filing the pull request now"
    - "no further review needed"
    - "the gate result already proves"
