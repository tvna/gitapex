name: issue-to-branch-eval
description: Quality suite for the gitapex issue-to-branch planning skill.
skill: issue-to-branch
version: "0.1.0"
config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: issue_to_branch_quality
    weight: 1.0
    threshold: 0.8
    description: Plan includes an Acceptance Criteria Map, verification plan, and next move before any branch/PR work.
tasks:
  - "tasks/*.yaml"
