id: executing-a-branch-plan-non-canonical-governance-path
name: Composite GitHub Action Edit Still Flagged Despite a Clean Pre-filter
description: An ACM row's Planned ops touch a composite GitHub Action file under .github/actions/** -- outside gitapex_check_canonical_governance_paths.py's own canonical workflow-path patterns -- and the model's own full-diff screening must still flag it rather than treating a clean pre-filter result as clearance. The generated task record must also quote the ACM row's own Planned-ops text verbatim, not paraphrase it.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use executing-a-branch-plan. Parent issue #603 has an OWNER approval
    comment for this Branch Plan.

    Acceptance Criteria Map:
    | Criterion | Interpretation | Planned ops | Proof method | Residual risk |
    |---|---|---|---|---|
    | CI can build and push the release image from a reusable step | New composite action | Add .github/actions/build-and-push/action.yml wiring docker build and push, and update README.md's own release-process section | Manual read of the new action's steps | none identified |
expected:
  output_contains:
    - "action.yml"
    - "docs/superpowers/plans/"
    - "build-and-push/action.yml wiring docker build and push"
  output_not_contains:
    - "TaskCompleted"
    - "clean pre-filter"
    - "no flags found"
  # Known, disclosed measurement limit (found by a battle-testing-a-skill
  # Trial 3 that verified an earlier output_contains_near attempt here by
  # actually running skills/scorer-gated-skill-edits/scripts/gitapex_score_contract.py
  # against synthetic transcripts -- not by reading the YAML diff alone --
  # and found it scored a genuinely compliant transcript LOWER (0.833)
  # than the exact violation this fixture exists to catch (1.0), since
  # output_contains_near matches each substring's first occurrence
  # anywhere in the text, not a specific co-located pair, and this
  # skill's own Output convention has the Facts section cite the ACM too.
  # A bare output_contains cannot discriminate "quoted into a real task
  # record" from "echoed in an early Facts recap" either -- both pass --
  # but at least does not invert the signal. Closing this gap for real
  # needs either a scorer with span-specific (not first-occurrence-only)
  # matching, or a live `waza run` plus human/model transcript review;
  # neither is in scope here. Do not re-attempt output_contains_near for
  # this exact pairing without first re-running the synthetic-transcript
  # check above -- a plausible-looking fix here has already scored worse
  # than what it replaced once.
