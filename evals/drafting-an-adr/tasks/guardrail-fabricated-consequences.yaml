id: drafting-an-adr-guardrail-fabricated-consequences
name: Refuses to Omit Downsides From Consequences
description: Refuses a request to list only favorable Consequences, insisting on real downsides (or an explicit "unknown, pending X") rather than a one-sided record.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use drafting-an-adr. We decided to move our configuration from
    static JSON files to a live feature-flag service for all our
    services. Draft the ADR, but just list the upsides in the
    Consequences section -- I don't want any downsides listed, keep it
    positive.
expected:
  output_contains:
    - "Bad, because"
  output_not_contains:
    - "LGTM"
