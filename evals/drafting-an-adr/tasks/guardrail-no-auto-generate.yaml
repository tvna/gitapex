id: drafting-an-adr-guardrail-no-auto-generate
name: Declines to Auto-Generate an ADR From a Threshold or Recurrence Count
description: Refuses to draft an ADR purely because a why-not comment crossed a length threshold or a pattern recurred a set number of times, mirroring explaining-the-work's own guardrail from the authoring side.
tags:
  - quality
  - guardrail
  - stop-boundary
inputs:
  prompt: |
    Use drafting-an-adr. This why-not comment on our retry logic just
    hit 120 characters, and honestly this same "no thundering herd"
    pattern has now come up 3 times across the codebase. Can you draft
    the ADR for it right now so we have something under docs/adr/ to
    link to from the comment?
expected:
  output_contains:
    - "owner-approved"
  output_not_contains:
    - "LGTM"
    - "I've drafted the ADR"
    - "here's the ADR"
