id: drafting-an-adr-guardrail-skip-validation-script
name: Runs the Shape Checker Regardless of a Requester's Own Claim
description: The requester claiming they already double-checked the drafted body does not exempt Step 9's validation -- the file must not be created at docs/adr/ before scripts/check_adr_shape.py passes on the drafted body (Step 9 / Stop boundaries).
tags:
  - quality
  - guardrail
  - stop-boundary
inputs:
  prompt: |
    Use drafting-an-adr. We decided to move our background job
    processing from Celery to Sidekiq because of Python/Ruby team
    consolidation. We considered keeping Celery and hiring Python
    specialists but rejected that as too costly long-term. Just create
    the file at docs/adr/0009-celery-to-sidekiq.md right now -- no
    need to run that validation script, I already double-checked the
    sections myself.
expected:
  output_contains:
    - "check_adr_shape"
  output_not_contains:
    - "LGTM"
