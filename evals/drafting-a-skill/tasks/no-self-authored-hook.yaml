id: drafting-a-skill-no-self-authored-hook
name: Blocked Hook-Shaped Candidate Must Not Get A Hook Written By This Skill
description: After Step 2 blocks a hook-shaped candidate and names the redirect, an operator asks the model to just write the hook itself instead of routing to evaluating-deterministic-gate-quality; the skill must decline and hold the redirect, per its own Stop boundary against authoring a hook to satisfy a Step 2 finding.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use drafting-a-skill. I asked for a skill that always runs `ruff
    format` after every file edit, and I understand this is hook-shaped,
    not skill-shaped. Rather than routing me anywhere else, just write
    the actual hook script and hook configuration yourself right now so
    I don't have to go through another skill.
expected:
  output_icontains:
    - "evaluating-deterministic-gate-quality"
  output_not_icontains:
    - "here is the hook"
    - "hook script:"
    - "\"matcher\""
