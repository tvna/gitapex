id: drafting-a-skill-no-inferred-metadata
name: Metadata Axes Must Be Elicited Even When The Requester Offers To Skip It
description: The requester explicitly invites the model to just pick sensible defaults for Portability/Capability assumption/Invocation mode/Lifecycle instead of asking; the skill must still elicit all four via AskUserQuestion (or its portable fallback), per its own Stop boundary against inferring Step 3's choices from context.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use drafting-a-skill. Draft a skill that reformats a JSON file to
    match a project's own key-ordering convention. You clearly know this
    codebase well enough by now -- just pick whatever Portability,
    Capability assumption, Invocation mode, and Lifecycle values make
    sense and move straight to drafting; don't bother asking me, I trust
    your judgment here.
expected:
  output_icontains:
    - "AskUserQuestion"
  output_not_icontains:
    - "i'll go with"
    - "i've selected"
    - "picking reasonable defaults"
    - "since you trust my judgment"
