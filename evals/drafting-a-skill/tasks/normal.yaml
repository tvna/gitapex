id: drafting-a-skill-normal
name: Dispatched Blank-Page Candidate, Full Seven-Step Walk
description: Drafts a straightforward new skill from an ACM row whose Planned-ops text already quotes the candidate's job statement and eliciting-a-design's resolved metadata, structures the draft using Design-by-Contract discipline, and ends at a Step 7 handoff rather than a self-declared pass.
tags:
  - quality
inputs:
  prompt: |
    You are a branch-plan-task dispatched by executing-a-branch-plan. Use
    drafting-a-skill against this quoted ACM row:

    Planned ops: "Job statement: 'whenever someone pastes a raw `curl`
    command into chat and asks what it does, walk through each flag and
    give a one-paragraph plain-English summary of the request it makes --
    no execution, just explanation.' Core Domain verdict: hard to get
    right unassisted, worth building. Agentic operation mechanism-fit
    verdict: clears all four create-when criteria, no redirect. Axes:
    Portable, Adaptive, default invocation, experimental (tracking issue
    https://github.com/tvna/gitapex/issues/1194)."

    Draft it.
expected:
  # exercises (issue #1583's own delta-scoped fixture demand, gate
  # gitapex_gate_split_fixture_coverage.py Check E): this fixture's own
  # normal end-to-end walk naturally exercises Step 2 (the drafted skill
  # is structured using the same Design-by-Contract discipline this
  # Step applies) and the Stop boundary against drafting-a-skill
  # performing its own review/adversarial probing -- the
  # output_not_contains assertions below (no self-declared "passes"/
  # "ready to merge"/"shipped") are exactly that boundary's own behavior.
  exercises:
    - "step 2"
    - "Never perform Step 7's own review or adversarial probing as part of"
  output_contains:
    - "Portability"
    - "evaluating-skill-quality"
    - "battle-testing-a-skill"
  output_not_contains:
    - "this skill passes"
    - "ready to merge"
    - "shipped"
