id: drafting-a-skill-normal
name: Clear Blank-Page Candidate, Full Ten-Step Walk
description: Drafts a straightforward new skill from a one-sentence job description, gating on Mechanism fit, eliciting metadata rather than inferring it, and ending at a Step 10 handoff rather than a self-declared pass.
tags:
  - quality
inputs:
  prompt: |
    Use drafting-a-skill. I want a new skill: whenever someone pastes a
    raw `curl` command into chat and asks "what does this do," walk
    through each flag and give a one-paragraph plain-English summary of
    the request it makes -- no execution, just explanation. Draft it.
expected:
  # exercises (issue #1583's own delta-scoped fixture demand, gate
  # gitapex_gate_split_fixture_coverage.py Check E): this fixture's own
  # normal end-to-end walk naturally exercises Step 4 (the drafted skill
  # is structured using the same Design-by-Contract discipline this
  # Step now applies conditionally) and the Stop boundary against
  # drafting-a-skill performing its own review/adversarial probing --
  # the output_not_contains assertions below (no self-declared "passes"/
  # "ready to merge"/"shipped") are exactly that boundary's own behavior.
  exercises:
    - "step 4"
    - "Never perform Step 10's own review or adversarial probing as part of"
  output_contains:
    - "Mechanism"
    - "Portability"
    - "evaluating-skill-quality"
    - "battle-testing-a-skill"
  output_not_contains:
    - "this skill passes"
    - "ready to merge"
    - "shipped"
