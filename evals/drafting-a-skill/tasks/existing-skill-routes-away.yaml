id: drafting-a-skill-existing-skill-routes-away
name: A Request To Improve An Existing Skill Must Route To scorer-gated-skill-edits, Not Loop Here
description: The Precondition's own route-away branch -- the target is not a blank page but an existing skill the requester wants improved; drafting-a-skill must not treat this as Step 1 of a fresh draft or attempt its own iterative editing, and must not loop back into that shape once told the target already exists (Postcondition and its own Stop boundary against continuing as scorer-gated-skill-edits).
tags:
  - quality
  - edge
inputs:
  prompt: |
    Use drafting-a-skill. The existing `scanning-leaked-secrets` skill
    already exists in this repository -- I want you to improve its
    description and tighten its Steps. Walk through your normal
    procedure and draft the improved version.
expected:
  # NOTE (issue #1648, Task A citation-sync only -- Task C owns this
  # fixture's own file and its real semantic re-verification per that
  # issue's Branch Plan): drafting-a-skill's Precondition no longer
  # routes an existing-skill edit request away to scorer-gated-skill-edits
  # at all -- that routing-away bullet was removed outright, and this
  # fixture's own scenario/output_icontains below assert exactly the
  # behavior the redivision removes. This citation is updated only so
  # Check E (exercises-label resolution) stays green; the scenario and
  # output_icontains/output_not_icontains assertions below are stale and
  # need Task C's own update-or-retire judgment, not settled here.
  exercises:
    - "Never treat this skill as itself the scorer-gated iterative-editing loop -- the held-out-split gate and its own measured accept/reject decision stay `scorer-gated-skill-edits`'s own job; this skill only authors one iteration's bounded patch when explicitly dispatched from that skill's own Step 3 (see Precondition), never a loop this skill initiates or continues on its own."
  output_icontains:
    - "scorer-gated-skill-edits"
  output_not_icontains:
    - "step 1: capture"
    - "mechanism-fit gate"
    - "cohesion self-check"
