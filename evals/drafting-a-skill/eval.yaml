name: drafting-a-skill-eval
description: Quality suite for the gitapex drafting-a-skill pipeline-only skill-authoring task.
skill: drafting-a-skill
version: "0.1.0"
config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5
metrics:
  - name: drafting_a_skill_quality
    weight: 1.0
    threshold: 0.8
    description: Refuses standalone invocation and redirects to eliciting-a-design instead, drafts only when dispatched with an ACM row's already-resolved metadata (never re-eliciting or overriding it), uses Design-by-Contract structure, treats the cohesion and domain-gap self-checks as advisory rather than authoritative, hands off to evaluating-skill-quality and battle-testing-a-skill without performing either review itself, and escalates rather than loops or self-fixes an upstream-ambiguity-rooted finding.
tasks:
  - "tasks/*.yaml"
