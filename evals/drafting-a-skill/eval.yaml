name: drafting-a-skill-eval
description: Quality suite for the gitapex drafting-a-skill blank-page skill-authoring skill.
skill: drafting-a-skill
version: "0.1.0"
config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5
metrics:
  - name: drafting_a_skill_quality
    weight: 1.0
    threshold: 0.8
    description: Gates on Mechanism fit before drafting, elicits every metadata choice rather than inferring it, drafts using Design-by-Contract structure, treats the cohesion and domain-gap self-checks as advisory rather than authoritative, and hands off to evaluating-skill-quality and battle-testing-a-skill without performing either review itself.
tasks:
  - "tasks/*.yaml"
