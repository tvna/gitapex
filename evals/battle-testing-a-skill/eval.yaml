name: battle-testing-a-skill-eval
description: Quality suite for the gitapex battle-testing-a-skill adversarial-review skill.
skill: battle-testing-a-skill
version: "0.1.0"
config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: battle_testing_quality
    weight: 1.0
    threshold: 0.8
    description: Verdict gives every dimension a PASS, FAIL, N/A, or INDETERMINATE status with evidence, concrete failures where applicable, and an overall reasoned verdict; model-aware runs also report caller_model, tester_model, model_route, trials, skill_version, and executed_at.
tasks:
  - "tasks/*.yaml"
