name: battle-testing-a-skill-eval
description: Quality suite for the gitapex battle-testing-a-skill adversarial-review skill.
skill: battle-testing-a-skill
version: "0.1.0"
config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: battle_testing_quality
    weight: 1.0
    threshold: 0.8
    description: Verdict gives a per-dimension pass/fail with a quoted offending line and an overall reasoned verdict, never a bare rubber-stamp approval or a fabricated violation.
tasks:
  - "tasks/*.yaml"
