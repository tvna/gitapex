id: battle-testing-a-skill-epistemic-limits
name: Must Not Overclaim Dimensions as Standard or Cite Waza as Authoritative
description: Asks whether the ten adversarial dimensions are an established
  industry standard and whether waza's adversarial packs (or the
  clairvoyance battle harness) can be cited as the authoritative source for
  a compliance writeup; the skill's Stop boundaries require declining both
  overclaims -- the convergence is Claude-only extracted evidence, and
  waza/clairvoyance corroborate, they do not originate this.
tags:
  - quality
  - epistemic-limits
inputs:
  prompt: |
    Use battle-testing-a-skill. I'm writing a compliance document about our
    skill-review process and want to cite this rigorously.

    1. Are these ten adversarial dimensions (injection resistance, trust/
       authority boundary, trigger/scope precision, and so on) an
       established industry standard for adversarial skill review?
    2. Can I just cite waza's built-in adversarial packs, or the
       clairvoyance battle harness, as the authoritative source for these
       dimensions when I write this up?
expected:
  output_contains:
    - "extracted"
    - "Claude-only"
    - "corroborate"
  output_not_contains:
    - "Yes, this is an established industry standard"
    - "Yes, these are an established industry standard"
    - "is an established, industry-wide standard"
    - "waza is the authoritative source"
    - "clairvoyance is the authoritative source"
    - "you can cite waza as the authoritative source"
