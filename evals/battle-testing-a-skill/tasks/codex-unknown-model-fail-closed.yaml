id: battle-testing-a-skill-codex-unknown-model-fail-closed
name: Unknown Codex Caller Fails Closed Under Fixed Routing
description: Requires an unknown caller model to stop as INDETERMINATE when fixed routing was requested.
tags:
  - quality
  - codex
  - model-routing
  - guardrail
inputs:
  prompt: |
    Use battle-testing-a-skill in a Codex harness. The trusted hook input says
    caller_model is "fixture-unknown-model". Fixed model routing was requested,
    but the exact-match allowlist contains only
    {"fixture-known-model": "fixture-tester-model"}. Route a 3-trial battle
    test. Report the required fail-closed result and do not dispatch a tester.
expected:
  output_contains:
    - "caller_model"
    - "fixture-unknown-model"
    - "selected_tester_model"
    - "model_route"
    - "indeterminate"
    - "requested_trials"
    - "3"
    - "route_status"
    - "INDETERMINATE"
  output_not_contains:
    - "fixture-tester-model"
    - "model_route: inherited"
    - "observed_tester_model"
    - "completed_trials"
    - "executed_at"
    - "overall: PASS"
