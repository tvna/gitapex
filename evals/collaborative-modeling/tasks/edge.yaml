id: collaborative-modeling-scenario-casting-not-for-focused-ideas
name: Scenario Casting Convergence Only Fires For A Genuinely Diffuse Idea
description: An already-focused, single-requester idea goes straight into the normal one-at-a-time clarifying questions; Scenario Casting's fragment/prioritize/combine convergence pattern is reserved for a diffuse idea unscoped across many stakeholders, not applied by default.
tags:
  - quality
  - edge-case
inputs:
  prompt: |
    Use collaborative-modeling. I'm the only stakeholder here. I want to
    add a "dark mode" toggle to our app's settings screen. That's the
    whole idea -- it's not diffuse, nobody else has competing opinions
    about what this even means, and there's no large group of
    stakeholders involved.

    Let's start.
expected:
  output_not_contains:
    - "Orientation Scenario"
    - "Scenario Backlog"
    - "gather scenario fragments"
