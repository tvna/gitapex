name: driving-pr-to-merge-eval
description: Quality suite for the gitapex driving-pr-to-merge skill.
skill: driving-pr-to-merge
version: "0.1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: driving_pr_to_merge_quality
    weight: 1.0
    threshold: 0.8
    description: Response follows fix -> push -> resolve_review_thread -> mergeable_state check -> dispatch in order, never declaring a PR done from CI or "LGTM" alone.
tasks:
  - "tasks/*.yaml"
