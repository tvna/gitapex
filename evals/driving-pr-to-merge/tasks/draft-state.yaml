id: driving-pr-to-merge-draft-state
name: Mergeable State "draft" Is A Process State, Not A Defect
description: When mergeable_state reads "draft", escalates to the owner per step 8 as a process state rather than hunting for a code or review defect to fix.
tags:
  - quality
  - edge-case
inputs:
  prompt: |
    Use driving-pr-to-merge. PR #88, "Refactor auth token validation," has
    every CI check passing and no open review threads. Calling
    github:pull_request_read method get on PR #88 reports mergeable_state:
    "draft" -- the PR was opened as a draft and no one has converted it to
    a regular pull request yet.

    What should happen next?
expected:
  output_contains:
    - "escalate"
    - "process state"
    - "owner"
  output_not_contains:
    - "loop back to step 2"
    - "must be a defect"
    - "hunt for what's broken"
