id: evaluating-deterministic-gate-quality-contract-role-invariant-open-threat-domain
name: A scheduled sweep asserting a property of the whole tree is an invariant whose open threat category is correctly non-exhaustive
description: >-
  The positive case for the Contract role axis's invariant branch,
  paired with an open threat/safety category that is correctly left
  non-exhaustive. The check is bound to no single operation and no caller --
  it runs on a schedule over whatever state exists at that moment -- so a
  violation attributes fault to the state itself rather than to a caller or
  a routine. Its input is a safety judgment about what counts as a sensitive
  value, and it is written open: named examples plus a default-in-scope rule
  for an unlisted shape, which is the direction that removes the
  enumeration gap instead of narrowing it. The second of the two fixtures
  the axis must not misfire on, from the opposite side of its sibling: a
  reviewer that reads any enumeration as a closed list reports a defect that
  is not there, and now must say so explicitly ("correctly open") rather
  than merely naming the domain kind, closing the gap a review round found
  in this fixture's own earlier version, where the domain label alone was
  enough to pass regardless of whether the closure conclusion drawn from it
  was right. Same disclosed substring-scorer ceiling as its siblings.
tags:
  - quality
  - contract-role
  - input-domain-closure
inputs:
  prompt: |
    Use evaluating-deterministic-gate-quality. Review this gate.

    A CI job step, read directly from its own workflow file and the script
    it calls. It runs on a nightly schedule, not on a push or a pull
    request, and it is attached to no particular operation: it walks every
    tracked file in the repository and fails the run when it finds a
    sensitive value committed in the clear.

    The script's own module docstring, quoted directly:

        The patterns below are non-exhaustive instances of one category,
        not a closed allowlist. A value that looks like a credential,
        token, key, or other secret is in scope by default even when no
        pattern here matches its shape; a reviewer who finds one must add
        it and treat the miss as a gap in this list, never as evidence the
        value was safe.

    The step's own failure output names the offending path and redacts the
    matched value.

    Apply the Contract role / input-domain closure axis. BEGIN your reply
    with exactly these two lines and nothing else on them:

    "Contract role:" followed by exactly one of precondition, postcondition,
    invariant, mixed, or indeterminate.

    "Input domain:" followed by exactly one of structural-protocol,
    threat-classification, both-readings, or indeterminate, then " -- " and
    exactly one of "correctly closed", "wrongly closed", "correctly open",
    "wrongly open", or "indeterminate" naming whether this specific gate's
    own closure choice is right or wrong for that domain kind.

    Leave a blank line after those two lines before anything else.

    Then say who a violation of this check attributes fault to, and why the
    closure direction you named is right or wrong here.
expected:
  output_contains_near:
    - all:
        - "Contract role"
        - "invariant"
      window: 60
    - all:
        - "Input domain"
        - "threat-classification"
        - "correctly open"
      window: 60
  output_not_contains_near:
    - all:
        - "Contract role"
        - "precondition"
      window: 60
    - all:
        - "Input domain"
        - "wrongly open"
      window: 60
