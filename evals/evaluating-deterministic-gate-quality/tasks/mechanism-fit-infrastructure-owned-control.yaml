id: evaluating-deterministic-gate-quality-mechanism-fit-infrastructure-owned-control
name: A signature policy the platform already makes impossible is infrastructure-owned, not a repository-authored gate's to own
description: The mechanism-fit test's second question (Gate vs.
  infrastructure-owned deterministic control) must be answered before domain
  placement is even reachable. Gate vs. no gate says a deterministic
  decision is warranted here -- the policy reproduces the same answer every
  time -- but the target's own already-inspected platform configuration
  removes the guarded path entirely, while the proposed CI job can only
  observe an unsigned commit after it has landed. Applying the
  impossible-vs-tedious test to each candidate owner names the
  infrastructure control as the policy's primary owner rather than
  proceeding to pick one of the four realization domains. The prompt asks
  for the outcome name on its own labelled line, and the assertions ban the
  competing outcome labels, so an inverted verdict cannot satisfy them by
  writing the right word inside its own negation.
tags:
  - quality
  - mechanism-fit
  - infrastructure-owned
inputs:
  prompt: |
    Use evaluating-deterministic-gate-quality. Review this proposed policy
    and the gate someone on the team wants to build for it.

    The policy: "no unsigned commit ever reaches this repository's default
    branch."

    The proposed gate, read directly from its own draft script: a CI job
    step that runs after a push has landed on the default branch, walks the
    newly added commits, and fails the build when any of them carries no
    verified signature. The draft is competently written -- it exits
    non-zero, it re-checks the branch name itself rather than trusting the
    trigger filter, and it ships with a test.

    Inspected directly on the hosting platform, not asserted by any
    document: the default branch already has branch protection enabled with
    required signatures turned on and an empty bypass list. The platform
    rejects the push itself, so an unsigned commit never reaches the branch
    for a later job to find.

    Which party should own this policy? Answer the mechanism-fit question
    that comes before domain placement, name the decision procedure you used
    to get there, and finish with a single line reading "Ownership:"
    followed by exactly one of this skill's own ownership outcome names.
expected:
  output_contains:
    - "Ownership: infrastructure-owned-control"
    - "impossible-vs-tedious"
  output_not_contains:
    - "Ownership: repository-authored-gate"
    - "Ownership: layered-both"
