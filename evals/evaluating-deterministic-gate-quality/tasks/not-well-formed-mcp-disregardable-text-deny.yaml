id: evaluating-deterministic-gate-quality-not-well-formed-mcp-disregardable-text-deny
name: MCP tool response that merely warns in text instead of returning a real tool error fails dimension 1
description: An MCP server's tool-call handler "denies" a disallowed
  file-delete by returning a successful tool response whose text body reads
  as a warning, rather than an actual tool error the calling agent cannot
  route around. This is dimension 1's MCP-domain failure mode -- a deny
  that surfaces only as disregardable text.
tags:
  - quality
  - deterministic-shape
inputs:
  prompt: |
    Use evaluating-deterministic-gate-quality. Review this gate.

    An MCP server's tool-call handler, read directly from its own code:
    when a proposed `delete_file` call targets a path outside the
    allowed scope, the handler does not raise a tool error or return a
    failure status -- it returns an ordinary successful tool response
    whose text content is the string "WARNING: this operation is not
    permitted, please do not proceed." The calling agent receives a
    normal successful result and is free to ignore the text and retry,
    proceed with a different tool, or otherwise route around it.

    Give me the verdict for dimension 1 on this gate.
expected:
  output_contains:
    - "not well-formed"
    - "disregardable text"
