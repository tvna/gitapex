id: scanning-attack-surfaces-hosting-surface-normal-github
name: GitHub repo, standard audit
description: Detects GitHub from the remote, loads only the GitHub checklist reference, and reports a per-item coverage breakdown rather than a single pass/fail verdict.
tags:
  - quality
inputs:
  prompt: |
    Use scanning-attack-surfaces. The remote is
    git@github.com:tvna/gitapex.git. Audit this repo's hosting-platform
    configuration surface.
expected:
  output_contains:
    - "Covered"
    - "Gap"
    - "#82"
    - "gitapex_scan_unpinned_actions"
    - "list_repository_collaborators"
  output_not_contains:
    - "audit passed"
    - "all green"
    - ".gitlab/"
