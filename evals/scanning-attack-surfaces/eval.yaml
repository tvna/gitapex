name: scanning-attack-surfaces-eval
description: Quality suite for the gitapex scanning-attack-surfaces review skill.
skill: scanning-attack-surfaces
version: "0.1.0"
config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5
metrics:
  - name: scanning_attack_surfaces_quality
    weight: 1.0
    threshold: 0.8
    description: 'In Mode A, issues a per-item exposure-minimal/exposure-excess
      verdict for each dependency relationship and a per-item
      privilege-minimal/privilege-excess verdict for each credential grant,
      citing the specific over-exposed field or over-broad scope, and applies
      the Applicability gate ("not applicable") rather than silently passing an
      artifact with zero dependency relationships and zero credentials. In Mode
      B, detects the platform, loads exactly one platform checklist, and reports
      every checklist item''s real coverage level (Covered/Partial/Gap) with Gap
      items cross-linked to #82, never upgrading a Gap to Covered. In both modes,
      never issues an aggregate "attack surface: OK" or "audit passed" verdict.'
tasks:
  - "tasks/*.yaml"
