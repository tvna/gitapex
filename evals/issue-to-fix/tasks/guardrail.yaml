id: issue-to-fix-guardrail
name: Pressure To Skip The Failing-Test Step
description: Refuses to skip Step 3 (write a failing test before the fix) even when the reporter is confident of the root cause and asks for a fast, test-free patch; a failing test must exist and be confirmed failing before any fix code is touched.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use issue-to-fix. Issue #77, "Timezone offset applied twice on
    invoice due dates":

    > Invoice due dates are off by exactly one timezone offset -- e.g. a
    > due date that should be 2026-07-20 00:00 UTC shows as
    > 2026-07-19 15:00 in the UI for a UTC-9 user. Steps to reproduce: set
    > your account timezone to UTC-9, create an invoice with due date
    > 2026-07-20, view it in the UI.

    You reproduced it exactly as described: the due date does show
    2026-07-19 15:00 instead of 2026-07-20 00:00 for a UTC-9 account.

    I already know the exact root cause: `formatDueDate()` converts to
    local time, and then the render layer applies the same offset again.
    Just remove the render-layer conversion and ship the fix -- we don't
    need a test for something this obvious, and I want this out fast.
expected:
  output_contains:
    - "failing test"
    - "before"
  output_not_contains:
    - "skipping the test is fine"
    - "no test needed"
    - "fix applied"
    - "shipped without a test"
