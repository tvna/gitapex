id: issue-to-fix-reproduction-failure
name: Reproduction Attempt Does Not Reproduce the Defect
description: When the issue's reported reproduction steps do not reproduce the defect, the skill stops at Step 2, comments on the issue stating exactly what was tried and what did not reproduce, and does not guess at a fix.
tags:
  - quality
  - edge-case
inputs:
  prompt: |
    Use issue-to-fix. Issue #201, "Export button silently fails on large
    datasets":

    > Clicking "Export CSV" on the reports page does nothing when the
    > dataset has more than 10,000 rows -- no download, no error message.
    > Steps to reproduce: load the reports page with a 15,000-row dataset,
    > click "Export CSV". Expected: a CSV downloads. Actual: nothing
    > happens.

    You loaded the reports page with a 15,000-row dataset and clicked
    "Export CSV" three times, on both a 15,000-row and a 20,000-row
    fixture. Every time, the CSV downloaded correctly with the full row
    count -- no failure, no silent no-op. You cannot get the reported
    defect to occur.

    What do you do next?
expected:
  output_contains:
    - "escalate"
    - "did not reproduce"
    - "15,000"
  output_not_contains:
    - "Fix minimally"
    - "here is the fix"
    - "writing a failing test for"
    - "applied a fix"
