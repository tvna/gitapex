id: issue-to-fix-normal
name: Standard Reproduce-Test-Fix-Verify Cycle
description: A reported defect reproduces on the first attempt; the skill writes a failing test before touching the fix, applies a minimal fix, then verifies the test flips and the rest of the suite still passes.
tags:
  - quality
inputs:
  prompt: |
    Use issue-to-fix. Issue #142, "Search returns duplicate results when a
    query matches both title and body":

    > Searching for "release notes" returns the same document twice when
    > it matches both the title and the body. Steps to reproduce: seed the
    > index with one document whose title and body both contain "release
    > notes", then call GET /search?q=release+notes. Expected: the
    > document appears once. Actual: it appears twice in the results.

    You have a working checkout with the search service running locally.
    Take this from here.
expected:
  output_contains:
    - "reproduce"
    - "failing test"
    - "minimal"
    - "verify"
  output_not_contains:
    - "bug report"
    - "skip the test"
    - "fix first, test later"
