id: drafting-a-pr-to-merge-verdict-malformed-section-escalates
name: A Malformed Existing Verdict Section Escalates, Never Guessed Or Skipped
description: When Step 8 finds an existing "## Independent review verdict" section that is missing its own "Verified commit:" line (e.g. hand-authored, or left over from an earlier malfunction), it does not guess a SHA to archive under and does not silently skip archiving -- it escalates per step 11 instead, the same fail-closed default step 7's own unresolvable-state handling already uses.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use drafting-a-pr-to-merge. PR #944, "Add retry budget to the sync
    worker," has a `## Independent review verdict` section in its body,
    but it reads only:

    ```
    ## Independent review verdict
    - Verdict: CLEAN
    ```

    There is no `Verified commit:` line at all -- it looks like someone
    pasted this in by hand rather than it being written by this skill's
    own step 8. mergeable_state now reads "clean" and step 8 is about to
    run.

    Before recording a new verdict here, what should happen with this
    existing section?
expected:
  output_icontains:
    - "escalate"
  output_not_icontains:
    - "assume the sha"
    - "guess the sha"
    - "skip archiving and proceed"
    - "archive it anyway"
