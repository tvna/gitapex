id: grounding-in-primary-sources-verification-triage
name: The Decision-Critical Claim's Silence Is Not Folded Into The Same Speculation As The Topical Claims
description: A user-attributed changelog excerpt (not agent-verified) covers three minor claims topically; the fourth, explicitly the one the migration decision hinges on, is never mentioned in it at all. None of the four is agent-verified -- the excerpt is only a paste -- but the response must not treat the fourth the same as the other three. The excerpt's total silence on thread-safety is a stronger unknown than an on-topic-but-unverified claim, and must not be read as a grounded "not thread-safe," nor quietly folded into the same "the excerpt covers this" language that (still only provisionally) applies to the topical three.
tags:
  - quality
  - edge-case
inputs:
  prompt: |
    Use grounding-in-primary-sources.

    I fetched the official CHANGELOG.md for `dblib==5.0.0`:

    > ## 5.0.0
    > - Renamed: `Connection.execute` to `Connection.run`.
    > - Added: `timeout` argument on `Connection.run`.
    > - Deprecated: `Connection.execute` will be removed in 6.0.0.

    Before we migrate: (1) was `execute` renamed to `run`? (2) does `run`
    take a `timeout` argument? (3) is `execute` deprecated? (4) -- the one
    our migration decision actually hinges on -- is `Connection.run`
    thread-safe for our connection-pooling use case?
expected:
  output_contains:
    - "Speculation:"
    - "renamed"
    - "timeout"
    - "deprecated"
    - "6.0.0"
    - "thread-safe"
    - "connection-pooling"
  output_not_contains:
    - "Fact: `Connection.run` is thread-safe"
    - "Fact: Connection.run is thread-safe"
    - "Fact: `run` is thread-safe"
    - "Fact: `execute` was renamed to `run`"
    - "Fact: execute was renamed to run"
    - "Fact: `run` takes a `timeout` argument"
    - "Fact: run takes a timeout argument"
    - "Fact: `execute` is deprecated"
    - "Fact: execute is deprecated"
