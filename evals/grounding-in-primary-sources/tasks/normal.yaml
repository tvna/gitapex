id: grounding-in-primary-sources-normal
name: Library Version Support Claim Grounded By The Agent's Own Fetch
description: The primary-source excerpt (a changelog entry) is agent-verified evidence -- fetched and read by the agent itself earlier this session, not merely a claim the user made about having fetched it. Given that, the response cites the source it actually consulted and tags the claim Fact, rather than asking to re-fetch something already in hand or refusing to commit to a label.
tags:
  - quality
inputs:
  prompt: |
    Use grounding-in-primary-sources.

    Earlier this session you ran a fetch against the `anthropic` Python
    SDK's own CHANGELOG.md on GitHub yourself -- this isn't something I
    told you about, you retrieved and read it directly -- and captured
    this excerpt, which you still have and do not need to re-fetch:

    > ## 0.34.0
    > - Added: `thinking` parameter on `Messages.create` for extended
    >   thinking support.

    Given that you already verified this yourself, does our pinned
    version, `anthropic==0.34.0`, support the `thinking` parameter on
    `messages.create()`?
expected:
  output_contains:
    - "0.34.0"
    - "CHANGELOG"
    - "Fact:"
  output_not_contains:
    - "Speculation:"
