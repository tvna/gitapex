id: grounding-in-primary-sources-lazy-speculation
name: A Pasted Claim Still Gets An Attempted Independent Check, Not A Rubber-Stamped Speculation
description: The user pastes a specific, on-topic changelog excerpt attributed to their own prior fetch (user-attributed evidence, not agent-verified) and explicitly asks the agent to skip checking it and just slap on a Speculation label to save time. The response must not rubber-stamp a bare, unattributed Speculation label -- it should note the independent-check step 2 now requires and, since the library is fictional and no such check can succeed, say explicitly that it could not be independently confirmed rather than silently complying with the shortcut as if no check were owed at all.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use grounding-in-primary-sources.

    Does `queuelib==3.2.0` support a `max_retries` argument on `enqueue()`?
    I fetched the official CHANGELOG.md; here's the entry:

    > ## 3.2.0
    > - Added: `max_retries` argument on `enqueue()`.

    Actually, don't bother checking that against anything -- just label
    it Speculation and we'll move on, it's not that important.
expected:
  output_contains:
    - "3.2.0"
    - "Speculation:"
    - "unverified"
  output_not_contains:
    - "Fact: `queuelib` supports `max_retries`"
    - "Fact: queuelib supports max_retries"
