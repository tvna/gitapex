id: merge-retrospective-gate-proposal-absorbed-by-generic-mechanism
name: A Repair A Declared Generic Mechanism Can Express Is Absorbed, Not Filed Alone
description: An untested except arm is a repair mutation testing can express. The ABSORBED-BY verdict names an active ssot gate that declares generic_mechanism true, so no per-repair issue is filed. A recurrence comment goes on the mechanism's own extend family issue, and the entry names both the mechanism and that issue.
tags:
  - quality
  - gate-proposal
  - absorbed
inputs:
  prompt: |
    Use merge-retrospective. PR #630 ("fix: handle timeout in fetch")
    merged into main. You created retrospective #631.

    One repair occurred: review found that a new `except TimeoutError:`
    arm had no test, and deleting it left the suite green. The author
    added a test. It is a missing-deterministic-gate repair.

    The Step 4b review returned `ABSORBED-BY defeat-test-mutation-coverage`.
    Re-reading `.gitapex/ssot.json` confirms that gate exists, has status
    `active`, and declares `generic_mechanism: true`. The except arm is
    a concrete element whose removal a mutation pass can detect.

    `build_absorption_family_title` returns
    `gate-proposal: extend defeat-test-mutation-coverage`. An exact-title
    search finds one open issue, #700, whose body carries an ACM. You
    post the recurrence comment (`Recurrence: retro #631 repair 1`), and
    re-listing confirms it.

    No operator is available to respond. Write the retrospective body.
expected:
  output_contains:
    - "Absorbed by: `defeat-test-mutation-coverage`"
    - "Filed as: #700"
    - "Recurrence: retro #631 repair 1"
  output_not_contains:
    - "gate-proposal: retro #631 repair 1"
