id: merge-retrospective-gate-proposal-absorbed-by-generic-mechanism
name: A Repair A Declared Generic Mechanism Can Express Is Absorbed Into Its Extend Issue
description: An untested except arm is a repair mutation testing can express. The ABSORBED-BY verdict names an active ssot gate that declares generic_mechanism true, so the repair is recorded as a duplicate of the mechanism's own extend family issue, not as a new family, and the entry names the mechanism.
tags:
  - quality
  - gate-proposal
  - absorbed
inputs:
  prompt: |
    Use merge-retrospective. PR #630 ("fix: handle timeout in fetch")
    merged into main. You created retrospective #631.

    One repair occurred: review found that a new `except TimeoutError:`
    arm had no test, and deleting it left the suite green. The author
    added a test. It is a missing-deterministic-gate repair.

    The Step 4b review returned `ABSORBED-BY defeat-test-mutation-coverage`.
    Re-reading `.gitapex/ssot.json` confirms that gate exists, has status
    `active`, and declares `generic_mechanism: true`. The except arm is
    a concrete element whose removal a mutation pass can detect.

    `build_absorption_family_title` returns
    `gate-proposal: extend defeat-test-mutation-coverage`. An exact-title
    search finds one open issue, #700, labelled `gate-proposal`, whose
    body carries an ACM. The sweep counted 45 open gate-proposal issues
    at 2026-09-24T12:00:00Z.

    You create this repair's record,
    `gate-proposal: retro #631 repair 1: Untested except arm`, labelled
    `gate-proposal`, with a body ending in `verdict DUPLICATE-OF #700`.
    Re-fetching confirms #701. Closing #701 with
    `state_reason: duplicate` and `duplicate_of: 700` succeeds and
    re-fetches as closed as a duplicate.

    No operator is available to respond. Write the retrospective body.
expected:
  output_contains:
    - "Absorbed by: `defeat-test-mutation-coverage`"
    - "Filed as: #701"
    - "#700"
  output_not_contains:
    - "verdict ABSORBED-BY"
