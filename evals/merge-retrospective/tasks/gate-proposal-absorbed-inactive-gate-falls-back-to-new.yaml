id: merge-retrospective-gate-proposal-absorbed-inactive-gate-falls-back-to-new
name: ABSORBED-BY Naming A Declared But Deprecated Gate Falls Back To NEW
description: The review's ABSORBED-BY verdict names a gate that declares generic_mechanism true but whose status is deprecated. Verification outside the dispatch rejects it because only an active gate can absorb, and the repair files through the NEW flow with no Absorbed by line.
tags:
  - quality
  - gate-proposal
  - absorbed
  - restraint
inputs:
  prompt: |
    Use merge-retrospective. PR #730 ("fix: clamp retry delay") merged
    into main. You created retrospective #731.

    One missing-deterministic-gate repair occurred: a new branch in
    `retry.py` had no test, and review caught it.

    The Step 4b review returned `ABSORBED-BY legacy-branch-coverage`.
    Re-reading `.gitapex/ssot.json` shows that gate declares
    `generic_mechanism: true`, but its `status` is `deprecated`. The sweep
    counted 47 open gate-proposal issues at 2026-09-24T16:00:00Z.

    If you file through the NEW flow, `gitapex_file_gate_proposal.py`
    returns the title
    `gate-proposal: retro #731 repair 1: Untested retry branch`. No issue
    has that title. Creating it and re-fetching confirms #716.

    No operator is available to respond. Write the retrospective body.
expected:
  output_contains:
    - "gate-proposal: retro #731 repair 1"
    - "Filed as: #716"
  output_not_contains:
    - "Absorbed by:"
    - "gate-proposal: extend legacy-branch-coverage"
