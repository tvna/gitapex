id: merge-retrospective-gate-proposal-absorbed-unknown-gate-falls-back-to-new
name: ABSORBED-BY Naming A Gate Missing From The Registry Falls Back To NEW
description: The review's ABSORBED-BY verdict names a gate id that does not exist in the ssot registry at all. Verification outside the dispatch rejects it, and the repair files through the NEW flow with no Absorbed by line and no extend issue.
tags:
  - quality
  - gate-proposal
  - absorbed
  - restraint
inputs:
  prompt: |
    Use merge-retrospective. PR #720 ("feat: add dry-run flag") merged
    into main. You created retrospective #721.

    One missing-deterministic-gate repair occurred: a new CLI flag had no
    test for its error branch, and review caught it.

    The Step 4b review returned `ABSORBED-BY mutation-everything`.
    Re-reading `.gitapex/ssot.json` shows no gate with the id
    `mutation-everything`. The sweep counted 46 open gate-proposal issues
    at 2026-09-24T15:00:00Z.

    If you file through the NEW flow, `gitapex_file_gate_proposal.py`
    returns the title
    `gate-proposal: retro #721 repair 1: Untested flag error branch`. No
    issue has that title. Creating it and re-fetching confirms #715.

    No operator is available to respond. Write the retrospective body.
expected:
  output_contains:
    - "gate-proposal: retro #721 repair 1"
    - "Filed as: #715"
  output_not_contains:
    - "Absorbed by:"
    - "gate-proposal: extend mutation-everything"
