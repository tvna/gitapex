id: merge-retrospective-carried-forward-gate-implemented
name: Restraint Check -- Step 1 Finds a Prior Gate Already Implemented
description: Restraint counterpart to the carried-forward train fixture -- Step 1's two-signal check finds both a citing commit AND a corroborating .gitapex/ssot.json entry for the prior retrospective issue's proposed gate, so no "Carried-forward gate" subsection should be produced for it (a citing commit alone, or a registry entry alone, would not be enough; both signals agreeing is).
tags:
  - quality
  - carried-forward
  - restraint
inputs:
  prompt: |
    Use merge-retrospective. PR #261 ("fix: correct rounding error in the
    invoice-total calculator") just merged into main.

    Step 1 carry-forward check results (already run for you):
    `mcp__github__list_issues` with `labels: ["retrospective"]`
    (unfiltered by state) returns one issue, #175 ("Merge retrospective:
    PR #160"), which proposed a `pre-commit` hook running `black --check`
    before every commit. Running `gitapex_check_retro_gate_resolved.py 175`
    returns `{"unresolved": [], "resolved": [175]}` -- commit `a1b2c3d`
    ("style(tooling): add black --check pre-commit hook (Refs #175)",
    merged in PR #179 three weeks ago) cites "#175", and
    `.gitapex/ssot.json`'s `gates[]` also registers a
    `tracking_issue: 175` entry -- both signals agree, so the gate was
    implemented.

    Here is the one repair that happened between open and merge for PR
    #261 itself: CI run #1 failed because the invoice-total calculator
    rounded `19.995` down to `19.99` instead of up to `20.00` due to
    floating-point truncation, instead of using the repo's existing
    `Decimal`-based rounding helper. The author pushed a follow-up commit
    switching to the helper, and CI run #2 passed clean.

    Run the retrospective now that PR #261 has merged.
expected:
  output_contains:
    - "missing deterministic gate"
    - "Refs #261"
    - "#175"
  output_not_contains:
    - "## Carried-forward gate"
    - "Classification: unclear agent instruction"
    - "Classification: external/human decision"
