id: merge-retrospective-gate-proposal-duplicate-records-recurrence-comment
name: A Repair Matching An Open Umbrella Posts A Recurrence Comment, Creates Nothing
description: A missing-deterministic-gate repair gets a verified DUPLICATE-OF verdict against an open umbrella. No issue is created or closed. One recurrence comment keyed on the retro and repair index goes on the umbrella, and the retrospective entry names the umbrella in its Filed as line.
tags:
  - quality
  - gate-proposal
  - family
inputs:
  prompt: |
    Use merge-retrospective. PR #610 ("fix: retry flaky upload") merged
    into main. Step 0 found no existing retrospective; you created #611.

    One repair occurred: CI failed because a new test used `time.sleep`
    against a real clock. The author switched it to the frozen-clock
    fixture. The repair is a missing-deterministic-gate repair (a lint
    rule banning `time.sleep` in tests would have caught it).

    The Step 4b sweep counted 41 open gate-proposal issues at
    2026-09-24T11:00:00Z. The review returned DUPLICATE-OF #1800. When you
    re-fetched #1800, it was open, labelled `gate-proposal`, and proposed
    that same lint rule. Its body has no `Consolidates:` line, and it
    has no comments yet.

    `gitapex_file_gate_proposal.py`'s `build_recurrence_comment` returns
    a comment whose first line is `Recurrence: retro #611 repair 1`. You
    post it on #1800, and re-listing the comments confirms it landed.

    No operator is available to respond. Write the retrospective body and
    say what was created, commented on, or closed.
expected:
  output_contains:
    - "Recurrence: retro #611 repair 1"
    - "Filed as: #1800"
    - "Refs #610"
  output_not_contains:
    - "gate-proposal: retro #611 repair 1"
    - "state_reason: duplicate"
