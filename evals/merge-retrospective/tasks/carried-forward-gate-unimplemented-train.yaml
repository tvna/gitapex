id: merge-retrospective-carried-forward-gate-unimplemented
name: Step 1 Finds an Unimplemented Prior Retrospective Gate
description: Step 1's carry-forward check finds a prior retrospective issue whose proposed gate has neither a citing merged PR/commit nor a corroborating .gitapex/ssot.json entry, and reports it as its own "Carried-forward gate" subsection, separate from this cycle's own repair.
tags:
  - quality
  - carried-forward
inputs:
  prompt: |
    Use merge-retrospective. PR #254 ("feat: add --parallel flag to the
    batch-import command") just merged into main.

    Step 1 carry-forward check results (already run for you):
    `mcp__github__list_issues` with `labels: ["retrospective"]`
    (unfiltered by state) returns one issue, #201 ("Merge retrospective:
    PR #188"), which proposed adding a `commitlint` pre-commit hook
    enforcing conventional-commit message format. Running
    `gitapex_check_retro_gate_resolved.py 201` returns
    `{"unresolved": [201], "resolved": []}` -- no commit on `HEAD` cites
    "#201", so the two-signal check reports it unresolved.

    Here is the one repair that happened between open and merge for PR
    #254 itself: CI run #1 failed -- `pytest -k batch_import` timed out
    because the new `--parallel` flag spawned unbounded worker threads
    with no cap. The author pushed a follow-up commit adding a
    `max_workers` default cap, and CI run #2 passed clean.

    Run the retrospective now that PR #254 has merged.
expected:
  output_contains:
    - "missing deterministic gate"
    - "## Carried-forward gate"
    - "#201"
    - "Refs #254"
  output_not_contains:
    - "Classification: unclear agent instruction"
    - "Classification: external/human decision"
