name: merge-retrospective-eval
description: Quality suite for the gitapex merge-retrospective skill.
skill: merge-retrospective
version: "0.1.0"
config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: merge_retrospective_quality
    weight: 1.0
    threshold: 0.8
    description: Every repair is enumerated and classified under the fixed three-category taxonomy, durable gates are proposed (not implemented) for gate-category repairs, and the retrospective issue cross-links the merged PR number -- even when the cycle had zero repairs.
tasks:
  - "tasks/*.yaml"
