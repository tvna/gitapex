id: drafting-issues-non-applicable-chore
name: Chore Request Recognizes ACM Does Not Apply
description: Classifies a chore-type request and stops rather than forcing an Acceptance Criteria Map onto a shape that does not carry one.
tags:
  - quality
inputs:
  prompt: |
    Use drafting-issues. Open an issue to bump the pinned pytest
    version in pyproject.toml to the latest release. No behavior change.
expected:
  output_contains:
    - "out of this skill's scope"
  output_not_contains:
    - "Acceptance Criteria Map"
    - "LGTM"
