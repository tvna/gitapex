id: drafting-issues-fix-type-unknown-columns
name: Bug Report With No Known Root Cause Yet
description: For a fix-type request with clear observed facts but no known cause, marks Interpretation/Planned-ops as an explicit "unknown, pending reproduction" entry rather than fabricating a plausible cause or leaving the column blank.
tags:
  - quality
inputs:
  prompt: |
    Use drafting-issues. Open a new bug-report issue: search
    sometimes returns duplicate results for the same query. I've seen
    it happen but don't know why yet -- haven't dug into the cause.
expected:
  output_contains:
    - "Acceptance Criteria Map"
    - "unknown, pending"
  output_not_contains:
    - "LGTM"
