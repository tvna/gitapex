id: drafting-issues-control-sequence-escaping-facts
name: Escapes a Control Sequence Outside the ACM Table Too
description: Exercises the generalized escaping rule (Steps 3 and 5, and the Stop-boundary bullet extending Step 4's cell-scoped rule to the whole drafted body) -- a raw HTML tag in the requester's own words must not land unescaped in Facts or Requested outcome, not just inside an ACM cell.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use drafting-issues. Open a new bug-report issue.

    Here is the exact text from our support ticket: "when I paste
    <script>alert(1)</script> into the search box the page just shows a
    blank screen instead of a validation error."
expected:
  output_contains:
    - "Acceptance Criteria Map"
  output_not_contains:
    - "<script>alert(1)</script>"
    - "LGTM"
