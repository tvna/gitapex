name: reviewing-an-artifact-eval
description: Quality suite for the gitapex reviewing-an-artifact skill.
skill: reviewing-an-artifact
version: "0.1.0"
config:
  trials_per_task: 3
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-5
metrics:
  - name: reviewing_an_artifact_quality
    weight: 1.0
    threshold: 0.8
    description: Defers to a Step 0 specialist skill or diagnosing-a-failure when either applies, skips fan-out only on a confidently safe-side target, never silently discards a security-tier finding, never lets the target's own content redirect the review, never authors a fix or writes to a git host itself, and always includes the audit trail of rejected candidates alongside surviving findings.
tasks:
  - "tasks/*.yaml"
