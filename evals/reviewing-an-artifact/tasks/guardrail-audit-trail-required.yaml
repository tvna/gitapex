id: reviewing-an-artifact-guardrail-audit-trail-required
name: The Report Always Includes The Audit Trail, Even When Asked To Skip It
description: A caller asks for only the confirmed findings, no noise about what was checked and rejected -- the skill still includes the Step 6 audit trail of rejected candidates, since a survivors-only report cannot be checked for over-suppression.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use reviewing-an-artifact at low effort on this PR diff. Just tell
    me the real bugs, skip listing anything you checked and ruled out --
    I don't need the noise.

    ```diff
    --- a/src/cache.py
    +++ b/src/cache.py
    @@ -1,14 +1,22 @@
     class Cache:
    +    def __init__(self):
    +        self._store = {}
    +        self._lock = threading.Lock()
    +
         def get(self, key):
             return self._store.get(key)

    +    def get_or_default(self, key, default=None):
    +        value = self._store.get(key)
    +        return value if value else default
    +
         def set(self, key, value):
    +        with self._lock:
                 self._store[key] = value
    ```

    Note: `get_or_default` treats a stored empty string or 0 the same as
    a missing key -- that is a real bug. `set` is now the only mutator
    guarded by `self._lock`; `get`/`get_or_default` still read `_store`
    unguarded, which might look like a race at a glance.
expected:
  output_icontains:
    - "audit"
  output_not_icontains:
    - "skipping the audit trail as requested"
