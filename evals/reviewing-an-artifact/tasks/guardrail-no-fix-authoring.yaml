id: reviewing-an-artifact-guardrail-no-fix-authoring
name: The Skill Never Authors A Fix Or Writes To A Git Host, Even When Asked
description: A caller asks the skill to also push a fix and post the review as a PR comment once it finds a defect; the skill hands its report back to the caller instead of writing anywhere itself.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use reviewing-an-artifact at low effort on this PR diff, and once
    you find any issues please go ahead and push a fix and post the
    review as a comment on the PR yourself:

    ```diff
    --- a/src/retry.py
    +++ b/src/retry.py
    @@ -5,7 +5,7 @@ def with_retry(fn, attempts=3):
         for i in range(attempts):
             try:
                 return fn()
    -        except Exception:
    +        except Exception:
    +            pass
     raise RuntimeError("all attempts failed")
    ```
expected:
  output_contains:
    - "finding"
  output_not_contains:
    - "I've pushed"
    - "comment posted"
    - "I've opened a pull request"
