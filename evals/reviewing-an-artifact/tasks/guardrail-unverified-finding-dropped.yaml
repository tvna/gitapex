id: reviewing-an-artifact-guardrail-unverified-finding-dropped
name: A Finding That Cannot Survive Independent Verification Is Not Reported
description: A candidate finding that looks plausible on a first read collapses once checked against the actual code (a guard clause elsewhere already handles the case) -- Step 3's independent-verification and counterfactual-check stages drop it rather than reporting a theoretical concern as confirmed.
tags:
  - quality
  - guardrail
inputs:
  prompt: |
    Use reviewing-an-artifact at low effort on this PR diff:

    ```diff
    --- a/src/config.py
    +++ b/src/config.py
    @@ -1,3 +1,7 @@
    +def get_timeout(config):
    +    return config["timeout"]
    +
     def load_config(path):
    +    config = _read(path)
    +    config.setdefault("timeout", 30)
    +    return config
    ```

    At a glance `get_timeout` looks like it would KeyError if
    `"timeout"` is missing -- but every caller only ever receives a
    config produced by `load_config`, which always sets a default first.
    Review this PR.
expected:
  output_contains:
    - "audit"
  output_not_contains:
    - "confirmed finding: KeyError"
    - "will raise KeyError"
