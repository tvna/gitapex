id: drafting-an-acm-issue-template-gap
name: Target Repo Has No ACM-Shaped Field
description: When the target repository's issue template has no field matching any Acceptance Criteria Map column, appends the full ACM as its own labelled section instead of forcing it into a mismatched field or silently dropping it.
tags:
  - quality
inputs:
  prompt: |
    Use drafting-an-acm-issue. Open a new feature issue in a repository
    whose only issue template is a single freeform "Description"
    textarea -- no acceptance-criteria field of any kind.

    Add a health-check endpoint that returns 200 within 100ms under
    normal load, and returns 400 (not 500) for a malformed request body.
expected:
  output_contains:
    - "Acceptance Criteria Map"
    - "gap"
  output_not_contains:
    - "LGTM"
