id: drafting-an-acm-issue-parent-tracking-issue-linking
name: Links The Drafted Issue Under A Supplied Parent Tracking Issue
description: When the caller supplies a parent tracking-issue number (for example from eliciting-a-design's own decomposition handoff), Step 1 records it and Step 9 links the newly drafted issue under it -- disclosed in the output's Parent line -- rather than silently dropping the supplied number.
tags:
  - quality
inputs:
  prompt: |
    Use drafting-an-acm-issue in this repository (gitapex). This is
    sub-project 2 of 4 from a decomposition already recorded under
    parent tracking issue #500. Draft the issue for this sub-project:

    Add a `--verbose` flag to the export CLI that prints each file as it
    is written, so a user can see progress during a large export.
expected:
  output_contains:
    - "Parent"
    - "#500"
  output_not_contains:
    - "LGTM"
